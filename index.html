<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Palet W + S – Mateusz</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 30px auto; padding: 20px; background: #f8f9fa; }
        h1 { color: #c82333; text-align: center; }
        .opis { background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
        form { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin: 15px 0 6px; }
        input { width: 100%; padding: 12px; font-size: 17px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #218838; }
        #wynik { margin-top: 30px; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); line-height: 1.7; }
        .section { margin: 15px 0; padding: 12px; background: #e9ecef; border-radius: 6px; }
        .alert { color: #dc3545; font-weight: bold; }
        .info { color: #6c757d; font-size: 0.95em; }
        #schemat { border: 1px solid #ccc; background: #f0f0f0; margin-top: 20px; display: block; width: 100%; height: 150px; }
    </style>
</head>
<body>
    <h1>Kalkulator mieszany W + S (naczepa 13,6 m)</h1>

    <div class="opis">
        <strong>W:</strong> zawsze parami (2,4 m szer. × 1,0 m dł./rząd)<br>
        <strong>S:</strong> priorytet trójki (2,4×1,2 m), potem minimalne dwójki na początku S (2,4×0,8 m)<br>
        <strong>Mieszanka:</strong> jeśli nieparzysta liczba W → ostatnia W + 1 S jako mieszana dwójka (2,4×0,8 m)
    </div>

    <form id="form">
        <label>Ilość palet W:</label>
        <input type="number" id="w" min="0" value="0" required>

        <label>Ilość palet S:</label>
        <input type="number" id="s" min="0" value="0" required>

        <button type="submit">Oblicz układ</button>
    </form>

    <div id="wynik"></div>

    <script>
        document.getElementById('form').addEventListener('submit', e => {
            e.preventDefault();

            let w = parseInt(document.getElementById('w').value) || 0;
            let s = parseInt(document.getElementById('s').value) || 0;
            if (w === 0 && s === 0) return;

            const L = 13.6;
            const W_ROW_LEN = 1.0;
            const S_TRIO_LEN = 1.2;
            const S_DUO_LEN = 0.8;
            const MIX_DUO_LEN = 0.8; // mieszana W+S

            let html = `<h3>${w} W + ${s} S</h3>`;

            let occupied = 0;
            let sections = [];
            let drawData = []; // dane do grafiki: [typ, dlugosc, kolor]

            // 1. Pełne pary W na początku
            let fullWpairs = Math.floor(w / 2);
            let occupiedW = fullWpairs * W_ROW_LEN;
            occupied += occupiedW;
            if (fullWpairs > 0) {
                sections.push(`Przód: ${fullWpairs} × para W (po 2 szt., każdy rząd 1,0 m)`);
                drawData.push({type: 'W para', count: fullWpairs, len: W_ROW_LEN, color: 'blue'});
            }

            let leftoverW = w % 2;

            // 2. Mieszana dwójka jeśli 1 W zostaje
            let mixedDuo = 0;
            if (leftoverW === 1 && s >= 1) {
                mixedDuo = 1;
                occupied += MIX_DUO_LEN;
                sections.push(`Mieszana dwójka: 1 W + 1 S (rząd 0,8 m)`);
                drawData.push({type: 'Mieszana', count: 1, len: MIX_DUO_LEN, color: 'purple'});
                s -= 1;  // zużyta 1 S
                leftoverW = 0;
            }

            // 3. Reszta S – optymalne trójki + minimalne dwójki na początku S
            let duoS = 0;
            let trioS = 0;
            let bestK = Infinity;

            for (let k = 0; k <= 10; k++) {  // max 10 dwójek na początku S
                let remS = s - k * 2;
                if (remS < 0 || remS % 3 !== 0) continue;

                let t = remS / 3;
                let lenS = k * S_DUO_LEN + t * S_TRIO_LEN;
                let totalLen = occupied + lenS;

                if (totalLen <= L && k < bestK) {
                    bestK = k;
                    duoS = k;
                    trioS = t;
                }
            }

            if (bestK === Infinity) {
                html += '<p class="alert">Nie da się optymalnie ułożyć S (zbyt dużo resztek lub przekroczona długość).</p>';
            } else {
                occupied += duoS * S_DUO_LEN + trioS * S_TRIO_LEN;

                if (duoS > 0) {
                    sections.push(`Początek S: ${duoS} × dwójka S (każdy 0,8 m)`);
                    drawData.push({type: 'S dwójka', count: duoS, len: S_DUO_LEN, color: 'yellow'});
                }
                if (trioS > 0) {
                    sections.push(`Koniec: ${trioS} × trójka S (każdy 1,2 m)`);
                    drawData.push({type: 'S trójka', count: trioS, len: S_TRIO_LEN, color: 'green'});
                }

                let free = L - occupied;

                html += `<p><strong>Załadowano:</strong> ${w - leftoverW} W + ${s + (mixedDuo ? 1 : 0)} S (z ${w} W i ${s + (mixedDuo ? 1 : 0)} S ogółem)</p>`;
                html += `<p><strong>Zajęta długość:</strong> ${occupied.toFixed(2)} m</p>`;
                html += `<p><strong>Wolne z tyłu:</strong> ${free.toFixed(2)} m`;
                if (free < 0) html += ' <span class="alert">→ PRZEKROCZONO!</span>';
                else if (free < 0.4) html += ' <span style="color:orange;">→ bardzo ciasno</span>';
                html += '</p>';

                html += '<p><strong>Układ od przodu do tyłu:</strong></p>';
                sections.forEach(sec => {
                    html += `<div class="section">${sec}</div>`;
                });

                if (leftoverW === 1) {
                    html += '<p class="alert">Została 1 W – nie załadowana (brak pary i brak S do mieszanej dwójki)</p>';
                }

                // Dodaj canvas dla grafiki
                html += '<h4>Schemat naczepy (widok z góry, skala przybliżona)</h4>';
                html += '<canvas id="schemat"></canvas>';
                html += '<p class="info">Niebieski: W para, Fioletowy: Mieszana W+S, Żółty: S dwójka, Zielony: S trójka, Szary: wolne miejsce</p>';
            }

            document.getElementById('wynik').innerHTML = html;

            // Rysuj grafikę jeśli canvas istnieje
            const canvas = document.getElementById('schemat');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                const scale = canvas.width / L; // skala: szerokość canvas = 13.6 m
                canvas.height = 150; // wysokość dla szerokości naczepy ~2.5 m
                const naczepaHeight = 100; // reprezentacja szerokości

                // Narysuj naczepę (tło)
                ctx.fillStyle = '#ddd';
                ctx.fillRect(0, 20, canvas.width, naczepaHeight);

                // Narysuj rzędy
                let x = 0;
                drawData.forEach(item => {
                    for (let i = 0; i < item.count; i++) {
                        ctx.fillStyle = item.color;
                        const width = item.len * scale;
                        ctx.fillRect(x, 20, width, naczepaHeight);
                        ctx.fillStyle = '#fff';
                        ctx.font = '12px Arial';
                        ctx.fillText(item.type[0], x + width / 2 - 5, 20 + naczepaHeight / 2);
                        x += width;
                    }
                });

                // Wolne miejsce z tyłu
                if (x < canvas.width) {
                    ctx.fillStyle = 'gray';
                    ctx.fillRect(x, 20, canvas.width - x, naczepaHeight);
                }

                // Oznaczenia
                ctx.fillStyle = '#000';
                ctx.font = '14px Arial';
                ctx.fillText('Przód', 5, 15);
                ctx.fillText('Tył', canvas.width - 30, 15);
            }
        });
    </script>
</body>
</html>
