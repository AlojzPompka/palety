<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Palet W + S – Mateusz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 30px auto;
            padding: 20px;
            background: #f8f9fa;
        }
        h1 {
            color: #c82333;
            text-align: center;
        }
        .opis {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        label {
            font-weight: bold;
            display: block;
            margin: 15px 0 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #218838;
        }
        #wynik {
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            line-height: 1.7;
        }
        .section {
            margin: 15px 0;
            padding: 12px;
            background: #e9ecef;
            border-radius: 6px;
        }
        .alert {
            color: #dc3545;
            font-weight: bold;
        }
        .info {
            color: #6c757d;
            font-size: 0.95em;
        }
        #schemat {
            border: 1px solid #999;
            background: #f8f9fa;
            margin-top: 20px;
            display: block;
            width: 100%;
            height: 600px;
        }
    </style>
</head>
<body>
    <h1>Kalkulator mieszany W + S (naczepa 13,6 m)</h1>

    <div class="opis">
        <strong>W:</strong> zawsze parami (2,4 m szer. × 1,0 m dł./rząd)<br>
        <strong>S:</strong> priorytet trójki (2,4×1,2 m), potem minimalne dwójki na początku S (2,4×0,8 m)<br>
        <strong>Mieszanka:</strong> jeśli nieparzysta liczba W → ostatnia W + 1 S jako mieszana dwójka (2,4×0,8 m)
    </div>

    <form id="form">
        <label>Ilość palet W:</label>
        <input type="number" id="w" min="0" value="0" required>

        <label>Ilość palet S:</label>
        <input type="number" id="s" min="0" value="0" required>

        <button type="submit">Oblicz układ</button>
    </form>

    <div id="wynik"></div>

    <script>
        document.getElementById('form').addEventListener('submit', e => {
            e.preventDefault();

            let w = parseInt(document.getElementById('w').value) || 0;
            let s = parseInt(document.getElementById('s').value) || 0;
            if (w === 0 && s === 0) return;

            const TOTAL_LENGTH = 13.6;
            const W_ROW_LEN    = 1.0;
            const S_TRIO_LEN   = 1.2;
            const S_DUO_LEN    = 0.8;
            const MIX_DUO_LEN  = 0.8;

            let occupied = 0;
            let sections = [];
            let rows = []; // {type, length, paletsCount, paletsPerRow}

            // ─── Pełne pary W ───────────────────────────────────────
            let fullWpairs = Math.floor(w / 2);
            if (fullWpairs > 0) {
                occupied += fullWpairs * W_ROW_LEN;
                sections.push(`Przód: ${fullWpairs} × para W (po 2 szt., 1,0 m)`);
                rows.push({type: 'W-pair', length: W_ROW_LEN, paletsCount: fullWpairs * 2, paletsPerRow: 2});
            }

            let leftoverW = w % 2;

            // ─── Mieszana dwójka W + S ──────────────────────────────
            let mixed = false;
            if (leftoverW === 1 && s >= 1) {
                mixed = true;
                occupied += MIX_DUO_LEN;
                sections.push(`Mieszana: 1 W + 1 S (0,8 m)`);
                rows.push({type: 'mixed', length: MIX_DUO_LEN, paletsCount: 2, paletsPerRow: 2});
                s -= 1;
            }

            // ─── Optymalne S (minimalna liczba dwójek na początku) ──
            let duoS = 0, trioS = 0, bestK = Infinity;
            for (let k = 0; k <= 10; k++) {
                let rem = s - k * 2;
                if (rem < 0 || rem % 3 !== 0) continue;
                let t = rem / 3;
                let len = k * S_DUO_LEN + t * S_TRIO_LEN;
                if (occupied + len <= TOTAL_LENGTH && k < bestK) {
                    bestK = k;
                    duoS = k;
                    trioS = t;
                }
            }

            if (bestK !== Infinity && s > 0) {
                occupied += duoS * S_DUO_LEN + trioS * S_TRIO_LEN;
                if (duoS > 0) {
                    sections.push(`S dwójki: ${duoS} rzędów (0,8 m każdy)`);
                    rows.push({type: 'S-duo', length: S_DUO_LEN, paletsCount: duoS * 2, paletsPerRow: 2});
                }
                if (trioS > 0) {
                    sections.push(`S trójki: ${trioS} rzędów (1,2 m każdy)`);
                    rows.push({type: 'S-trio', length: S_TRIO_LEN, paletsCount: trioS * 3, paletsPerRow: 3});
                }
            }

            let free = TOTAL_LENGTH - occupied;

            let html = `<h3>${w} W + ${s + (mixed ? 1 : 0)} S</h3>`;
            html += `<p><strong>Zajęte:</strong> ${occupied.toFixed(2)} m</p>`;
            html += `<p><strong>Wolne:</strong> ${free.toFixed(2)} m ${free < 0 ? '<span class="alert">(przekroczono!)</span>' : ''}</p>`;

            if (sections.length > 0) {
                html += '<p><strong>Układ od przodu:</strong></p>';
                sections.forEach(s => html += `<div class="section">${s}</div>`);
            }

            if (leftoverW === 1 && !mixed) {
                html += '<p class="alert">Została 1 paleta W – nie załadowana (brak pary i brak S do mieszanki)</p>';
            }

            html += '<h4>Schemat naczepy – pionowo (przód na górze)</h4>';
            html += '<canvas id="schemat" width="340" height="620"></canvas>';
            html += '<p class="info">Każdy prostokąt = jedna paleta • Niebieski = W • Zielony = S trójka • Żółty = S dwójka • Fiolet = mieszana • Szary = wolne</p>';

            document.getElementById('wynik').innerHTML = html;

            // ────────────────────────────────────────────────
            // Rysowanie pionowego schematu – KAŻDA paleta osobno
            const canvas = document.getElementById('schemat');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const scaleY = (canvas.height - 60) / TOTAL_LENGTH;   // marginesy góra/dół
            const leftMargin = 50;
            const rightMargin = 50;
            const fullWidth = canvas.width - leftMargin - rightMargin;

            let y = 30;   // start od góry

            // Tło naczepy
            ctx.fillStyle = '#e8ecef';
            ctx.fillRect(leftMargin, 30, fullWidth, canvas.height - 60);

            // Skala co 1 m
            ctx.strokeStyle = '#ccc';
            ctx.lineWidth = 1;
            for (let m = 1; m < TOTAL_LENGTH; m++) {
                let yy = 30 + m * scaleY;
                ctx.beginPath();
                ctx.moveTo(leftMargin, yy);
                ctx.lineTo(canvas.width - rightMargin, yy);
                ctx.stroke();
            }

            // Rysujemy rzędy od góry
            rows.forEach(row => {
                const rowHeight = row.length * scaleY;
                const paletWidth = fullWidth / row.paletsPerRow;

                for (let i = 0; i < row.paletsPerRow; i++) {
                    let palX = leftMargin + i * paletWidth;
                    let palY = y;
                    let palH = rowHeight;

                    // Kolor w zależności od typu rzędu
                    if (row.type === 'W-pair') {
                        ctx.fillStyle = '#007bff';      // niebieski – W
                    } else if (row.type === 'mixed') {
                        ctx.fillStyle = i === 0 ? '#6f42c1' : '#20c997'; // fiolet W, turkus S
                    } else if (row.type === 'S-duo') {
                        ctx.fillStyle = '#ffc107';      // żółty – dwójka S
                    } else if (row.type === 'S-trio') {
                        ctx.fillStyle = '#28a745';      // zielony – trójka S
                    }

                    ctx.fillRect(palX, palY, paletWidth, palH);

                    // Obrys każdej palety
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(palX, palY, paletWidth, palH);

                    // Etykieta wewnątrz palety
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(row.type.includes('W') ? 'W' : 'S', palX + paletWidth/2, palY + palH/2);
                }

                y += rowHeight;
            });

            // Wolne miejsce na dole
            if (y < canvas.height - 30) {
                ctx.fillStyle = '#adb5bd';
                ctx.fillRect(leftMargin, y, fullWidth, canvas.height - 30 - y);
                ctx.fillStyle = '#495057';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('WOLNE MIEJSCE', canvas.width/2, y + (canvas.height - 30 - y)/2);
            }

            // Napisy PRZÓD / TYŁ
            ctx.fillStyle = '#212529';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PRZÓD naczepy', canvas.width/2, 18);
            ctx.fillText('TYŁ naczepy', canvas.width/2, canvas.height - 8);
        });
    </script>
</body>
</html>
