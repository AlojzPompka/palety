<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0b0f0c">

<link rel="manifest" href="./manifest.webmanifest">

<title>Powrót do hulajnogi</title>

<style>

*{

    box-sizing:border-box

}

html,body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#0b0f0c;

    color:#fff;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

#scene{

    position:fixed;

    inset:0;

    background:

        radial-gradient(

            circle at center,

            rgba(255,255,255,.05) 0 1px,

            transparent 1.5px

        ) 0 0/28px 28px,

        linear-gradient(#111813,#0b0f0c)

}

#radar{

    position:absolute;

    inset:0;

    width:100%;

    height:100%

}

#top,

#bottom{

    position:fixed;

    z-index:20;

    left:12px;

    right:12px;

    padding:12px;

    border-radius:18px;

    background:rgba(8,12,9,.92);

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px)

}

#top{

    top:max(12px,env(safe-area-inset-top))

}

#bottom{

    bottom:max(12px,env(safe-area-inset-bottom));

    padding:10px

}

#status,

#sensor,

#hint{

    font-size:13px;

    color:#adb5ae;

    text-align:center

}

#distance{

    text-align:center;

    font-size:34px;

    font-weight:850;

    margin-top:3px

}

#sensor,

#hint{

    margin-top:4px

}

#fixedArrow{

    position:fixed;

    z-index:15;

    left:50%;

    top:calc(50% - 118px);

    transform:translateX(-50%);

    display:none;

    text-align:center;

    pointer-events:none

}

#fixedArrow .arrow{

    font-size:68px;

    line-height:.8;

    color:#fff;

    filter:

        drop-shadow(

            0 3px 7px

            rgba(0,0,0,.9)

        )

}

#fixedArrow .label{

    font-size:12px;

    font-weight:900;

    color:#adb5ae;

    margin-top:8px

}

.buttons{

    display:flex;

    gap:8px

}

button{

    flex:1;

    border:0;

    border-radius:14px;

    min-height:52px;

    padding:10px 7px;

    font-size:15px;

    font-weight:800

}

#park{

    background:#31d158;

    color:#001a07

}

#back{

    background:#ff9f0a;

    color:#1d0d00

}

#reset{

    background:#ff453a;

    color:#fff

}

.badge{

    display:inline-block;

    padding:2px 7px;

    margin-left:5px;

    border-radius:10px;

    background:rgba(255,255,255,.08)

}

</style>

</head>

<body>

<div id="scene">

    <canvas id="radar"></canvas>

</div>

<div id="top">

    <div id="status">

        Czekam na GPS…

    </div>

    <div id="distance">

        —

    </div>

    <div id="sensor">

        Telefon: — · hulajnoga wzgl. telefonu: —

    </div>

    <div id="hint">

        Przy hulajnodze naciśnij ZAPARKOWAŁEM.

    </div>

</div>

<div id="fixedArrow">

    <div class="arrow">

        ↑

    </div>

    <div class="label">

        PRZÓD TELEFONU

    </div>

</div>

<div id="bottom">

    <div class="buttons">

        <button id="park">

            🛴 ZAPARKOWAŁEM

        </button>

        <button id="back">

            ↩️ WRÓĆ

        </button>

        <button id="reset">

            RESET

        </button>

    </div>

</div>

<script>

"use strict";

const BUILD = "v10-relative-live";

const $ =

    id =>

    document.getElementById(id);

const canvas =

    $("radar");

const ctx =

    canvas.getContext("2d");

let current =

    null;

let scooter =

    null;

let returnMode =

    false;

/*

Kierunek telefonu w stopniach.

0 = północ

90 = wschód

180 = południe

270 = zachód

*/

let phoneHeading =

    null;

/*

Dane do śledzenia obrotu telefonu.

*/

let lastAlpha =

    null;

let lastWk =

    null;

let lastWkMove =

    0;

let lastSensorTime =

    0;

let compassStarted =

    false;

/* =========================================

   WCZYTANIE ZAPISANEJ HULAJNOGI

========================================= */

try {

    const raw =

        localStorage.getItem(

            "scooterPosition"

        )

        ||

        localStorage.getItem(

            "carPosition"

        );

    if(raw) {

        const p =

            JSON.parse(raw);

        const lat =

            Number(p.lat);

        const lng =

            Number(p.lng);

        if(

            Number.isFinite(lat)

            &&

            Number.isFinite(lng)

        ) {

            scooter = {

                lat,

                lng

            };

        }

    }

}

catch(error) {

    scooter =

        null;

}

if(scooter) {

    $("park").style.display =

        "none";

}

/* =========================================

   KĄTY

========================================= */

function normalize360(a) {

    return (

        (

            a % 360

        )

        +

        360

    ) % 360;

}

function normalize180(a) {

    return (

        (

            (

                a + 180

            )

            % 360

            +

            360

        )

        % 360

    ) - 180;

}

/* =========================================

   ORIENTACJA EKRANU

========================================= */

function screenAngle() {

    if(

        screen.orientation

        &&

        Number.isFinite(

            screen.orientation.angle

        )

    ) {

        return screen.orientation.angle;

    }

    if(

        Number.isFinite(

            window.orientation

        )

    ) {

        return window.orientation;

    }

    return 0;

}

/* =========================================

   CANVAS

========================================= */

function resizeCanvas() {

    const dpr =

        Math.max(

            1,

            window.devicePixelRatio || 1

        );

    canvas.width =

        innerWidth *

        dpr;

    canvas.height =

        innerHeight *

        dpr;

    canvas.style.width =

        innerWidth +

        "px";

    canvas.style.height =

        innerHeight +

        "px";

    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );

    drawRadar();

}

window.addEventListener(

    "resize",

    resizeCanvas

);

resizeCanvas();

/* =========================================

   ODLEGŁOŚĆ

   POPRAWIONE NaN

========================================= */

function distanceM(

    lat1,

    lon1,

    lat2,

    lon2

) {

    lat1 =

        Number(lat1);

    lon1 =

        Number(lon1);

    lat2 =

        Number(lat2);

    lon2 =

        Number(lon2);

    if(

        ![

            lat1,

            lon1,

            lat2,

            lon2

        ].every(

            Number.isFinite

        )

    ) {

        return 0;

    }

    const R =

        6371000;

    const p1 =

        lat1 *

        Math.PI /

        180;

    const p2 =

        lat2 *

        Math.PI /

        180;

    const dp =

        (

            lat2 -

            lat1

        )

        *

        Math.PI /

        180;

    const dl =

        (

            lon2 -

            lon1

        )

        *

        Math.PI /

        180;

    const a =

        Math.sin(

            dp / 2

        ) ** 2

        +

        Math.cos(p1) *

        Math.cos(p2) *

        Math.sin(

            dl / 2

        ) ** 2;

    return R * 2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );

}

/* =========================================

   KIERUNEK GPS DO HULAJNOGI

========================================= */

function bearingDeg(

    lat1,

    lon1,

    lat2,

    lon2

) {

    const p1 =

        Number(lat1) *

        Math.PI /

        180;

    const p2 =

        Number(lat2) *

        Math.PI /

        180;

    const dl =

        (

            Number(lon2)

            -

            Number(lon1)

        )

        *

        Math.PI /

        180;

    const y =

        Math.sin(dl) *

        Math.cos(p2);

    const x =

        Math.cos(p1) *

        Math.sin(p2)

        -

        Math.sin(p1) *

        Math.cos(p2) *

        Math.cos(dl);

    return normalize360(

        Math.atan2(

            y,

            x

        )

        *

        180 /

        Math.PI

    );

}

/* =========================================

   DŁUGOŚĆ LINII

========================================= */

function distanceToRadius(

    distance,

    maxRadius

) {

    distance =

        Number(distance);

    if(

        !Number.isFinite(

            distance

        )

        ||

        distance <= 0

    ) {

        return 6;

    }

    const referenceDistance =

        2000;

    let ratio =

        Math.log(

            1 +

            distance / 10

        )

        /

        Math.log(

            1 +

            referenceDistance / 10

        );

    ratio =

        Math.max(

            0,

            Math.min(

                1,

                ratio

            )

        );

    return 12 +

        ratio *

        (

            maxRadius -

            12

        );

}

/* =========================================

   CZUJNIK OBRACANIA TELEFONU

   STRZAŁKA SIĘ NIE RUSZA.

   ZMIENIAMY WYŁĄCZNIE

   KIERUNEK TELEFONU.

   Potem hulajnoga obraca się

   względem tego kierunku.

========================================= */

function orientationHandler(event) {

    const now =

        Date.now();

    const alpha =

        Number.isFinite(

            event.alpha

        )

        ?

        event.alpha

        :

        null;

    /*

    iPhone Compass Heading.

    */

    const webkitHeading =

        Number.isFinite(

            event.webkitCompassHeading

        )

        &&

        event.webkitCompassHeading >= 0

        ?

        normalize360(

            event.webkitCompassHeading

        )

        :

        null;

    /*

    Pierwszy pomiar.

    */

    if(

        phoneHeading === null

    ) {

        if(

            webkitHeading !== null

        ) {

            phoneHeading =

                webkitHeading;

        }

        else if(

            alpha !== null

        ) {

            phoneHeading =

                normalize360(

                    360

                    -

                    alpha

                    +

                    screenAngle()

                );

        }

        lastAlpha =

            alpha;

        lastWk =

            webkitHeading;

        lastWkMove =

            now;

        lastSensorTime =

            now;

        updateUI();

        drawRadar();

        return;

    }

    /*

    =================================================

    ALPHA = ŻYWY OBRÓT TELEFONU

    Jeśli obrócisz telefon o 30°,

    hulajnoga na radarze ma od razu

    zmienić pozycję o 30°.

    =================================================

    */

    let headingFromAlpha =

        phoneHeading;

    if(

        alpha !== null

        &&

        lastAlpha !== null

    ) {

        const deltaAlpha =

            normalize180(

                alpha

                -

                lastAlpha

            );

        /*

        Filtrujemy tylko

        kompletnie absurdalne skoki.

        */

        if(

            Math.abs(

                deltaAlpha

            )

            <

            120

        ) {

            headingFromAlpha =

                normalize360(

                    phoneHeading

                    -

                    deltaAlpha

                );

        }

    }

    /*

    =================================================

    WEBKIT COMPASS

    Jeżeli działa i zmienia się,

    używamy dokładnego kompasu.

    Jeżeli się zawiesi,

    alpha nadal obraca radar.

    =================================================

    */

    if(

        webkitHeading !== null

    ) {

        if(

            lastWk === null

        ) {

            phoneHeading =

                webkitHeading;

            lastWkMove =

                now;

        }

        else {

            const deltaWebkit =

                normalize180(

                    webkitHeading

                    -

                    lastWk

                );

            /*

            webkit faktycznie się rusza.

            */

            if(

                Math.abs(

                    deltaWebkit

                )

                >

                0.12

            ) {

                phoneHeading =

                    webkitHeading;

                lastWkMove =

                    now;

            }

            /*

            webkit stoi,

            ale alpha się zmienia.

            */

            else if(

                now -

                lastWkMove

                >

                250

            ) {

                phoneHeading =

                    headingFromAlpha;

            }

        }

        lastWk =

            webkitHeading;

    }

    else {

        /*

        Brak webkitCompassHeading:

        lecimy z alpha.

        */

        phoneHeading =

            headingFromAlpha;

    }

    lastAlpha =

        alpha;

    lastSensorTime =

        now;

    /*

    KAŻDY OBRÓT TELEFONU

    NATYCHMIAST PRZERYSOWUJE

    HULAJNOGĘ.

    */

    updateUI();

    drawRadar();

}

/* =========================================

   START KOMPASU

========================================= */

async function startCompass() {

    if(

        compassStarted

    ) {

        return true;

    }

    try {

        /*

        iPhone wymaga zgody.

        */

        if(

            typeof

            DeviceOrientationEvent

            !==

            "undefined"

            &&

            typeof

            DeviceOrientationEvent

                .requestPermission

            ===

            "function"

        ) {

            const permission =

                await

                DeviceOrientationEvent

                    .requestPermission();

            if(

                permission !==

                "granted"

            ) {

                $("hint")

                    .textContent =

                    "Brak zgody na Ruch i orientację.";

                return false;

            }

        }

        /*

        Jeden listener.

        */

        window.addEventListener(

            "deviceorientation",

            orientationHandler,

            true

        );

        compassStarted =

            true;

        return true;

    }

    catch(error) {

        $("hint")

            .textContent =

            "Nie udało się uruchomić czujnika orientacji.";

        return false;

    }

}

/* =========================================

   GPS

========================================= */

function gpsUpdate(position) {

    const lat =

        Number(

            position.coords.latitude

        );

    const lng =

        Number(

            position.coords.longitude

        );

    const accuracy =

        Number(

            position.coords.accuracy

        );

    if(

        !Number.isFinite(lat)

        ||

        !Number.isFinite(lng)

    ) {

        return;

    }

    current = {

        lat,

        lng,

        accuracy:

            Number.isFinite(

                accuracy

            )

            ?

            accuracy

            :

            0

    };

    updateUI();

    drawRadar();

}

function gpsError(error) {

    $("status")

        .textContent =

        "Błąd GPS: "

        +

        error.message;

}

if(

    "geolocation"

    in navigator

) {

    navigator

        .geolocation

        .watchPosition(

            gpsUpdate,

            gpsError,

            {

                enableHighAccuracy:

                    true,

                maximumAge:

                    0,

                timeout:

                    15000

            }

        );

}

/* =========================================

   DANE POWROTU

========================================= */

function currentData() {

    if(

        !current

        ||

        !scooter

    ) {

        return null;

    }

    const distance =

        distanceM(

            current.lat,

            current.lng,

            scooter.lat,

            scooter.lng

        );

    /*

    Bezwzględny kierunek GPS.

    */

    const absoluteBearing =

        bearingDeg(

            current.lat,

            current.lng,

            scooter.lat,

            scooter.lng

        );

    /*

    KIERUNEK HULAJNOGI

    WZGLĘDEM PRZODU TELEFONU.

    To właśnie steruje pozycją

    hulajnogi na radarze.

    */

    const relativeBearing =

        phoneHeading === null

        ?

        absoluteBearing

        :

        normalize180(

            absoluteBearing

            -

            phoneHeading

        );

    return {

        distance,

        absoluteBearing,

        relativeBearing

    };

}

/* =========================================

   UI

========================================= */

function updateUI() {

    if(

        !current

    ) {

        $("status")

            .textContent =

            "Czekam na GPS… · "

            +

            BUILD;

        return;

    }

    const sensorLive =

        phoneHeading !== null

        &&

        (

            Date.now()

            -

            lastSensorTime

        )

        <

        1500;

    $("status")

        .innerHTML =

        `GPS ±${Math.round(

            current.accuracy

        )} m`

        +

        ` <span class="badge">${

            sensorLive

            ?

            "obrót LIVE"

            :

            "obrót —"

        }</span>`;

    if(

        scooter

        &&

        returnMode

    ) {

        const data =

            currentData();

        $("distance")

            .textContent =

            data.distance >=

            1000

            ?

            `🛴 ${

                (

                    data.distance /

                    1000

                )

                .toFixed(2)

            } km`

            :

            `🛴 ${

                Math.round(

                    data.distance

                )

            } m`;

        $("sensor")

            .textContent =

            "Telefon: "

            +

            (

                phoneHeading === null

                ?

                "—"

                :

                Math.round(

                    phoneHeading

                )

                +

                "°"

            )

            +

            " · hulajnoga wzgl. telefonu: "

            +

            Math.round(

                data.relativeBearing

            )

            +

            "° · "

            +

            BUILD;

        $("hint")

            .textContent =

            "Strzałka PRZÓD stoi. Obracaj telefon — hulajnoga i czerwona linia mają krążyć po radarze.";

        $("fixedArrow")

            .style

            .display =

            "block";

    }

    else if(

        scooter

    ) {

        $("distance")

            .textContent =

            "🛴 HULAJNOGA ZAPISANA";

        $("sensor")

            .textContent =

            BUILD;

        $("hint")

            .textContent =

            "Gdy chcesz wracać, naciśnij WRÓĆ.";

        $("fixedArrow")

            .style

            .display =

            "none";

    }

    else {

        $("distance")

            .textContent =

            "—";

        $("sensor")

            .textContent =

            BUILD;

        $("hint")

            .textContent =

            "Przy hulajnodze naciśnij ZAPARKOWAŁEM.";

        $("fixedArrow")

            .style

            .display =

            "none";

    }

}

/* =========================================

   RADAR

========================================= */

function drawRadar() {

    const width =

        innerWidth;

    const height =

        innerHeight;

    const centerX =

        width /

        2;

    const centerY =

        height /

        2;

    const maxRadius =

        Math.min(

            width,

            height

        )

        *

        0.37;

    ctx.clearRect(

        0,

        0,

        width,

        height

    );

    ctx.save();

    /*

    Okręgi.

    */

    ctx.strokeStyle =

        "rgba(255,255,255,.13)";

    ctx.lineWidth =

        1;

    [

        0.25,

        0.5,

        0.75,

        1

    ]

    .forEach(

        radius => {

            ctx.beginPath();

            ctx.arc(

                centerX,

                centerY,

                maxRadius *

                radius,

                0,

                Math.PI *

                2

            );

            ctx.stroke();

        }

    );

    /*

    Krzyż.

    */

    ctx.beginPath();

    ctx.moveTo(

        centerX -

        maxRadius,

        centerY

    );

    ctx.lineTo(

        centerX +

        maxRadius,

        centerY

    );

    ctx.moveTo(

        centerX,

        centerY -

        maxRadius

    );

    ctx.lineTo(

        centerX,

        centerY +

        maxRadius

    );

    ctx.stroke();

    /*

    TY.

    */

    ctx.fillStyle =

        "#0a84ff";

    ctx.beginPath();

    ctx.arc(

        centerX,

        centerY,

        9,

        0,

        Math.PI *

        2

    );

    ctx.fill();

    ctx.strokeStyle =

        "#fff";

    ctx.lineWidth =

        3;

    ctx.stroke();

    /*

    HULAJNOGA.

    */

    if(

        returnMode

        &&

        current

        &&

        scooter

    ) {

        const data =

            currentData();

        /*

        0° względnie =

        prosto przed telefonem.

        Na canvas:

        -90° = góra ekranu.

        */

        const angle =

            (

                data.relativeBearing

                -

                90

            )

            *

            Math.PI /

            180;

        /*

        Długość zależy

        od realnej odległości.

        */

        const lineLength =

            distanceToRadius(

                data.distance,

                maxRadius *

                0.94

            );

        const scooterX =

            centerX

            +

            Math.cos(

                angle

            )

            *

            lineLength;

        const scooterY =

            centerY

            +

            Math.sin(

                angle

            )

            *

            lineLength;

        /*

        CIĄGŁA LINIA.

        */

        ctx.setLineDash([]);

        ctx.strokeStyle =

            "#ff453a";

        ctx.lineWidth =

            7;

        ctx.lineCap =

            "round";

        ctx.beginPath();

        ctx.moveTo(

            centerX,

            centerY

        );

        ctx.lineTo(

            scooterX,

            scooterY

        );

        ctx.stroke();

        /*

        PUNKT HULAJNOGI.

        */

        ctx.fillStyle =

            "#ff9f0a";

        ctx.beginPath();

        ctx.arc(

            scooterX,

            scooterY,

            15,

            0,

            Math.PI *

            2

        );

        ctx.fill();

        ctx.strokeStyle =

            "#fff";

        ctx.lineWidth =

            2;

        ctx.stroke();

        /*

        IKONA.

        */

        ctx.font =

            "700 20px -apple-system";

        ctx.textAlign =

            "center";

        ctx.fillStyle =

            "#fff";

        ctx.fillText(

            "🛴",

            scooterX,

            scooterY -

            24

        );

        /*

        DYSTANS NA LINII.

        */

        if(

            lineLength >

            75

        ) {

            const textX =

                centerX

                +

                Math.cos(

                    angle

                )

                *

                lineLength *

                0.55;

            const textY =

                centerY

                +

                Math.sin(

                    angle

                )

                *

                lineLength *

                0.55;

            ctx.font =

                "700 13px -apple-system";

            ctx.fillStyle =

                "#fff";

            const text =

                data.distance >=

                1000

                ?

                (

                    data.distance /

                    1000

                )

                .toFixed(2)

                +

                " km"

                :

                Math.round(

                    data.distance

                )

                +

                " m";

            ctx.fillText(

                text,

                textX,

                textY - 10

            );

        }

    }

    ctx.restore();

}

/* =========================================

   ZAPARKOWAŁEM

========================================= */

$("park")

.addEventListener(

    "click",

    () => {

        if(

            !current

        ) {

            alert(

                "Poczekaj na GPS."

            );

            return;

        }

        scooter = {

            lat:

                current.lat,

            lng:

                current.lng

        };

        localStorage.setItem(

            "scooterPosition",

            JSON.stringify(

                scooter

            )

        );

        localStorage.removeItem(

            "carPosition"

        );

        returnMode =

            false;

        $("park")

            .style

            .display =

            "none";

        updateUI();

        drawRadar();

    }

);

/* =========================================

   WRÓĆ

========================================= */

$("back")

.addEventListener(

    "click",

    async () => {

        if(

            !scooter

        ) {

            alert(

                "Najpierw zapisz hulajnogę."

            );

            return;

        }

        if(

            !current

        ) {

            alert(

                "Czekam na GPS."

            );

            return;

        }

        returnMode =

            true;

        updateUI();

        /*

        Dopiero kliknięcie WRÓĆ

        prosi iOS o czujnik ruchu.

        */

        await startCompass();

        updateUI();

        drawRadar();

    }

);

/* =========================================

   RESET

========================================= */

$("reset")

.addEventListener(

    "click",

    () => {

        if(

            !confirm(

                "Usunąć zapisane miejsce hulajnogi?"

            )

        ) {

            return;

        }

        localStorage.removeItem(

            "scooterPosition"

        );

        localStorage.removeItem(

            "carPosition"

        );

        scooter =

            null;

        returnMode =

            false;

        $("park")

            .style

            .display =

            "";

        updateUI();

        drawRadar();

    }

);

/* =========================================

   LIVE STATUS

========================================= */

setInterval(

    () => {

        if(

            returnMode

        ) {

            updateUI();

        }

    },

    500

);

/* =========================================

   START

========================================= */

updateUI();

/* =========================================

   OFFLINE

========================================= */

if(

    "serviceWorker"

    in navigator

) {

    window.addEventListener(

        "load",

        () => {

            navigator

                .serviceWorker

                .register(

                    "./sw.js?v=10",

                    {

                        updateViaCache:

                            "none"

                    }

                )

                .catch(

                    () => {}

                );

        }

    );

}

</script>
