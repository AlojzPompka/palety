<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0b0f0c">

<link rel="manifest" href="./manifest.webmanifest">

<title>Grzyby – powrót do hulajnogi</title>

<style>

*{

    box-sizing:border-box;

}

html,body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#0b0f0c;

    color:white;

    font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        sans-serif;

}

#scene{

    position:fixed;

    inset:0;

    background:

        radial-gradient(

            circle at center,

            rgba(255,255,255,.05) 0 1px,

            transparent 1.5px

        )

        0 0 / 28px 28px,

        linear-gradient(

            #111813,

            #0b0f0c

        );

}

#radar{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

}

#top{

    position:fixed;

    z-index:20;

    top:max(

        12px,

        env(safe-area-inset-top)

    );

    left:12px;

    right:12px;

    padding:12px;

    border-radius:18px;

    background:

        rgba(8,12,9,.90);

    backdrop-filter:

        blur(12px);

    -webkit-backdrop-filter:

        blur(12px);

}

#status{

    text-align:center;

    font-size:13px;

    color:#adb5ae;

}

#distance{

    text-align:center;

    font-size:34px;

    font-weight:850;

    margin-top:2px;

}

#scale{

    text-align:center;

    font-size:12px;

    color:#adb5ae;

    margin-top:2px;

}

#hint{

    text-align:center;

    font-size:13px;

    color:#adb5ae;

    margin-top:4px;

}

#directionArea{

    position:fixed;

    z-index:15;

    left:50%;

    top:50%;

    width:130px;

    height:130px;

    margin-left:-65px;

    margin-top:-65px;

    display:none;

    align-items:center;

    justify-content:center;

    pointer-events:none;

}

#arrow{

    font-size:90px;

    line-height:1;

    transform:

        rotate(0deg);

    transform-origin:

        50% 50%;

    will-change:

        transform;

    filter:

        drop-shadow(

            0 4px 7px

            rgba(0,0,0,.8)

        );

}

#frontLabel{

    position:fixed;

    z-index:14;

    left:50%;

    top:calc(

        50% - 105px

    );

    transform:

        translateX(-50%);

    display:none;

    color:#adb5ae;

    font-size:11px;

    font-weight:700;

    pointer-events:none;

}

#bottom{

    position:fixed;

    z-index:20;

    left:12px;

    right:12px;

    bottom:max(

        12px,

        env(safe-area-inset-bottom)

    );

    padding:10px;

    border-radius:18px;

    background:

        rgba(8,12,9,.90);

    backdrop-filter:

        blur(12px);

    -webkit-backdrop-filter:

        blur(12px);

}

.buttons{

    display:flex;

    gap:8px;

}

button{

    flex:1;

    border:0;

    border-radius:14px;

    min-height:52px;

    padding:10px 7px;

    font-size:15px;

    font-weight:800;

}

#park{

    background:#31d158;

    color:#001a07;

}

#back{

    background:#ff9f0a;

    color:#1d0d00;

}

#reset{

    background:#ff453a;

    color:white;

}

.badge{

    display:inline-block;

    padding:2px 6px;

    margin-left:4px;

    border-radius:9px;

    background:

        rgba(255,255,255,.08);

}

</style>

</head>

<body>

<div id="scene">

    <canvas id="radar"></canvas>

</div>

<div id="top">

    <div id="status">

        Czekam na GPS…

    </div>

    <div id="distance">

        —

    </div>

    <div id="scale">

    </div>

    <div id="hint">

        Przy hulajnodze naciśnij ZAPARKOWAŁEM.

    </div>

</div>

<div id="frontLabel">

    PRZÓD TELEFONU

</div>

<div id="directionArea">

    <div id="arrow">↑</div>

</div>

<div id="bottom">

    <div class="buttons">

        <button id="park">

            🛴 ZAPARKOWAŁEM

        </button>

        <button id="back">

            ↩️ WRÓĆ

        </button>

        <button id="reset">

            RESET

        </button>

    </div>

</div>

<script>

"use strict";

const $ =

    id =>

    document.getElementById(id);

const canvas =

    $("radar");

const ctx =

    canvas.getContext("2d");

/* ================================

   STAN

================================ */

let current = null;

let scooter =

    JSON.parse(

        localStorage.getItem(

            "scooterPosition"

        )

        ||

        localStorage.getItem(

            "carPosition"

        )

        ||

        "null"

    );

let returnMode = false;

/*

Surowy kierunek kompasu.

*/

let rawHeading = null;

/*

Wygładzony kierunek telefonu.

*/

let smoothHeading = null;

/*

Wygładzony kąt strzałki.

*/

let smoothArrowAngle = 0;

/*

Docelowy kąt strzałki.

*/

let targetArrowAngle = 0;

let compassStarted = false;

/*

Animacja strzałki działa cały czas,

nie tylko gdy przychodzi nowy pomiar.

*/

let animationId = null;

/* ================================

   CANVAS

================================ */

function resizeCanvas(){

    const dpr =

        Math.max(

            1,

            window.devicePixelRatio || 1

        );

    canvas.width =

        innerWidth * dpr;

    canvas.height =

        innerHeight * dpr;

    canvas.style.width =

        innerWidth + "px";

    canvas.style.height =

        innerHeight + "px";

    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );

    drawRadar();

}

window.addEventListener(

    "resize",

    resizeCanvas

);

resizeCanvas();

/* ================================

   JEŻELI HULAJNOGA JEST ZAPISANA

================================ */

if(scooter){

    $("park")

        .style

        .display =

        "none";

}

/* ================================

   ODLEGŁOŚĆ HAVERSINE

================================ */

function distanceM(

    lat1,

    lon1,

    lat2,

    lon2

){

    const R =

        6371000;

    const p1 =

        lat1 *

        Math.PI /

        180;

    const p2 =

        lat2 *

        Math.PI /

        180;

    const dp =

        (lat2-lat1) *

        Math.PI /

        180;

    const dl =

        (lon2-lon1) *

        Math.PI /

        180;

    const a =

        Math.sin(dp/2) ** 2

        +

        Math.cos(p1) *

        Math.cos(p2) *

        Math.sin(dl/2) ** 2;

    return

        R *

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );

}

/* ================================

   KĄT GPS DO HULAJNOGI

   0   = północ

   90  = wschód

   180 = południe

================================ */

function bearingDeg(

    lat1,

    lon1,

    lat2,

    lon2

){

    const p1 =

        lat1 *

        Math.PI /

        180;

    const p2 =

        lat2 *

        Math.PI /

        180;

    const dLon =

        (lon2-lon1) *

        Math.PI /

        180;

    const y =

        Math.sin(dLon) *

        Math.cos(p2);

    const x =

        Math.cos(p1) *

        Math.sin(p2)

        -

        Math.sin(p1) *

        Math.cos(p2) *

        Math.cos(dLon);

    return (

        Math.atan2(y,x) *

        180 /

        Math.PI

        +

        360

    ) % 360;

}

/* ================================

   KĄTY

================================ */

function normalize360(angle){

    return (

        (

            angle % 360

        )

        +

        360

    ) % 360;

}

function normalize180(angle){

    return (

        (

            (

                angle + 180

            )

            % 360

            +

            360

        )

        % 360

    )

    - 180;

}

/*

Płynne przejście kątów.

Np. 359 -> 1 stopień

nie wykona obrotu przez całe 358°.

*/

function smoothAngle(

    currentAngle,

    targetAngle,

    factor

){

    const difference =

        normalize180(

            targetAngle -

            currentAngle

        );

    return normalize360(

        currentAngle +

        difference *

        factor

    );

}

/* ================================

   SKALA RADARU

   Im dalej od hulajnogi,

   tym dłuższa linia.

   0 m    -> prawie zero

   100 m  -> krótka

   500 m  -> średnia

   1000+  -> prawie cały radar

================================ */

function distanceToRadius(

    distance,

    maxRadius

){

    /*

    Logarytmiczna skala daje

    sensowne działanie zarówno

    przy 10 m jak i 2 km.

    */

    const minDistance =

        5;

    const referenceDistance =

        1500;

    if(distance <= minDistance){

        return 5;

    }

    let ratio =

        Math.log(

            1 +

            distance /

            20

        )

        /

        Math.log(

            1 +

            referenceDistance /

            20

        );

    ratio =

        Math.max(

            0,

            Math.min(

                1,

                ratio

            )

        );

    return (

        12 +

        ratio *

        (

            maxRadius -

            12

        )

    );

}

/* ================================

   AKTUALIZACJA STRZAŁKI

================================ */

function calculateArrow(){

    if(

        !returnMode

        ||

        !current

        ||

        !scooter

        ||

        smoothHeading === null

    ){

        return;

    }

    const targetBearing =

        bearingDeg(

            current.lat,

            current.lng,

            scooter.lat,

            scooter.lng

        );

    /*

    Najważniejsze:

    kierunek hulajnogi

    MINUS

    kierunek telefonu.

    Hulajnoga przed Tobą -> 0°

    Hulajnoga z prawej   -> 90°

    Hulajnoga za Tobą    -> 180°

    Hulajnoga z lewej    -> -90°

    */

    targetArrowAngle =

        normalize360(

            targetBearing

            -

            smoothHeading

        );

}

/* ================================

   PŁYNNA ANIMACJA STRZAŁKI

================================ */

function animationLoop(){

    if(

        returnMode

        &&

        smoothHeading !== null

    ){

        calculateArrow();

        smoothArrowAngle =

            smoothAngle(

                smoothArrowAngle,

                targetArrowAngle,

                0.16

            );

        $("arrow")

            .style

            .transform =

            `rotate(${smoothArrowAngle}deg)`;

    }

    drawRadar();

    animationId =

        requestAnimationFrame(

            animationLoop

        );

}

animationLoop();

/* ================================

   INTERFEJS

================================ */

function updateUI(){

    if(!current){

        $("status")

            .textContent =

            "Czekam na GPS…";

        return;

    }

    $("status")

        .innerHTML =

        `GPS ±${Math.round(

            current.accuracy

        )} m`

        +

        (

            smoothHeading !== null

            ?

            ` <span class="badge">

                kompas OK

            </span>`

            :

            ` <span class="badge">

                kompas —

            </span>`

        );

    if(

        scooter

        &&

        returnMode

    ){

        const d =

            distanceM(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        if(d >= 1000){

            $("distance")

                .textContent =

                "🛴 "

                +

                (d/1000)

                    .toFixed(2)

                +

                " km";

        }

        else{

            $("distance")

                .textContent =

                "🛴 "

                +

                Math.round(d)

                +

                " m";

        }

        $("scale")

            .textContent =

            "Linia skraca się podczas zbliżania";

        if(

            smoothHeading === null

        ){

            $("hint")

                .textContent =

                "Czekam na kompas iPhone'a…";

        }

        else{

            $("hint")

                .textContent =

                "Strzałka i linia wskazują hulajnogę.";

        }

    }

    else if(scooter){

        $("distance")

            .textContent =

            "🛴 HULAJNOGA ZAPISANA";

        $("scale")

            .textContent =

            "";

        $("hint")

            .textContent =

            "Gdy chcesz wracać, naciśnij WRÓĆ.";

    }

    else{

        $("distance")

            .textContent =

            "—";

        $("scale")

            .textContent =

            "";

        $("hint")

            .textContent =

            "Przy hulajnodze naciśnij ZAPARKOWAŁEM.";

    }

    updateDirectionVisibility();

}

/* ================================

   POKAŻ / UKRYJ STRZAŁKĘ

================================ */

function updateDirectionVisibility(){

    if(

        returnMode

        &&

        scooter

    ){

        $("directionArea")

            .style

            .display =

            "flex";

        $("frontLabel")

            .style

            .display =

            "block";

    }

    else{

        $("directionArea")

            .style

            .display =

            "none";

        $("frontLabel")

            .style

            .display =

            "none";

    }

}

/* ================================

   RADAR + CIĄGŁA LINIA

================================ */

function drawRadar(){

    const w =

        innerWidth;

    const h =

        innerHeight;

    ctx.clearRect(

        0,

        0,

        w,

        h

    );

    const cx =

        w / 2;

    const cy =

        h / 2;

    const maxRadius =

        Math.min(

            w,

            h

        )

        *

        0.37;

    ctx.save();

    /*

    Okręgi pomocnicze.

    */

    ctx.strokeStyle =

        "rgba(255,255,255,.12)";

    ctx.lineWidth =

        1;

    [

        .25,

        .5,

        .75,

        1

    ]

    .forEach(

        scale => {

            ctx.beginPath();

            ctx.arc(

                cx,

                cy,

                maxRadius * scale,

                0,

                Math.PI * 2

            );

            ctx.stroke();

        }

    );

    /*

    Krzyż radaru.

    */

    ctx.beginPath();

    ctx.moveTo(

        cx-maxRadius,

        cy

    );

    ctx.lineTo(

        cx+maxRadius,

        cy

    );

    ctx.moveTo(

        cx,

        cy-maxRadius

    );

    ctx.lineTo(

        cx,

        cy+maxRadius

    );

    ctx.stroke();

    /*

    TY - środek.

    */

    ctx.fillStyle =

        "#0a84ff";

    ctx.beginPath();

    ctx.arc(

        cx,

        cy,

        9,

        0,

        Math.PI*2

    );

    ctx.fill();

    ctx.strokeStyle =

        "white";

    ctx.lineWidth =

        3;

    ctx.stroke();

    if(

        returnMode

        &&

        current

        &&

        scooter

    ){

        /*

        Rzeczywista odległość.

        */

        const d =

            distanceM(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        /*

        Kierunek GPS do hulajnogi.

        */

        const bearing =

            bearingDeg(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        /*

        Kierunek względem telefonu.

        */

        let relative;

        if(

            smoothHeading !== null

        ){

            relative =

                normalize180(

                    bearing

                    -

                    smoothHeading

                );

        }

        else{

            relative =

                bearing;

        }

        /*

        Zamiana stopni na układ canvas.

        -90 ponieważ góra canvas

        odpowiada 0°.

        */

        const angle =

            (

                relative -

                90

            )

            *

            Math.PI /

            180;

        /*

        DŁUGOŚĆ LINII ZALEŻNA

        OD ODLEGŁOŚCI OD HULAJNOGI.

        */

        const lineLength =

            distanceToRadius(

                d,

                maxRadius *

                0.93

            );

        const endX =

            cx

            +

            Math.cos(angle)

            *

            lineLength;

        const endY =

            cy

            +

            Math.sin(angle)

            *

            lineLength;

        /*

        CIĄGŁA LINIA DO HULAJNOGI.

        */

        ctx.setLineDash([]);

        ctx.strokeStyle =

            "#ff453a";

        ctx.lineWidth =

            6;

        ctx.lineCap =

            "round";

        ctx.beginPath();

        ctx.moveTo(

            cx,

            cy

        );

        ctx.lineTo(

            endX,

            endY

        );

        ctx.stroke();

        /*

        HULAJNOGA NA KOŃCU LINII.

        */

        ctx.fillStyle =

            "#ff9f0a";

        ctx.beginPath();

        ctx.arc(

            endX,

            endY,

            13,

            0,

            Math.PI*2

        );

        ctx.fill();

        ctx.strokeStyle =

            "white";

        ctx.lineWidth =

            2;

        ctx.stroke();

        /*

        Napis.

        */

        ctx.fillStyle =

            "white";

        ctx.font =

            "700 14px -apple-system";

        ctx.textAlign =

            "center";

        ctx.fillText(

            "🛴",

            endX,

            endY-20

        );

        /*

        Metry na linii.

        */

        const labelX =

            cx

            +

            Math.cos(angle)

            *

            lineLength *

            .55;

        const labelY =

            cy

            +

            Math.sin(angle)

            *

            lineLength *

            .55;

        ctx.font =

            "700 13px -apple-system";

        ctx.fillText(

            d >= 1000

            ?

            (d/1000)

                .toFixed(2)

                +

                " km"

            :

            Math.round(d)

                +

                " m",

            labelX,

            labelY - 9

        );

    }

    ctx.restore();

}

/* ================================

   GPS

================================ */

function gpsUpdate(pos){

    current = {

        lat:

            pos.coords.latitude,

        lng:

            pos.coords.longitude,

        accuracy:

            pos.coords.accuracy,

        speed:

            pos.coords.speed,

        heading:

            pos.coords.heading

    };

    updateUI();

}

function gpsError(error){

    $("status")

        .textContent =

        "Błąd GPS: "

        +

        error.message;

}

if(

    "geolocation"

    in navigator

){

    navigator

        .geolocation

        .watchPosition(

            gpsUpdate,

            gpsError,

            {

                enableHighAccuracy:

                    true,

                maximumAge:

                    0,

                timeout:

                    15000

            }

        );

}

/* ================================

   KOMPAS

================================ */

function compassUpdate(event){

    let heading =

        null;

    /*

    Safari / iPhone.

    */

    if(

        typeof

        event.webkitCompassHeading

        ===

        "number"

    ){

        heading =

            event.webkitCompassHeading;

    }

    /*

    Fallback.

    */

    else if(

        typeof

        event.alpha

        ===

        "number"

    ){

        heading =

            360 -

            event.alpha;

        /*

        Korekcja orientacji ekranu.

        */

        const screenAngle =

            screen.orientation &&

            typeof screen.orientation.angle

            === "number"

            ?

            screen.orientation.angle

            :

            (

                typeof

                window.orientation

                === "number"

                ?

                window.orientation

                :

                0

            );

        heading =

            heading +

            screenAngle;

    }

    if(

        heading === null

    ){

        return;

    }

    rawHeading =

        normalize360(

            heading

        );

    /*

    Pierwszy pomiar bez wygładzania.

    */

    if(

        smoothHeading === null

    ){

        smoothHeading =

            rawHeading;

    }

    else{

        /*

        Wygładzanie kompasu.

        Mniejsza wartość =

        spokojniejsza strzałka.

        0.22 daje nadal szybką reakcję.

        */

        smoothHeading =

            smoothAngle(

                smoothHeading,

                rawHeading,

                0.22

            );

    }

    updateUI();

}

/* ================================

   START KOMPASU

================================ */

async function startCompass(){

    if(compassStarted){

        return;

    }

    try{

        if(

            typeof

            DeviceOrientationEvent

            !==

            "undefined"

            &&

            typeof

            DeviceOrientationEvent

                .requestPermission

            ===

            "function"

        ){

            const result =

                await

                DeviceOrientationEvent

                    .requestPermission();

            if(

                result !==

                "granted"

            ){

                $("hint")

                    .textContent =

                    "Brak zgody na kompas.";

                return;

            }

        }

        window.addEventListener(

            "deviceorientation",

            compassUpdate,

            true

        );

        /*

        Niektóre wersje Safari

        wysyłają absolute.

        */

        window.addEventListener(

            "deviceorientationabsolute",

            compassUpdate,

            true

        );

        compassStarted =

            true;

    }

    catch(error){

        $("hint")

            .textContent =

            "Nie udało się uruchomić kompasu.";

    }

}

/* ================================

   ZAPARKOWAŁEM

================================ */

$("park")

.addEventListener(

    "click",

    () => {

        if(!current){

            alert(

                "Poczekaj, aż GPS złapie pozycję."

            );

            return;

        }

        scooter = {

            lat:

                current.lat,

            lng:

                current.lng

        };

        localStorage.setItem(

            "scooterPosition",

            JSON.stringify(

                scooter

            )

        );

        /*

        Usuwamy starą nazwę

        z poprzedniej wersji.

        */

        localStorage.removeItem(

            "carPosition"

        );

        returnMode =

            false;

        /*

        Nie można przypadkiem

        nadpisać miejsca hulajnogi.

        */

        $("park")

            .style

            .display =

            "none";

        updateUI();

    }

);

/* ================================

   WRÓĆ

================================ */

$("back")

.addEventListener(

    "click",

    async () => {

        if(!scooter){

            alert(

                "Najpierw zapisz pozycję hulajnogi."

            );

            return;

        }

        if(!current){

            alert(

                "Czekam na GPS."

            );

            return;

        }

        /*

        Kompas musi być uruchamiany

        po kliknięciu użytkownika

        ze względu na iOS.

        */

        await startCompass();

        returnMode =

            true;

        /*

        Początkowy kąt strzałki,

        aby nie robiła dziwnego

        obrotu od zera.

        */

        if(

            smoothHeading !== null

        ){

            const bearing =

                bearingDeg(

                    current.lat,

                    current.lng,

                    scooter.lat,

                    scooter.lng

                );

            targetArrowAngle =

                normalize360(

                    bearing

                    -

                    smoothHeading

                );

            smoothArrowAngle =

                targetArrowAngle;

        }

        updateUI();

    }

);

/* ================================

   RESET

================================ */

$("reset")

.addEventListener(

    "click",

    () => {

        if(

            !confirm(

                "Usunąć zapisane miejsce hulajnogi?"

            )

        ){

            return;

        }

        localStorage.removeItem(

            "scooterPosition"

        );

        localStorage.removeItem(

            "carPosition"

        );

        scooter =

            null;

        returnMode =

            false;

        $("park")

            .style

            .display =

            "";

        $("directionArea")

            .style

            .display =

            "none";

        $("frontLabel")

            .style

            .display =

            "none";

        updateUI();

    }

);

updateUI();

/* ================================

   SERVICE WORKER - OFFLINE

================================ */

if(

    "serviceWorker"

    in navigator

){

    window.addEventListener(

        "load",

        () => {

            navigator

                .serviceWorker

                .register(

                    "./sw.js"

                )

                .catch(

                    () => {}

                );

        }

    );

}

</script>
