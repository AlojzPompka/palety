<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator załadunku naczepy</title>
<style>
body {
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    text-align:center;
    margin:0;
    padding:0;
}
.container {
    width:750px;
    margin:30px auto;
    padding:20px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h1 { margin-bottom:20px; }
input { display:block; margin:10px auto; padding:8px; width:60%; font-size:16px; }
button {
    padding:10px 30px;
    background:#2c7be5;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}
button:hover { background:#1a5fc1; }
#result { margin-top:20px; font-size:16px; font-weight:bold; }
#truck {
    position:relative;
    margin:20px auto;
    width:680px; /* 1360 cm /2 */
    height:150px; /* 250 cm /2 */
    background:#ddd;
    border:2px solid #999;
}
.pallet {
    position:absolute;
    border:1px solid #444;
    box-sizing:border-box;
    text-align:center;
    font-size:12px;
    color:white;
    line-height:1.2;
    font-weight:bold;
}
.pallet.euro { background:#2c7be5; }
.pallet.w120 { background:#e52c2c; }
.legend {
    display:flex; justify-content:center; margin-top:10px;
}
.legend div { margin:0 15px; display:flex; align-items:center; }
.legend span { width:20px; height:20px; display:inline-block; margin-right:5px; }
</style>
</head>
<body>
<div class="container">
<h1>Kalkulator załadunku naczepy</h1>
<label>Ilość palet EURO:</label>
<input type="number" id="euro" placeholder="np. 19">
<label>Ilość palet W 120x100:</label>
<input type="number" id="w120" placeholder="np. 20">
<button onclick="calculate()">Oblicz</button>

<h2>Wynik:</h2>
<div id="result"></div>

<h2>Wizualizacja naczepy:</h2>
<div id="truck"></div>

<div class="legend">
    <div><span style="background:#2c7be5;"></span> EURO</div>
    <div><span style="background:#e52c2c;"></span> W 120x100</div>
</div>
</div>

<script>
function calculate() {
    const euroTotal = parseInt(document.getElementById("euro").value)||0;
    const wTotal = parseInt(document.getElementById("w120").value)||0;
    const truckLength = 1360; // cm
    let euroRem = euroTotal;
    let wRem = wTotal;
    let usedLength = 0;

    // Maks jedynki EURO w osi
    let euroUnits = Math.min(17, euroRem);
    euroRem -= euroUnits;
    usedLength = euroUnits*80;

    let euroRows3 = 0;
    let euroRows2 = 0;

    while(euroRem>0){
        if(euroRem>=3 && usedLength+120<=truckLength){ euroRows3++; euroRem-=3; usedLength+=120; }
        else if(euroRem>=2 && usedLength+80<=truckLength){ euroRows2++; euroRem-=2; usedLength+=80; }
        else{ break; }
    }

    // W 120x100
    let wUnits = 0;
    let wPairs = 0;
    while(wRem>0){
        if(wRem>=2 && usedLength+100<=truckLength){ wPairs++; wRem-=2; usedLength+=100; }
        else if(wRem>=1 && usedLength+100<=truckLength){ wUnits++; wRem-=1; usedLength+=100; }
        else{ break; }
    }

    document.getElementById("result").innerHTML =
        `EURO: ${euroUnits} jedynki, ${euroRows3} rzędy 3, ${euroRows2} rzędy 2<br>`+
        `W 120x100: ${wUnits} jedynki, ${wPairs} pary<br>`+
        `Zajęta długość: ${usedLength} / 1360 cm`;

    drawTruck(euroUnits, euroRows3, euroRows2, wUnits, wPairs);
}

// Wizualizacja z realistycznym rzędem 2 i 3
function drawTruck(euroUnits, euroRows3, euroRows2, wUnits, wPairs){
    const truck = document.getElementById("truck");
    truck.innerHTML="";
    const scale=0.5;
    const truckWidthPx = 250*scale;
    let x=0;
    const euroY = (truckWidthPx - 80*scale)/2;
    const wY = (truckWidthPx - 100*scale)/2 + 20;

    // Jedynki EURO
    for(let i=0;i<euroUnits;i++){
        const div=document.createElement("div");
        div.className="pallet euro";
        div.style.width = 120*scale+"px";
        div.style.height = 80*scale+"px";
        div.style.left = x*scale+"px";
        div.style.top = euroY+"px";
        div.innerText="E";
        truck.appendChild(div);
        x+=80;
    }

    // Rzędy 3 EURO
    for(let i=0;i<euroRows3;i++){
        for(let j=0;j<3;j++){
            const div=document.createElement("div");
            div.className="pallet euro";
            div.style.width = 120*scale/3+"px";
            div.style.height = 80*scale+"px";
            div.style.left = x*scale + j*120*scale/3 + "px";
            div.style.top = euroY+"px";
            div.innerText="E";
            truck.appendChild(div);
        }
        x+=120;
    }

    // Rzędy 2 EURO
    for(let i=0;i<euroRows2;i++){
        for(let j=0;j<2;j++){
            const div=document.createElement("div");
            div.className="pallet euro";
            div.style.width = 120*scale/2+"px";
            div.style.height = 80*scale+"px";
            div.style.left = x*scale + j*120*scale/2 + "px";
            div.style.top = euroY+"px";
            div.innerText="E";
            truck.appendChild(div);
        }
        x+=80;
    }

    // Jedynki W
    for(let i=0;i<wUnits;i++){
        const div=document.createElement("div");
        div.className="pallet w120";
        div.style.width = 120*scale+"px";
        div.style.height = 100*scale+"px";
        div.style.left = x*scale+"px";
        div.style.top = wY+"px";
        div.innerText="W";
        truck.appendChild(div);
        x+=100;
    }

    // Pary W (rzędy 2)
    for(let i=0;i<wPairs;i++){
        for(let j=0;j<2;j++){
            const div=document.createElement("div");
            div.className="pallet w120";
            div.style.width = 120*scale/2+"px";
            div.style.height = 100*scale+"px";
            div.style.left = x*scale + j*120*scale/2 + "px";
            div.style.top = wY+"px";
            div.innerText="W";
            truck.appendChild(div);
        }
        x+=100;
    }
}
</script>
</body>
</html>
