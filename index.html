<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Palet</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Palety">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      background: #f7f7f7;
    }
    h2 { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-top: 5px;
    }
    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      font-size: 18px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
    }
    #wynik {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 6px;
      font-size: 17px;
    }
    hr { margin: 15px 0; }
    ul, ol { margin-left: 20px; }
  </style>
</head>
<body>

<h2>Kalkulator załadunku W + EP</h2>

<label>Palety W:
  <input type="number" id="w" value="0" min="0">
</label>

<label>Palety EP:
  <input type="number" id="ep" value="0" min="0">
</label>

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<script>
function oblicz() {
  const DLUGOSC = 13.4;

  // długości rzędów
  const dW = 0.95;   // rząd W (2 palety)
  const dEP3 = 1.2;  // EP po 3
  const dEP2 = 0.8;  // EP po 2 (po szerokości)

  let w = Number(document.getElementById("w").value || 0);
  let ep = Number(document.getElementById("ep").value || 0);

  let zajete = 0;
  let instrukcja = [];
  let lp = 1;

  // ===== W =====
  const pelneW = Math.floor(w / 2);
  const resztaW = w % 2;
  const rzedyW = pelneW + (resztaW ? 1 : 0);

  if (rzedyW > 0) {
    instrukcja.push(
      `${lp++}. Załaduj ${rzedyW} rzędów palet W (2 palety w rzędzie)`
    );
  }

  zajete += rzedyW * dW;

  // ===== dopychanie EP do niepełnego W =====
  let epDopych = 0;
  if (resztaW && ep > 0) {
    ep--;
    epDopych = 1;
    instrukcja.push(
      `${lp++}. Dopychaj 1 paletę EP do niepełnego rzędu W`
    );
  }

  // ===== EP =====
  let rzedyEP3 = Math.floor(ep / 3);
  let resztaEP = ep % 3;
  let ep2 = 0;

  // logika: zawsze pełny rząd
  if (resztaEP === 1 && rzedyEP3 > 0) {
    rzedyEP3--;
    ep2 = 2;
  } else if (resztaEP >= 2) {
    ep2 = 2;
  }

  if (rzedyEP3 > 0) {
    instrukcja.push(
      `${lp++}. Załaduj ${rzedyEP3} rzędów EP po 3 palety (1,2 m)`
    );
  }

  if (ep2 > 0) {
    instrukcja.push(
      `${lp++}. Załaduj 2 palety EP w rzędzie po szerokości (0,8 m)`
    );
  }

  zajete += rzedyEP3 * dEP3;
  if (ep2) zajete += dEP2;

  const wolne = DLUGOSC - zajete;

  // ===== WYNIK =====
  let wynik = `
    <strong>Zajęta długość:</strong> ${zajete.toFixed(2)} m<br>
  `;

  if (wolne >= 0) {
    wynik += `<strong>Wolne miejsce:</strong> ${wolne.toFixed(2)} m<br>`;

    // ile jeszcze można dołożyć
    let moznaEP = Math.floor(wolne / dEP3) * 3;
    let reszta = wolne % dEP3;

    let moznaEP2 = reszta >= dEP2 ? 2 : 0;
    let moznaW = Math.floor(wolne / dW) * 2;

    wynik += `<strong>Można jeszcze załadować:</strong><br>`;
    if (moznaEP > 0)
      wynik += `• ${moznaEP} palet EP (trójkami)<br>`;
    if (moznaEP2 > 0)
      wynik += `• ${moznaEP2} palety EP (dwójką)<br>`;
    if (moznaW > 0)
      wynik += `• ${moznaW} palet W<br>`;
  } else {
    wynik += `
      <strong style="color:red">Za dużo palet!</strong><br>
      Brakuje ${Math.abs(wolne).toFixed(2)} m
    `;
  }

  if (instrukcja.length > 0) {
    wynik += `<hr><strong>Instrukcja załadunku (krok po kroku):</strong><ol>`;
    instrukcja.forEach(k => wynik += `<li>${k}</li>`);
    wynik += `</ol>`;
  }

  document.getElementById("wynik").innerHTML = wynik;
}
</script>
