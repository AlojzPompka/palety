<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  padding: 20px;
}

.card {
  max-width: 520px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
}

h1 {
  text-align: center;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  font-size: 16px;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #0a74ff;
  color: white;
  border: none;
  border-radius: 8px;
}

#wynik {
  margin-top: 15px;
  font-size: 16px;
}

#instrukcja {
  margin-top: 15px;
  font-size: 15px;
}

.trailer {
  margin-top: 15px;
  border: 2px solid #333;
  border-radius: 8px;
  padding: 6px;
  background: #eee;
}

.row {
  display: flex;
  margin-bottom: 4px;
}

.box {
  flex: 1;
  height: 22px;
  margin: 1px;
  border-radius: 4px;
}

.w { background: #4a90e2; }
.wep { background: #f5a623; }
.ep2 { background: #2ecc71; }
.ep3 { background: #27ae60; }
.free { background: #ccc; }

.legend {
  margin-top: 10px;
  font-size: 13px;
}
.legend span {
  display: inline-block;
  margin-right: 10px;
}
.legend i {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 4px;
  vertical-align: middle;
}
</style>
</head>

<body>

<div class="card">
<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W</label>
<input id="w" type="number" min="0" value="0">

<label>Palety EP</label>
<input id="ep" type="number" min="0" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>
<div id="instrukcja"></div>
<div id="rysunek"></div>
</div>

<script>
function oblicz() {
  const DL = 13.4;

  let W = parseInt(document.getElementById("w").value) || 0;
  let EP = parseInt(document.getElementById("ep").value) || 0;

  let zajete = 0;
  let instrukcja = [];
  let rys = [];

  // --- RZĘDY W ---
  let rzedW = Math.floor(W / 2);
  if (rzedW > 0) {
    zajete += rzedW * 1.0;
    instrukcja.push(`Załaduj ${rzedW} rzędów W (2 palety)`);
    for (let i = 0; i < rzedW; i++) {
      rys.push(["w","w"]);
    }
    W -= rzedW * 2;
  }

  // --- RZĄD W + EP ---
  if (W === 1 && EP >= 1) {
    zajete += 1.0;
    instrukcja.push("Załaduj 1 rząd mieszany W + EP");
    rys.push(["w","wep"]);
    W -= 1;
    EP -= 1;
  }

  // --- EP(2) NAJPIERW ---
  let rzedEP2 = Math.floor(EP / 2);
  if (rzedEP2 > 0) {
    zajete += rzedEP2 * 0.8;
    instrukcja.push(`Załaduj ${rzedEP2} rzędów EP po 2 palety`);
    for (let i = 0; i < rzedEP2; i++) {
      rys.push(["ep2","ep2"]);
    }
    EP -= rzedEP2 * 2;
  }

  // --- EP(3) ---
  let rzedEP3 = Math.floor(EP / 3);
  if (rzedEP3 > 0) {
    zajete += rzedEP3 * 1.2;
    instrukcja.push(`Załaduj ${rzedEP3} rzędów EP po 3 palety`);
    for (let i = 0; i < rzedEP3; i++) {
      rys.push(["ep3","ep3","ep3"]);
    }
    EP -= rzedEP3 * 3;
  }

  // --- POJEDYNCZA EP ---
  if (EP === 1) {
    if (DL - zajete >= 0.8) {
      zajete += 0.8;
      instrukcja.push("Została 1 EP → dołóż 1 EP i zrób rząd EP(2)");
      rys.push(["ep2","ep2"]);
    } else {
      instrukcja.push("Została 1 EP → nie mieści się, usuń ją");
    }
  }

  let wolne = Math.max(0, DL - zajete);

  document.getElementById("wynik").innerHTML =
    `<b>Zajęte:</b> ${zajete.toFixed(2)} m<br>
     <b>Wolne:</b> ${wolne.toFixed(2)} m`;

  // --- CO MOŻNA DOŁOŻYĆ ---
  let moznaW = Math.floor(wolne / 1.0) * 2;
  let moznaEP2 = Math.floor(wolne / 0.8) * 2;
  let moznaEP3 = Math.floor(wolne / 1.2) * 3;

  instrukcja.push("<b>Można jeszcze doładować:</b>");
  if (moznaW > 0) instrukcja.push(`${moznaW} palet W`);
  if (moznaEP2 > 0) instrukcja.push(`${moznaEP2} palet EP (rząd 2)`);
  if (moznaEP3 > 0) instrukcja.push(`${moznaEP3} palet EP (rząd 3)`);

  document.getElementById("instrukcja").innerHTML =
    "<ol>" + instrukcja.map(i => `<li>${i}</li>`).join("") + "</ol>";

  // --- RYSUNEK ---
  let html = `<div class="trailer">`;
  rys.forEach(r => {
    html += `<div class="row">`;
    r.forEach(b => html += `<div class="box ${b}"></div>`);
    html += `</div>`;
  });

  let freeRows = Math.floor(wolne / 1.0);
  for (let i = 0; i < freeRows; i++) {
    html += `<div class="row"><div class="box free"></div><div class="box free"></div></div>`;
  }

  html += `</div>
  <div class="legend">
    <span><i class="w"></i>W</span>
    <span><i class="wep"></i>W+EP</span>
    <span><i class="ep2"></i>EP(2)</span>
    <span><i class="ep3"></i>EP(3)</span>
    <span><i class="free"></i>Wolne</span>
  </div>`;

  document.getElementById("rysunek").innerHTML = html;
}
</script>

</body>
</html>
