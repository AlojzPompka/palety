<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator załadunku W + EP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family: system-ui, Arial;
  background:#f2f2f2;
  padding:20px;
}
.card{
  background:#fff;
  max-width:420px;
  margin:auto;
  padding:20px;
  border-radius:14px;
}
input{
  width:100%;
  padding:10px;
  margin:6px 0 14px;
  font-size:16px;
}
button{
  width:100%;
  padding:12px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:18px;
}
.result{
  margin-top:16px;
  font-size:15px;
}
.trailer{
  margin-top:14px;
  background:#222;
  padding:6px;
  border-radius:10px;
}
.row{
  display:grid;
  gap:4px;
  margin-bottom:4px;
}
.w2{ grid-template-columns:1fr 1fr; }
.ep3{ grid-template-columns:1fr 1fr 1fr; }
.ep2{ grid-template-columns:1fr 1fr; }

.box{
  height:18px;            /* 🔽 ZMNIEJSZONY RYSUNEK */
  border-radius:4px;
}
.w{background:#4a90e2;}
.epmix{background:#f5a623;}
.ep3c{background:#7ed321;}
.ep2c{background:#417505;}
.free{background:#aaa;}

.legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  font-size:12px;
  margin-top:8px;
}
.legend span{
  display:flex;
  align-items:center;
  gap:4px;
}
.legend i{
  width:12px;
  height:12px;
  display:inline-block;
  border-radius:3px;
}
</style>
</head>

<body>
<div class="card">
<h2>Kalkulator załadunku W + EP</h2>

<label>Palety W</label>
<input type="number" id="w" value="0" min="0">

<label>Palety EP</label>
<input type="number" id="ep" value="0" min="0">

<button onclick="calculate()">Oblicz</button>

<div class="result" id="text"></div>
<div class="trailer" id="draw"></div>

<div class="legend">
  <span><i class="w"></i>W</span>
  <span><i class="epmix"></i>W+EP</span>
  <span><i class="ep3c"></i>EP(3)</span>
  <span><i class="ep2c"></i>EP(2)</span>
  <span><i class="free"></i>Wolne</span>
</div>
</div>

<script>
const TRAILER = 13.4;

function calculate(){
  let W = +document.getElementById("w").value;
  let EP = +document.getElementById("ep").value;

  let rowsW = Math.floor(W/2);
  let restW = W%2;

  let rowsMix = restW && EP ? 1 : 0;
  if(rowsMix){ EP--; }

  let rowsEP3 = Math.floor(EP/3);
  let restEP = EP%3;

  let rowsEP2 = restEP >=2 ? 1 : 0;

  let used =
    rowsW*1.0 +
    rowsMix*1.0 +
    rowsEP3*1.2 +
    rowsEP2*0.8;

  let free = +(TRAILER - used).toFixed(2);

  let html = `
    <b>Zajęte:</b> ${used.toFixed(2)} m<br>
    <b>Wolne:</b> ${free>0?free:0} m
    <hr>
    <b>Rozpiska:</b>
    <ul>
      <li>Rzędy W: ${rowsW}</li>
      ${rowsMix?'<li>Rząd W + EP</li>':''}
      ${rowsEP3?'<li>Rzędy EP(3): '+rowsEP3+'</li>':''}
      ${rowsEP2?'<li>Rzędy EP(2): '+rowsEP2+'</li>':''}
    </ul>
  `;
  document.getElementById("text").innerHTML = html;

  draw(rowsW, rowsMix, rowsEP3, rowsEP2, free);
}

function draw(w, mix, ep3, ep2, free){
  let d = document.getElementById("draw");
  d.innerHTML = "";

  for(let i=0;i<w;i++){
    d.innerHTML += `<div class="row w2">
      <div class="box w"></div><div class="box w"></div>
    </div>`;
  }
  if(mix){
    d.innerHTML += `<div class="row w2">
      <div class="box w"></div><div class="box epmix"></div>
    </div>`;
  }
  for(let i=0;i<ep3;i++){
    d.innerHTML += `<div class="row ep3">
      <div class="box ep3c"></div><div class="box ep3c"></div><div class="box ep3c"></div>
    </div>`;
  }
  if(ep2){
    d.innerHTML += `<div class="row ep2">
      <div class="box ep2c"></div><div class="box ep2c"></div>
    </div>`;
  }
  if(free>0){
    d.innerHTML += `<div class="row w2">
      <div class="box free"></div><div class="box free"></div>
    </div>`;
  }
}
</script>
</body>
</html>
