<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f2f2f2;
  padding:20px;
}
.box {
  background:#fff;
  padding:20px;
  border-radius:14px;
  max-width:480px;
  margin:auto;
}
h1 { font-size:22px; margin-bottom:15px; }
label { font-weight:600; }
input {
  width:100%;
  padding:10px;
  margin:6px 0 12px;
  font-size:16px;
}
.row {
  display:flex;
  gap:10px;
  align-items:center;
}
.btn {
  width:44px;
  height:44px;
  font-size:24px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:#fff;
}
.btn:disabled {
  background:#ccc;
}
.result {
  margin-top:20px;
  background:#fafafa;
  padding:15px;
  border-radius:10px;
}
.red { color:#c00; font-weight:700; }
.small { font-size:14px; color:#555; }
ul { padding-left:20px; }
</style>
</head>

<body>
<div class="box">
<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W</label>
<input type="number" id="w" min="0" value="0" oninput="oblicz()">

<label>Palety EP</label>
<input type="number" id="ep" min="0" value="0" oninput="oblicz()">

<label>Jedynki W (przód, środek)</label>
<div class="row">
  <button class="btn" id="jwMinus" onclick="zmienJedynke('jw', -1)">−</button>
  <input type="number" id="jw" min="0" value="0" oninput="oblicz()">
  <button class="btn" id="jwPlus" onclick="zmienJedynke('jw', 1)">+</button>
</div>

<label>Jedynki EP (przód, środek)</label>
<div class="row">
  <button class="btn" id="jepMinus" onclick="zmienJedynke('jep', -1)">−</button>
  <input type="number" id="jep" min="0" value="0" oninput="oblicz()">
  <button class="btn" id="jepPlus" onclick="zmienJedynke('jep', 1)">+</button>
</div>

<div class="result" id="wynik"></div>
</div>

<script>
const NACZEPA = 13.4;
const W_LEN = 1.0;
const EP_LEN = 0.8;

function zmienJedynke(id, delta) {
  const el = document.getElementById(id);
  let nowa = Number(el.value) + delta;
  if (nowa < 0) nowa = 0;
  el.value = nowa;
  oblicz(true);
}

function oblicz(zPrzycisku = false) {

  let w = +document.getElementById("w").value;
  let ep = +document.getElementById("ep").value;
  let jw = +document.getElementById("jw").value;
  let jep = +document.getElementById("jep").value;

  let zajete = 0;
  let rozpiska = [];

  // ===== JEDYNKI =====
  let mJW = jw * 2 * W_LEN;
  let mJEP = jep * EP_LEN;

  zajete += mJW + mJEP;

  // ===== BLOKADA PRZEKROCZENIA =====
  if (zajete > NACZEPA) {
    // cofamy ostatnią zmianę
    if (zPrzycisku) {
      if (jw > 0) document.getElementById("jw").value = jw - 1;
      else if (jep > 0) document.getElementById("jep").value = jep - 1;
      return oblicz();
    }
  }

  if (jw > 0) {
    rozpiska.push(`Jedynki W: ${jw} × 2,0 m = ${mJW.toFixed(2)} m`);
    w = Math.max(0, w - jw);
  }

  if (jep > 0) {
    rozpiska.push(`Jedynki EP: ${jep} × 0,8 m = ${mJEP.toFixed(2)} m`);
    ep = Math.max(0, ep - jep);
  }

  // ===== RZĘDY W =====
  let rzedowW = Math.floor(w / 2);
  let mW = rzedowW * W_LEN;
  zajete += mW;
  if (rzedowW > 0)
    rozpiska.push(`Rzędy W: ${rzedowW} × 1,0 m = ${mW.toFixed(2)} m`);

  // ===== RZĘDY EP =====
  let rzedowEP = Math.floor(ep / 3);
  let mEP = rzedowEP * EP_LEN;
  zajete += mEP;
  if (rzedowEP > 0)
    rozpiska.push(`Rzędy EP: ${rzedowEP} × 0,8 m = ${mEP.toFixed(2)} m`);

  let wolne = +(NACZEPA - zajete).toFixed(2);

  // ===== BLOKADA PRZYCISKÓW + =====
  document.getElementById("jwPlus").disabled = wolne < 2;
  document.getElementById("jepPlus").disabled = wolne < 0.8;

  let html = `
    <b>Zajęta długość:</b> ${zajete.toFixed(2)} m<br>
    <b>Wolna długość:</b> ${wolne > 0 ? wolne : 0} m
    <hr>
    <b>Rozpiska metrów:</b>
    <ul>${rozpiska.map(r => `<li>${r}</li>`).join("")}</ul>
  `;

  if (wolne <= 0) {
    html += `<div class="red">BRAK MIEJSCA – naczepa pełna</div>`;
  } else {
    html += `
      <hr>
      <b>Można jeszcze dołożyć:</b><br>
      ${Math.floor(wolne / W_LEN)} W lub
      ${Math.floor(wolne / EP_LEN)} EP
      <div class="small">
        Podpowiedź: ${
          wolne >= 2 ? "jedynka W" :
          wolne >= 0.8 ? "jedynka EP" :
          "brak miejsca na jedynki"
        }
      </div>
    `;
  }

  document.getElementById("wynik").innerHTML = html;
}

oblicz();
</script>
</body>
</html>
