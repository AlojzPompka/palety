<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#0b0f0c">

<link rel="manifest" href="./manifest.webmanifest">

<title>Powrót do hulajnogi</title>

<style>

* {

    box-sizing: border-box;

}

html, body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #0b0f0c;

    color: white;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}

#scene {

    position: fixed;

    inset: 0;

    background:

        radial-gradient(

            circle at center,

            rgba(255,255,255,.05) 0 1px,

            transparent 1.5px

        ) 0 0 / 28px 28px,

        linear-gradient(#111813,#0b0f0c);

}

#radar {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

}

#top {

    position: fixed;

    z-index: 20;

    top: max(12px, env(safe-area-inset-top));

    left: 12px;

    right: 12px;

    padding: 12px;

    border-radius: 18px;

    background: rgba(8,12,9,.92);

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

}

#status {

    text-align: center;

    font-size: 13px;

    color: #adb5ae;

}

#distance {

    text-align: center;

    font-size: 34px;

    font-weight: 850;

    margin-top: 3px;

}

#bearingText {

    text-align: center;

    font-size: 13px;

    color: #adb5ae;

    margin-top: 3px;

}

#hint {

    text-align: center;

    font-size: 13px;

    color: #adb5ae;

    margin-top: 4px;

}

#north {

    position: fixed;

    z-index: 15;

    left: 50%;

    top: calc(50% - 145px);

    transform: translateX(-50%);

    display: none;

    text-align: center;

    pointer-events: none;

}

#northArrow {

    font-size: 60px;

    line-height: .9;

    font-weight: 300;

}

#northText {

    margin-top: 4px;

    font-size: 15px;

    font-weight: 900;

    color: white;

}

#bottom {

    position: fixed;

    z-index: 20;

    left: 12px;

    right: 12px;

    bottom: max(12px, env(safe-area-inset-bottom));

    padding: 10px;

    border-radius: 18px;

    background: rgba(8,12,9,.92);

    backdrop-filter: blur(12px);

    -webkit-backdrop-filter: blur(12px);

}

.buttons {

    display: flex;

    gap: 8px;

}

button {

    flex: 1;

    border: 0;

    border-radius: 14px;

    min-height: 52px;

    padding: 10px 7px;

    font-size: 15px;

    font-weight: 800;

}

#park {

    background: #31d158;

    color: #001a07;

}

#back {

    background: #ff9f0a;

    color: #1d0d00;

}

#reset {

    background: #ff453a;

    color: white;

}

.badge {

    display: inline-block;

    padding: 2px 7px;

    margin-left: 5px;

    border-radius: 10px;

    background: rgba(255,255,255,.08);

}

</style>

</head>

<body>

<div id="scene">

    <canvas id="radar"></canvas>

</div>

<div id="top">

    <div id="status">

        Czekam na GPS…

    </div>

    <div id="distance">

        —

    </div>

    <div id="bearingText">

        Kierunek do hulajnogi: —

    </div>

    <div id="hint">

        Przy hulajnodze naciśnij ZAPARKOWAŁEM.

    </div>

</div>

<div id="north">

    <div id="northArrow">

        ↑

    </div>

    <div id="northText">

        N

    </div>

</div>

<div id="bottom">

    <div class="buttons">

        <button id="park">

            🛴 ZAPARKOWAŁEM

        </button>

        <button id="back">

            ↩️ WRÓĆ

        </button>

        <button id="reset">

            RESET

        </button>

    </div>

</div>

<script>

"use strict";

const BUILD = "v9-north-up";

const $ = id => document.getElementById(id);

const canvas = $("radar");

const ctx = canvas.getContext("2d");

let current = null;

let scooter = null;

let returnMode = false;

/* =========================================

   WCZYTANIE HULAJNOGI

========================================= */

try {

    const stored =

        localStorage.getItem("scooterPosition") ||

        localStorage.getItem("carPosition");

    if (stored) {

        const data = JSON.parse(stored);

        const lat = Number(data.lat);

        const lng = Number(data.lng);

        if (

            Number.isFinite(lat) &&

            Number.isFinite(lng)

        ) {

            scooter = {

                lat: lat,

                lng: lng

            };

        }

    }

} catch (error) {

    scooter = null;

}

if (scooter) {

    $("park").style.display = "none";

}

/* =========================================

   CANVAS

========================================= */

function resizeCanvas() {

    const dpr =

        Math.max(

            1,

            window.devicePixelRatio || 1

        );

    canvas.width =

        innerWidth * dpr;

    canvas.height =

        innerHeight * dpr;

    canvas.style.width =

        innerWidth + "px";

    canvas.style.height =

        innerHeight + "px";

    ctx.setTransform(

        dpr,

        0,

        0,

        dpr,

        0,

        0

    );

    drawRadar();

}

window.addEventListener(

    "resize",

    resizeCanvas

);

resizeCanvas();

/* =========================================

   ODLEGŁOŚĆ

   TU JEST POPRAWIONY BŁĄD NaN.

========================================= */

function distanceM(

    lat1,

    lon1,

    lat2,

    lon2

) {

    lat1 = Number(lat1);

    lon1 = Number(lon1);

    lat2 = Number(lat2);

    lon2 = Number(lon2);

    if (

        !Number.isFinite(lat1) ||

        !Number.isFinite(lon1) ||

        !Number.isFinite(lat2) ||

        !Number.isFinite(lon2)

    ) {

        return 0;

    }

    const R = 6371000;

    const p1 =

        lat1 * Math.PI / 180;

    const p2 =

        lat2 * Math.PI / 180;

    const dp =

        (lat2 - lat1) *

        Math.PI / 180;

    const dl =

        (lon2 - lon1) *

        Math.PI / 180;

    const a =

        Math.sin(dp / 2) ** 2 +

        Math.cos(p1) *

        Math.cos(p2) *

        Math.sin(dl / 2) ** 2;

    return R * 2 * Math.atan2(

        Math.sqrt(a),

        Math.sqrt(1 - a)

    );

}

/* =========================================

   KIERUNEK GPS DO HULAJNOGI

   0°   = północ

   90°  = wschód

   180° = południe

   270° = zachód

========================================= */

function bearingDeg(

    lat1,

    lon1,

    lat2,

    lon2

) {

    lat1 = Number(lat1);

    lon1 = Number(lon1);

    lat2 = Number(lat2);

    lon2 = Number(lon2);

    if (

        !Number.isFinite(lat1) ||

        !Number.isFinite(lon1) ||

        !Number.isFinite(lat2) ||

        !Number.isFinite(lon2)

    ) {

        return 0;

    }

    const p1 =

        lat1 * Math.PI / 180;

    const p2 =

        lat2 * Math.PI / 180;

    const dLon =

        (lon2 - lon1) *

        Math.PI / 180;

    const y =

        Math.sin(dLon) *

        Math.cos(p2);

    const x =

        Math.cos(p1) *

        Math.sin(p2) -

        Math.sin(p1) *

        Math.cos(p2) *

        Math.cos(dLon);

    const bearing =

        Math.atan2(y, x) *

        180 / Math.PI;

    return (bearing + 360) % 360;

}

/* =========================================

   NAZWA KIERUNKU

========================================= */

function bearingName(angle) {

    const names = [

        "N",

        "NE",

        "E",

        "SE",

        "S",

        "SW",

        "W",

        "NW"

    ];

    const index =

        Math.round(

            angle / 45

        ) % 8;

    return names[index];

}

/* =========================================

   DŁUGOŚĆ LINII

   Im dalej hulajnoga,

   tym linia dłuższa.

========================================= */

function distanceToRadius(

    distance,

    maxRadius

) {

    distance =

        Number(distance);

    if (

        !Number.isFinite(distance) ||

        distance <= 0

    ) {

        return 4;

    }

    /*

    Pełny radar około 2 km.

    Skala logarytmiczna powoduje,

    że dobrze widać także 20–200 m.

    */

    const referenceDistance =

        2000;

    let ratio =

        Math.log(

            1 + distance / 10

        )

        /

        Math.log(

            1 + referenceDistance / 10

        );

    ratio =

        Math.max(

            0,

            Math.min(

                1,

                ratio

            )

        );

    return 7 +

        ratio *

        (

            maxRadius - 7

        );

}

/* =========================================

   GPS

========================================= */

function gpsUpdate(position) {

    const lat =

        Number(

            position.coords.latitude

        );

    const lng =

        Number(

            position.coords.longitude

        );

    const accuracy =

        Number(

            position.coords.accuracy

        );

    if (

        !Number.isFinite(lat) ||

        !Number.isFinite(lng)

    ) {

        return;

    }

    current = {

        lat: lat,

        lng: lng,

        accuracy:

            Number.isFinite(accuracy)

            ?

            accuracy

            :

            0

    };

    updateUI();

    drawRadar();

}

function gpsError(error) {

    $("status").textContent =

        "Błąd GPS: " +

        error.message;

}

if ("geolocation" in navigator) {

    navigator.geolocation.watchPosition(

        gpsUpdate,

        gpsError,

        {

            enableHighAccuracy: true,

            maximumAge: 0,

            timeout: 15000

        }

    );

} else {

    $("status").textContent =

        "Brak GPS.";

}

/* =========================================

   INTERFEJS

========================================= */

function updateUI() {

    if (!current) {

        $("status").textContent =

            "Czekam na GPS…";

        return;

    }

    $("status").innerHTML =

        `GPS ±${Math.round(

            current.accuracy

        )} m`

        +

        ` <span class="badge">${BUILD}</span>`;

    if (

        scooter &&

        returnMode

    ) {

        const distance =

            distanceM(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        const bearing =

            bearingDeg(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        if (distance >= 1000) {

            $("distance").textContent =

                "🛴 " +

                (distance / 1000).toFixed(2) +

                " km";

        } else {

            $("distance").textContent =

                "🛴 " +

                Math.round(distance) +

                " m";

        }

        $("bearingText").textContent =

            "Hulajnoga: " +

            bearingName(bearing) +

            " · " +

            Math.round(bearing) +

            "°";

        $("hint").textContent =

            "Północ jest zawsze u góry. Punkt hulajnogi zmienia pozycję według GPS.";

        $("north").style.display =

            "block";

    }

    else if (scooter) {

        $("distance").textContent =

            "🛴 HULAJNOGA ZAPISANA";

        $("bearingText").textContent =

            "Kierunek do hulajnogi: —";

        $("hint").textContent =

            "Gdy chcesz wracać, naciśnij WRÓĆ.";

        $("north").style.display =

            "none";

    }

    else {

        $("distance").textContent =

            "—";

        $("bearingText").textContent =

            "Kierunek do hulajnogi: —";

        $("hint").textContent =

            "Przy hulajnodze naciśnij ZAPARKOWAŁEM.";

        $("north").style.display =

            "none";

    }

}

/* =========================================

   RADAR

   N = ZAWSZE GÓRA.

   Nie używamy kompasu telefonu.

========================================= */

function drawRadar() {

    const width =

        innerWidth;

    const height =

        innerHeight;

    const centerX =

        width / 2;

    const centerY =

        height / 2;

    const maxRadius =

        Math.min(

            width,

            height

        ) * 0.37;

    ctx.clearRect(

        0,

        0,

        width,

        height

    );

    ctx.save();

    /* =====================================

       OKRĘGI

    ===================================== */

    ctx.strokeStyle =

        "rgba(255,255,255,.13)";

    ctx.lineWidth =

        1;

    [

        0.25,

        0.5,

        0.75,

        1

    ].forEach(scale => {

        ctx.beginPath();

        ctx.arc(

            centerX,

            centerY,

            maxRadius * scale,

            0,

            Math.PI * 2

        );

        ctx.stroke();

    });

    /* =====================================

       LINIE N/S E/W

    ===================================== */

    ctx.beginPath();

    ctx.moveTo(

        centerX - maxRadius,

        centerY

    );

    ctx.lineTo(

        centerX + maxRadius,

        centerY

    );

    ctx.moveTo(

        centerX,

        centerY - maxRadius

    );

    ctx.lineTo(

        centerX,

        centerY + maxRadius

    );

    ctx.stroke();

    /* =====================================

       OZNACZENIA KIERUNKÓW

    ===================================== */

    ctx.fillStyle =

        "rgba(255,255,255,.55)";

    ctx.font =

        "700 13px -apple-system";

    ctx.textAlign =

        "center";

    ctx.fillText(

        "N",

        centerX,

        centerY - maxRadius + 20

    );

    ctx.fillText(

        "S",

        centerX,

        centerY + maxRadius - 10

    );

    ctx.fillText(

        "W",

        centerX - maxRadius + 14,

        centerY + 4

    );

    ctx.fillText(

        "E",

        centerX + maxRadius - 14,

        centerY + 4

    );

    /* =====================================

       TY

    ===================================== */

    ctx.fillStyle =

        "#0a84ff";

    ctx.beginPath();

    ctx.arc(

        centerX,

        centerY,

        9,

        0,

        Math.PI * 2

    );

    ctx.fill();

    ctx.strokeStyle =

        "white";

    ctx.lineWidth =

        3;

    ctx.stroke();

    /* =====================================

       HULAJNOGA

    ===================================== */

    if (

        returnMode &&

        current &&

        scooter

    ) {

        const distance =

            distanceM(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        const bearing =

            bearingDeg(

                current.lat,

                current.lng,

                scooter.lat,

                scooter.lng

            );

        /*

        Północ = góra canvas.

        Canvas:

        0 rad = prawo.

        Dlatego odejmujemy 90°.

        */

        const angle =

            (

                bearing -

                90

            )

            *

            Math.PI /

            180;

        const lineLength =

            distanceToRadius(

                distance,

                maxRadius * 0.93

            );

        const scooterX =

            centerX +

            Math.cos(angle) *

            lineLength;

        const scooterY =

            centerY +

            Math.sin(angle) *

            lineLength;

        /* =================================

           CIĄGŁA CZERWONA LINIA

        ================================= */

        ctx.setLineDash([]);

        ctx.strokeStyle =

            "#ff453a";

        ctx.lineWidth =

            7;

        ctx.lineCap =

            "round";

        ctx.beginPath();

        ctx.moveTo(

            centerX,

            centerY

        );

        ctx.lineTo(

            scooterX,

            scooterY

        );

        ctx.stroke();

        /* =================================

           HULAJNOGA

        ================================= */

        ctx.fillStyle =

            "#ff9f0a";

        ctx.beginPath();

        ctx.arc(

            scooterX,

            scooterY,

            15,

            0,

            Math.PI * 2

        );

        ctx.fill();

        ctx.strokeStyle =

            "white";

        ctx.lineWidth =

            2;

        ctx.stroke();

        ctx.font =

            "700 20px -apple-system";

        ctx.textAlign =

            "center";

        ctx.fillStyle =

            "white";

        ctx.fillText(

            "🛴",

            scooterX,

            scooterY - 24

        );

        /* =================================

           DYSTANS NA LINII

        ================================= */

        if (lineLength > 70) {

            const textX =

                centerX +

                Math.cos(angle) *

                lineLength *

                0.55;

            const textY =

                centerY +

                Math.sin(angle) *

                lineLength *

                0.55;

            ctx.font =

                "700 13px -apple-system";

            ctx.fillStyle =

                "white";

            const distanceText =

                distance >= 1000

                ?

                (distance / 1000).toFixed(2) +

                " km"

                :

                Math.round(distance) +

                " m";

            ctx.fillText(

                distanceText,

                textX,

                textY - 10

            );

        }

    }

    ctx.restore();

}

/* =========================================

   ZAPARKOWAŁEM

========================================= */

$("park").addEventListener(

    "click",

    () => {

        if (!current) {

            alert(

                "Poczekaj, aż GPS złapie pozycję."

            );

            return;

        }

        scooter = {

            lat:

                Number(

                    current.lat

                ),

            lng:

                Number(

                    current.lng

                )

        };

        localStorage.setItem(

            "scooterPosition",

            JSON.stringify(

                scooter

            )

        );

        localStorage.removeItem(

            "carPosition"

        );

        returnMode =

            false;

        $("park").style.display =

            "none";

        updateUI();

        drawRadar();

    }

);

/* =========================================

   WRÓĆ

========================================= */

$("back").addEventListener(

    "click",

    () => {

        if (!scooter) {

            alert(

                "Najpierw zapisz hulajnogę."

            );

            return;

        }

        if (!current) {

            alert(

                "Czekam na GPS."

            );

            return;

        }

        returnMode =

            true;

        updateUI();

        drawRadar();

    }

);

/* =========================================

   RESET

========================================= */

$("reset").addEventListener(

    "click",

    () => {

        if (

            !confirm(

                "Usunąć zapisane miejsce hulajnogi?"

            )

        ) {

            return;

        }

        localStorage.removeItem(

            "scooterPosition"

        );

        localStorage.removeItem(

            "carPosition"

        );

        scooter =

            null;

        returnMode =

            false;

        $("park").style.display =

            "";

        updateUI();

        drawRadar();

    }

);

updateUI();

/* =========================================

   OFFLINE

========================================= */

if ("serviceWorker" in navigator) {

    window.addEventListener(

        "load",

        () => {

            navigator.serviceWorker.register(

                "./sw.js?v=9",

                {

                    updateViaCache:

                        "none"

                }

            ).catch(() => {});

        }

    );

}

</script>

</body>

</html>
