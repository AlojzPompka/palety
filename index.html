<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Palet W + S – Naczepa 13,6 m</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 740px;
            margin: 30px auto;
            padding: 20px;
            background: #f8f9fa;
            color: #212529;
        }
        h1 {
            color: #c82333;
            text-align: center;
            margin-bottom: 25px;
        }
        .opis {
            background: #fff3cd;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            line-height: 1.55;
            border-left: 5px solid #ffc107;
        }
        form {
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }
        label {
            font-weight: bold;
            display: block;
            margin: 18px 0 8px;
            font-size: 1.05em;
        }
        input {
            width: 100%;
            padding: 13px;
            font-size: 17px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 22px;
            transition: background 0.2s;
        }
        button:hover {
            background: #218838;
        }
        #wynik {
            margin-top: 35px;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
            line-height: 1.65;
        }
        .section {
            margin: 10px 0;
            padding: 12px 16px;
            background: #f1f3f5;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .alert {
            color: #dc3545;
            font-weight: bold;
            margin: 12px 0;
        }
        .info {
            color: #6c757d;
            font-size: 0.94em;
            margin-top: 12px;
        }
        #schemat {
            border: 1px solid #adb5bd;
            background: #f8f9fa;
            margin-top: 25px;
            display: block;
            width: 100%;
            height: 720px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Kalkulator Palet – Naczepa 13,6 m</h1>

    <div class="opis">
        <strong>Format wpisywania:</strong> np. <code>12s 8w</code> lub <code>18s</code> lub <code>5s i 3w</code><br>
        <strong>Kolejność ładowania:</strong> jedynki S (z przodu) → pary W → mieszana (jeśli potrzeba) → dwójki S → trójki S<br>
        <strong>Na schemacie:</strong> <strong>każda paleta = osobny prostokąt</strong> (33 palety = 33 prostokąty)
    </div>

    <form id="form">
        <label>Ilość palet (np. 10s i 10w):</label>
        <input type="text" id="ilosc" placeholder="10s i 10w" required autofocus>

        <button type="submit">Oblicz układ</button>
    </form>

    <div id="wynik"></div>

    <script>
        document.getElementById('form').addEventListener('submit', e => {
            e.preventDefault();

            const input = document.getElementById('ilosc').value.toLowerCase().replace(/i/g, '').replace(/\s+/g, ' ');
            const sMatch = input.match(/(\d+)\s*s/);
            const wMatch = input.match(/(\d+)\s*w/);
            let totalS = sMatch ? parseInt(sMatch[1]) : 0;
            let totalW = wMatch ? parseInt(wMatch[1]) : 0;

            if (totalS === 0 && totalW === 0) return;

            const L = 13.6;
            const LEN_W_PAIR   = 1.0;
            const LEN_S_TRIO   = 1.2;
            const LEN_S_DUO    = 0.8;
            const LEN_S_SINGLE = 0.8;
            const LEN_MIX      = 0.8;

            let rows = [];
            let occupied = 0;
            let loadedS = 0;
            let loadedW = 0;

            // 1. Jedynki S – zawsze z przodu
            let maxSingles = Math.floor(L / LEN_S_SINGLE);
            let singles = Math.min(totalS, maxSingles);
            if (singles > 0) {
                occupied += singles * LEN_S_SINGLE;
                rows.push({ type: 'S-single', length: LEN_S_SINGLE, count: singles });
                loadedS += singles;
                totalS -= singles;
            }

            // 2. Pary W
            let fullWPairs = Math.floor(totalW / 2);
            let wSpace = fullWPairs * LEN_W_PAIR;
            if (fullWPairs > 0 && occupied + wSpace <= L) {
                occupied += wSpace;
                rows.push({ type: 'W-pair', length: LEN_W_PAIR, count: fullWPairs });
                loadedW += fullWPairs * 2;
                totalW -= fullWPairs * 2;
            }

            // 3. Mieszana dwójka (jeśli została 1 W i jest S)
            let mixed = false;
            if (totalW === 1 && totalS >= 1 && occupied + LEN_MIX <= L) {
                mixed = true;
                occupied += LEN_MIX;
                rows.push({ type: 'mixed', length: LEN_MIX, count: 1 });
                loadedW += 1;
                loadedS += 1;
                totalS -= 1;
                totalW = 0;
            }

            // 4. Reszta S – maksymalne wypełnienie (trójki > dwójki)
            let remLen = L - occupied;
            let bestT = 0, bestD = 0, bestLen = 0;

            for (let t = Math.floor(totalS / 3); t >= 0; t--) {
                let remPal = totalS - t * 3;
                let d = Math.floor(remPal / 2);
                let len = t * LEN_S_TRIO + d * LEN_S_DUO;
                if (len <= remLen && len > bestLen) {
                    bestLen = len;
                    bestT = t;
                    bestD = d;
                }
            }

            if (bestLen > 0) {
                occupied += bestLen;
                if (bestD > 0) {
                    rows.push({ type: 'S-duo', length: LEN_S_DUO, count: bestD });
                    loadedS += bestD * 2;
                }
                if (bestT > 0) {
                    rows.push({ type: 'S-trio', length: LEN_S_TRIO, count: bestT });
                    loadedS += bestT * 3;
                }
            }

            let free = L - occupied;
            let fillPercent = Math.round((occupied / L) * 100);

            let html = `<h3>Załadowano: ${loadedS} S + ${loadedW} W</h3>`;
            html += `<p><strong>Zajęte:</strong> ${occupied.toFixed(2)} m &nbsp;&nbsp; <strong>Wolne:</strong> ${free.toFixed(2)} m</p>`;
            html += `<p><strong>Zapełnienie naczepy:</strong> ${fillPercent}%</p>`;

            html += '<p><strong>Układ od przodu do tyłu:</strong></p>';
            rows.forEach(r => {
                let txt = '';
                if (r.type === 'S-single') txt = `${r.count} × jedynka S`;
                else if (r.type === 'W-pair') txt = `${r.count} × para W`;
                else if (r.type === 'mixed') txt = `1 × mieszana (W+S)`;
                else if (r.type === 'S-duo') txt = `${r.count} × dwójka S`;
                else if (r.type === 'S-trio') txt = `${r.count} × trójka S`;
                html += `<div class="section">${txt} (${r.length} m na rząd)</div>`;
            });

            if (totalW > 0 || totalS > 0) {
                html += `<p class="alert">Nie załadowano: ${totalS} S + ${totalW} W (brak miejsca / pary)</p>`;
            }

            html += '<h4>Schemat naczepy – każda paleta to osobny prostokąt</h4>';
            html += '<canvas id="schemat" width="380" height="720"></canvas>';
            html += '<p class="info">Niebieski = W • Pomarańcz = S jedynka • Żółty = S dwójka • Zielony = S trójka • Fiolet/turkus = mieszana W+S • Szary = wolne miejsce</p>';

            document.getElementById('wynik').innerHTML = html;

            // Rysowanie schematu – KAŻDA paleta osobno
            const canvas = document.getElementById('schemat');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const scaleY = (canvas.height - 80) / L;
            const left = 70;
            const fullW = canvas.width - 140;
            let y = 40;

            // Tło naczepy
            ctx.fillStyle = '#e9ecef';
            ctx.fillRect(left, 40, fullW, canvas.height - 80);

            // Linie metrowe
            ctx.strokeStyle = '#dee2e6';
            ctx.lineWidth = 1;
            for (let m = 1; m < L; m++) {
                let yy = 40 + m * scaleY;
                ctx.beginPath();
                ctx.moveTo(left, yy);
                ctx.lineTo(left + fullW, yy);
                ctx.stroke();
            }

            rows.forEach(row => {
                const rowH = row.length * scaleY;

                if (row.type === 'S-single') {
                    const palW = fullW;
                    for (let i = 0; i < row.count; i++) {
                        drawPaleta(ctx, left, y + i * rowH, palW, rowH, '#fd7e14', 'S');
                    }
                    y += row.count * rowH;
                }
                else if (row.type === 'W-pair' || row.type === 'S-duo') {
                    const palW = fullW / 2;
                    const color = row.type === 'W-pair' ? '#007bff' : '#ffc107';
                    const label = row.type === 'W-pair' ? 'W' : 'S';
                    for (let i = 0; i < row.count; i++) {
                        drawPaleta(ctx, left,           y + i * rowH, palW, rowH, color, label);
                        drawPaleta(ctx, left + palW,    y + i * rowH, palW, rowH, color, label);
                    }
                    y += row.count * rowH;
                }
                else if (row.type === 'S-trio') {
                    const palW = fullW / 3;
                    for (let i = 0; i < row.count; i++) {
                        drawPaleta(ctx, left,             y + i * rowH, palW, rowH, '#28a745', 'S');
                        drawPaleta(ctx, left + palW,      y + i * rowH, palW, rowH, '#28a745', 'S');
                        drawPaleta(ctx, left + 2 * palW,  y + i * rowH, palW, rowH, '#28a745', 'S');
                    }
                    y += row.count * rowH;
                }
                else if (row.type === 'mixed') {
                    const palW = fullW / 2;
                    drawPaleta(ctx, left,         y, palW, rowH, '#6f42c1', 'W');
                    drawPaleta(ctx, left + palW,  y, palW, rowH, '#20c997', 'S');
                    y += rowH;
                }
            });

            // Wolne miejsce
            if (y < canvas.height - 40) {
                ctx.fillStyle = '#ced4da';
                ctx.fillRect(left, y, fullW, canvas.height - 40 - y);
                ctx.fillStyle = '#6c757d';
                ctx.font = '15px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('WOLNE MIEJSCE', canvas.width / 2, y + (canvas.height - 40 - y) / 2);
            }

            // Napisy PRZÓD / TYŁ
            ctx.fillStyle = '#212529';
            ctx.font = 'bold 17px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PRZÓD naczepy', canvas.width / 2, 25);
            ctx.fillText('TYŁ naczepy', canvas.width / 2, canvas.height - 15);
        });

        function drawPaleta(ctx, x, y, w, h, color, label) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#343a40';
            ctx.lineWidth = 1.8;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = (color === '#007bff' || color === '#28a745' || color === '#6f42c1') ? '#ffffff' : '#212529';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + w / 2, y + h / 2);
        }
    </script>
</body>
</html>
