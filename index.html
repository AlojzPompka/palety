<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f0c">

<link rel="manifest" href="./manifest.webmanifest">

<title>Powrót do hulajnogi</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#0b0f0c;
    color:white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#scene{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.05) 0 1px,
            transparent 1.5px
        )
        0 0 / 28px 28px,

        linear-gradient(
            #111813,
            #0b0f0c
        );
}

#radar{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

#top{
    position:fixed;
    z-index:20;

    top:max(
        12px,
        env(safe-area-inset-top)
    );

    left:12px;
    right:12px;

    padding:12px;

    border-radius:18px;

    background:
        rgba(8,12,9,.92);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

#status{
    text-align:center;

    font-size:13px;

    color:#adb5ae;
}

#distance{
    text-align:center;

    font-size:34px;
    font-weight:850;

    margin-top:3px;
}

#sensor{
    text-align:center;

    font-size:13px;

    color:#adb5ae;

    margin-top:3px;
}

#hint{
    text-align:center;

    font-size:13px;

    color:#adb5ae;

    margin-top:4px;
}


/* =========================================
   NIERUCHOMA STRZAŁKA
========================================= */

#fixedArrow{
    position:fixed;

    z-index:15;

    left:50%;

    top:calc(50% - 105px);

    transform:translateX(-50%);

    display:none;

    text-align:center;

    pointer-events:none;
}

#fixedArrow .arrow{
    font-size:58px;

    line-height:1;

    color:white;

    filter:
        drop-shadow(
            0 3px 7px
            rgba(0,0,0,.9)
        );
}

#fixedArrow .label{
    font-size:11px;

    font-weight:800;

    color:#adb5ae;

    margin-top:2px;
}


/* =========================================
   DOLNY PANEL
========================================= */

#bottom{
    position:fixed;
    z-index:20;

    left:12px;
    right:12px;

    bottom:max(
        12px,
        env(safe-area-inset-bottom)
    );

    padding:10px;

    border-radius:18px;

    background:
        rgba(8,12,9,.92);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.buttons{
    display:flex;

    gap:8px;
}

button{
    flex:1;

    border:0;

    border-radius:14px;

    min-height:52px;

    padding:10px 7px;

    font-size:15px;

    font-weight:800;
}

#park{
    background:#31d158;

    color:#001a07;
}

#back{
    background:#ff9f0a;

    color:#1d0d00;
}

#reset{
    background:#ff453a;

    color:white;
}

.badge{
    display:inline-block;

    padding:2px 7px;

    margin-left:5px;

    border-radius:10px;

    background:
        rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div id="scene">
    <canvas id="radar"></canvas>
</div>


<div id="top">

    <div id="status">
        Czekam na GPS…
    </div>

    <div id="distance">
        —
    </div>

    <div id="sensor">
        Kierunek telefonu: —
    </div>

    <div id="hint">
        Przy hulajnodze naciśnij ZAPARKOWAŁEM.
    </div>

</div>


<div id="fixedArrow">

    <div class="arrow">
        ↑
    </div>

    <div class="label">
        PRZÓD
    </div>

</div>


<div id="bottom">

    <div class="buttons">

        <button id="park">
            🛴 ZAPARKOWAŁEM
        </button>

        <button id="back">
            ↩️ WRÓĆ
        </button>

        <button id="reset">
            RESET
        </button>

    </div>

</div>


<script>

"use strict";

const BUILD =
    "v8-fixed-arrow";


const $ =
    id =>
    document.getElementById(id);


const canvas =
    $("radar");


const ctx =
    canvas.getContext("2d");


/* =========================================
   STAN
========================================= */

let current =
    null;


let scooter =
    null;


let returnMode =
    false;


let phoneHeading =
    null;


let compassStarted =
    false;


let lastAlpha =
    null;


let lastWebkit =
    null;


let lastSensorTime =
    0;


/* =========================================
   WCZYTANIE HULAJNOGI
========================================= */

try{

    const saved =

        localStorage.getItem(
            "scooterPosition"
        )

        ||

        localStorage.getItem(
            "carPosition"
        );


    if(saved){

        const p =
            JSON.parse(saved);


        const lat =
            Number(p.lat);


        const lng =
            Number(p.lng);


        if(
            Number.isFinite(lat)
            &&
            Number.isFinite(lng)
        ){

            scooter = {
                lat,
                lng
            };
        }
    }

}catch(e){}


if(scooter){

    $("park")
        .style
        .display =
        "none";
}


/* =========================================
   CANVAS
========================================= */

function resizeCanvas(){

    const dpr =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );


    canvas.width =
        innerWidth * dpr;


    canvas.height =
        innerHeight * dpr;


    canvas.style.width =
        innerWidth + "px";


    canvas.style.height =
        innerHeight + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawRadar();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* =========================================
   KĄTY
========================================= */

function normalize360(angle){

    return (

        (

            angle % 360

        )

        +

        360

    ) % 360;
}


function normalize180(angle){

    return (

        (

            (

                angle + 180

            )

            % 360

            +

            360

        )

        % 360

    )

    - 180;
}


/* =========================================
   ODLEGŁOŚĆ
========================================= */

function distanceM(
    lat1,
    lon1,
    lat2,
    lon2
){

    lat1 =
        Number(lat1);

    lon1 =
        Number(lon1);

    lat2 =
        Number(lat2);

    lon2 =
        Number(lon2);


    if(
        !Number.isFinite(lat1)
        ||
        !Number.isFinite(lon1)
        ||
        !Number.isFinite(lat2)
        ||
        !Number.isFinite(lon2)
    ){

        return 0;
    }


    const R =
        6371000;


    const p1 =
        lat1 *
        Math.PI /
        180;


    const p2 =
        lat2 *
        Math.PI /
        180;


    const dp =
        (
            lat2 -
            lat1
        )

        *

        Math.PI /
        180;


    const dl =
        (
            lon2 -
            lon1
        )

        *

        Math.PI /
        180;


    const a =

        Math.sin(dp/2) ** 2

        +

        Math.cos(p1) *
        Math.cos(p2) *

        Math.sin(dl/2) ** 2;


    return

        R *

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1-a
            )

        );
}


/* =========================================
   KIERUNEK GPS DO HULAJNOGI
========================================= */

function bearingDeg(
    lat1,
    lon1,
    lat2,
    lon2
){

    const p1 =
        Number(lat1) *
        Math.PI /
        180;


    const p2 =
        Number(lat2) *
        Math.PI /
        180;


    const dl =

        (

            Number(lon2)

            -

            Number(lon1)

        )

        *

        Math.PI /
        180;


    const y =

        Math.sin(dl) *

        Math.cos(p2);


    const x =

        Math.cos(p1) *
        Math.sin(p2)

        -

        Math.sin(p1) *
        Math.cos(p2) *
        Math.cos(dl);


    return normalize360(

        Math.atan2(
            y,
            x
        )

        *

        180 /
        Math.PI

    );
}


/* =========================================
   DŁUGOŚĆ LINII
========================================= */

function distanceToRadius(
    distance,
    maxRadius
){

    distance =
        Number(distance);


    if(
        !Number.isFinite(distance)
        ||
        distance <= 0
    ){

        return 5;
    }


    const maxDistance =
        2000;


    let ratio =

        Math.log(
            1 +
            distance/10
        )

        /

        Math.log(
            1 +
            maxDistance/10
        );


    ratio =
        Math.max(
            0,
            Math.min(
                1,
                ratio
            )
        );


    return (

        10

        +

        ratio *

        (
            maxRadius -
            10
        )

    );
}


/* =========================================
   KOMPAS

   STRZAŁKA SIĘ NIE OBRACA.

   Obracamy wyłącznie pozycję
   hulajnogi na radarze.
========================================= */

function orientationHandler(event){

    const now =
        Date.now();


    const alpha =

        Number.isFinite(
            event.alpha
        )

        ?

        event.alpha

        :

        null;


    const webkit =

        Number.isFinite(
            event.webkitCompassHeading
        )

        ?

        normalize360(
            event.webkitCompassHeading
        )

        :

        null;


    /*
    Pierwszy pomiar.
    */

    if(
        phoneHeading === null
    ){

        if(
            webkit !== null
        ){

            phoneHeading =
                webkit;
        }

        else if(
            alpha !== null
        ){

            phoneHeading =
                normalize360(
                    360 -
                    alpha
                );
        }


        lastAlpha =
            alpha;


        lastWebkit =
            webkit;


        lastSensorTime =
            now;


        updateUI();

        drawRadar();

        return;
    }


    /*
    Do płynnego obracania radaru
    używamy zmian alpha.
    */

    if(
        alpha !== null
        &&
        lastAlpha !== null
    ){

        const delta =

            normalize180(

                alpha

                -

                lastAlpha

            );


        /*
        Filtr absurdalnych skoków.
        */

        if(
            Math.abs(delta)
            <
            90
        ){

            phoneHeading =

                normalize360(

                    phoneHeading

                    -

                    delta

                );
        }
    }


    /*
    webkitCompassHeading
    powoli koryguje dryf.
    */

    if(
        webkit !== null
    ){

        if(
            lastWebkit === null
        ){

            phoneHeading =
                webkit;
        }

        else{

            const correction =

                normalize180(

                    webkit

                    -

                    phoneHeading

                );


            /*
            Delikatna korekcja.
            */

            phoneHeading =

                normalize360(

                    phoneHeading

                    +

                    correction *
                    0.08

                );
        }


        lastWebkit =
            webkit;
    }


    lastAlpha =
        alpha;


    lastSensorTime =
        now;


    /*
    TUTAJ porusza się hulajnoga,
    nie strzałka.
    */

    updateUI();

    drawRadar();
}


/* =========================================
   START KOMPASU
========================================= */

async function startCompass(){

    if(compassStarted){

        return true;
    }


    try{

        if(

            typeof
            DeviceOrientationEvent

            !==

            "undefined"

            &&

            typeof
            DeviceOrientationEvent
                .requestPermission

            ===

            "function"

        ){

            const permission =

                await

                DeviceOrientationEvent
                    .requestPermission();


            if(
                permission !==
                "granted"
            ){

                $("hint")
                    .textContent =

                    "Brak zgody na ruch i orientację.";


                return false;
            }
        }


        window.addEventListener(

            "deviceorientation",

            orientationHandler,

            true

        );


        compassStarted =
            true;


        return true;
    }

    catch(error){

        $("hint")
            .textContent =

            "Nie udało się uruchomić kompasu.";


        return false;
    }
}


/* =========================================
   GPS
========================================= */

function gpsUpdate(pos){

    const lat =
        Number(
            pos.coords.latitude
        );


    const lng =
        Number(
            pos.coords.longitude
        );


    const accuracy =
        Number(
            pos.coords.accuracy
        );


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lng)
    ){

        return;
    }


    current = {

        lat,

        lng,

        accuracy:

            Number.isFinite(
                accuracy
            )

            ?

            accuracy

            :

            0
    };


    updateUI();

    drawRadar();
}


function gpsError(error){

    $("status")
        .textContent =

        "Błąd GPS: "

        +

        error.message;
}


navigator
    .geolocation
    .watchPosition(

        gpsUpdate,

        gpsError,

        {

            enableHighAccuracy:
                true,

            maximumAge:
                0,

            timeout:
                15000

        }

    );


/* =========================================
   UI
========================================= */

function updateUI(){

    if(!current){

        $("status")
            .textContent =
            "Czekam na GPS…";

        return;
    }


    const sensorLive =

        phoneHeading !== null

        &&

        (
            Date.now()

            -

            lastSensorTime

        )

        <
        1500;


    $("status")
        .innerHTML =

        `GPS ±${Math.round(
            current.accuracy
        )} m`

        +

        (

            sensorLive

            ?

            ` <span class="badge">
                kompas LIVE
            </span>`

            :

            ` <span class="badge">
                kompas —
            </span>`

        );


    if(
        phoneHeading !== null
    ){

        $("sensor")
            .textContent =

            "Kierunek telefonu: "

            +

            Math.round(
                phoneHeading
            )

            +

            "° · "

            +

            BUILD;
    }

    else{

        $("sensor")
            .textContent =

            "Kierunek telefonu: — · "

            +

            BUILD;
    }


    if(
        scooter
        &&
        returnMode
    ){

        const d =

            distanceM(

                current.lat,
                current.lng,

                scooter.lat,
                scooter.lng

            );


        $("distance")
            .textContent =

            d >= 1000

            ?

            "🛴 "

            +

            (d/1000)
                .toFixed(2)

            +

            " km"

            :

            "🛴 "

            +

            Math.round(d)

            +

            " m";


        $("hint")
            .textContent =

            "Strzałka jest nieruchoma. Hulajnoga obraca się na kompasie.";

    }

    else if(scooter){

        $("distance")
            .textContent =

            "🛴 HULAJNOGA ZAPISANA";


        $("hint")
            .textContent =

            "Gdy chcesz wracać, naciśnij WRÓĆ.";
    }

    else{

        $("distance")
            .textContent =
            "—";


        $("hint")
            .textContent =

            "Przy hulajnodze naciśnij ZAPARKOWAŁEM.";
    }


    $("fixedArrow")
        .style
        .display =

        returnMode
        &&
        scooter

        ?

        "block"

        :

        "none";
}


/* =========================================
   RADAR
========================================= */

function drawRadar(){

    const w =
        innerWidth;


    const h =
        innerHeight;


    const cx =
        w / 2;


    const cy =
        h / 2;


    const maxRadius =

        Math.min(
            w,
            h
        )

        *

        0.37;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    ctx.save();


    /* ===============================
       OKRĘGI
    =============================== */

    ctx.strokeStyle =
        "rgba(255,255,255,.13)";


    ctx.lineWidth =
        1;


    [
        .25,
        .5,
        .75,
        1
    ]
    .forEach(
        scale => {

            ctx.beginPath();

            ctx.arc(

                cx,
                cy,

                maxRadius *
                scale,

                0,

                Math.PI*2

            );

            ctx.stroke();
        }
    );


    /* ===============================
       KRZYŻ
    =============================== */

    ctx.beginPath();


    ctx.moveTo(
        cx-maxRadius,
        cy
    );


    ctx.lineTo(
        cx+maxRadius,
        cy
    );


    ctx.moveTo(
        cx,
        cy-maxRadius
    );


    ctx.lineTo(
        cx,
        cy+maxRadius
    );


    ctx.stroke();


    /* ===============================
       TWOJA POZYCJA
    =============================== */

    ctx.fillStyle =
        "#0a84ff";


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        9,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.strokeStyle =
        "white";


    ctx.lineWidth =
        3;


    ctx.stroke();


    /* ===============================
       HULAJNOGA
    =============================== */

    if(
        returnMode
        &&
        current
        &&
        scooter
    ){

        const d =

            distanceM(

                current.lat,
                current.lng,

                scooter.lat,
                scooter.lng

            );


        const targetBearing =

            bearingDeg(

                current.lat,
                current.lng,

                scooter.lat,
                scooter.lng

            );


        /*
        TO JEST TERAZ KLUCZ:

        STRZAŁKA NIE RUSZA SIĘ.

        Obliczamy pozycję hulajnogi
        względem kierunku telefonu.
        */

        let relativeBearing;


        if(
            phoneHeading !== null
        ){

            relativeBearing =

                normalize180(

                    targetBearing

                    -

                    phoneHeading

                );
        }

        else{

            relativeBearing =
                targetBearing;
        }


        /*
        0° = GÓRA
        90° = PRAWO
        180° = DÓŁ
        -90° = LEWO
        */

        const angle =

            (

                relativeBearing

                -

                90

            )

            *

            Math.PI /

            180;


        /*
        Im dalej hulajnoga,
        tym dłuższa linia.
        */

        const lineLength =

            distanceToRadius(

                d,

                maxRadius *
                .94

            );


        const scooterX =

            cx

            +

            Math.cos(angle)

            *

            lineLength;


        const scooterY =

            cy

            +

            Math.sin(angle)

            *

            lineLength;


        /* ===============================
           CIĄGŁA LINIA
        =============================== */

        ctx.setLineDash([]);


        ctx.strokeStyle =
            "#ff453a";


        ctx.lineWidth =
            7;


        ctx.lineCap =
            "round";


        ctx.beginPath();


        ctx.moveTo(
            cx,
            cy
        );


        ctx.lineTo(
            scooterX,
            scooterY
        );


        ctx.stroke();


        /* ===============================
           PUNKT HULAJNOGI
        =============================== */

        ctx.fillStyle =
            "#ff9f0a";


        ctx.beginPath();


        ctx.arc(

            scooterX,
            scooterY,

            15,

            0,

            Math.PI*2

        );


        ctx.fill();


        ctx.strokeStyle =
            "#fff";


        ctx.lineWidth =
            2;


        ctx.stroke();


        /* ===============================
           IKONA
        =============================== */

        ctx.font =
            "700 20px -apple-system";


        ctx.textAlign =
            "center";


        ctx.fillStyle =
            "#fff";


        ctx.fillText(

            "🛴",

            scooterX,

            scooterY - 23

        );


        /* ===============================
           ODLEGŁOŚĆ
        =============================== */

        if(
            lineLength >
            75
        ){

            const textX =

                cx

                +

                Math.cos(angle)

                *

                lineLength *
                .55;


            const textY =

                cy

                +

                Math.sin(angle)

                *

                lineLength *
                .55;


            ctx.font =
                "700 13px -apple-system";


            ctx.fillStyle =
                "#fff";


            ctx.fillText(

                d >= 1000

                ?

                (d/1000)
                    .toFixed(2)

                +

                " km"

                :

                Math.round(d)

                +

                " m",

                textX,

                textY - 10

            );
        }
    }


    ctx.restore();
}


/* =========================================
   ZAPARKOWAŁEM
========================================= */

$("park")
.addEventListener(

    "click",

    () => {

        if(!current){

            alert(
                "Poczekaj na GPS."
            );

            return;
        }


        scooter = {

            lat:
                current.lat,

            lng:
                current.lng
        };


        localStorage.setItem(

            "scooterPosition",

            JSON.stringify(
                scooter
            )

        );


        localStorage.removeItem(
            "carPosition"
        );


        returnMode =
            false;


        $("park")
            .style
            .display =
            "none";


        updateUI();

        drawRadar();
    }
);


/* =========================================
   WRÓĆ
========================================= */

$("back")
.addEventListener(

    "click",

    async () => {

        if(!scooter){

            alert(
                "Najpierw zapisz hulajnogę."
            );

            return;
        }


        if(!current){

            alert(
                "Czekam na GPS."
            );

            return;
        }


        returnMode =
            true;


        updateUI();


        await startCompass();


        drawRadar();
    }
);


/* =========================================
   RESET
========================================= */

$("reset")
.addEventListener(

    "click",

    () => {

        if(
            !confirm(
                "Usunąć zapisane miejsce hulajnogi?"
            )
        ){

            return;
        }


        localStorage.removeItem(
            "scooterPosition"
        );


        localStorage.removeItem(
            "carPosition"
        );


        scooter =
            null;


        returnMode =
            false;


        $("park")
            .style
            .display =
            "";


        updateUI();

        drawRadar();
    }
);


/* =========================================
   LIVE STATUS
========================================= */

setInterval(

    () => {

        if(returnMode){

            updateUI();
        }

    },

    500

);


/* =========================================
   START
========================================= */

updateUI();


/* =========================================
   OFFLINE
========================================= */

if(
    "serviceWorker"
    in navigator
){

    window.addEventListener(

        "load",

        () => {

            navigator
