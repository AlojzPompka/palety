<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f2f2f2;
  padding:20px;
}
.card{
  max-width:480px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
}
h2{ text-align:center; }
input,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  font-size:16px;
}
button{
  background:#0d6efd;
  color:#fff;
  border:none;
  border-radius:6px;
}

.info, .instrukcja{
  margin-top:15px;
  font-size:15px;
}

.trailer{
  margin-top:15px;
  border:3px solid #333;
  border-radius:8px;
  padding:6px;
}
.row{
  display:flex;
  margin-bottom:4px;
}
.cell{
  flex:1;
  height:22px;
  margin:2px;
  border-radius:4px;
}
.W{background:#4a90e2;}
.WEP{background:#f5a623;}
.EP2{background:#2ecc71;}
.EP3{background:#1e8449;}
.free{background:#ccc;}

.legend span{
  display:inline-block;
  padding:4px 8px;
  margin:3px;
  border-radius:4px;
  font-size:12px;
}
</style>
</head>

<body>
<div class="card">

<h2>Kalkulator załadunku W + EP</h2>

<label>Palety W</label>
<input id="w" type="number" min="0" value="0">

<label>Palety EP</label>
<input id="ep" type="number" min="0" value="0">

<button onclick="calc()">Oblicz</button>

<div class="info" id="info"></div>
<div class="instrukcja" id="instrukcja"></div>
<div class="trailer" id="draw"></div>

<div class="legend">
  <span class="W">W</span>
  <span class="WEP">W + EP</span>
  <span class="EP2">EP (2)</span>
  <span class="EP3">EP (3)</span>
  <span class="free">Wolne</span>
</div>

</div>

<script>
const MAX = 13.4;

/* -------- LOGIKA EP --------
   Minimalna liczba dwójek tak,
   aby reszta była podzielna przez 3
-------------------------------- */
function buildEP(epCount){
  let ep2 = 0;
  let ep3 = 0;

  for(let k=0; k*2 <= epCount; k++){
    if((epCount - 2*k) % 3 === 0){
      ep2 = k;
      ep3 = (epCount - 2*k) / 3;
      break;
    }
  }

  let rows = [];
  for(let i=0;i<ep2;i++) rows.push({t:"EP2", len:0.8});
  for(let i=0;i<ep3;i++) rows.push({t:"EP3", len:1.2});
  return rows;
}

function calc(){
  let W = +document.getElementById("w").value;
  let EP = +document.getElementById("ep").value;

  let rows = [];
  let instrukcja = [];
  let used = 0;

  // --- W ---
  let wRows = Math.floor(W / 2);
  for(let i=0;i<wRows;i++){
    rows.push({t:"W", len:1.0});
    instrukcja.push("Załaduj rząd W (2 palety)");
    used += 1.0;
  }
  W %= 2;

  // --- W + EP ---
  if(W === 1 && EP >= 1){
    rows.push({t:"WEP", len:1.0});
    instrukcja.push("Załaduj rząd mieszany W + EP");
    used += 1.0;
    EP -= 1;
  }

  // --- EP ---
  let epRows = buildEP(EP);
  epRows.forEach(r=>{
    rows.push(r);
    instrukcja.push(
      r.t === "EP2"
      ? "Załaduj rząd EP (2 palety)"
      : "Załaduj rząd EP (3 palety)"
    );
    used += r.len;
  });

  let free = +(MAX - used).toFixed(2);

  // --- Co można doładować ---
  let addW = Math.floor(free / 1.0) * 2;
  let addEP2 = Math.floor(free / 0.8) * 2;
  let addEP3 = Math.floor(free / 1.2) * 3;

  document.getElementById("info").innerHTML = `
    <b>Zajęte:</b> ${used.toFixed(2)} m<br>
    <b>Wolne:</b> ${free} m<br><br>
    <b>Można jeszcze doładować:</b><br>
    • ${addW} palet W<br>
    • ${addEP2} palet EP (rząd 2)<br>
    • ${addEP3} palet EP (rząd 3)
  `;

  document.getElementById("instrukcja").innerHTML =
    "<b>Instrukcja załadunku:</b><ol>" +
    instrukcja.map(i=>`<li>${i}</li>`).join("") +
    "</ol>";

  // --- RYSUNEK ---
  let html = "";
  rows.forEach(r=>{
    html += `<div class="row">`;
    if(r.t==="W"){
      html += `<div class="cell W"></div><div class="cell W"></div>`;
    }
    if(r.t==="WEP"){
      html += `<div class="cell W"></div><div class="cell WEP"></div>`;
    }
    if(r.t==="EP2"){
      html += `<div class="cell EP2"></div><div class="cell EP2"></div>`;
    }
    if(r.t==="EP3"){
      html += `<div class="cell EP3"></div><div class="cell EP3"></div><div class="cell EP3"></div>`;
    }
    html += `</div>`;
  });

  let freeRows = Math.floor(free / 1.0);
  for(let i=0;i<freeRows;i++){
    html += `<div class="row"><div class="cell free"></div><div class="cell free"></div></div>`;
  }

  document.getElementById("draw").innerHTML = html;
}
</script>

</body>
</html>
