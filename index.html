<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator palet W + EP</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background:#f2f2f2;
  padding:20px;
}

h1 { text-align:center; }

input, button {
  width:100%;
  padding:12px;
  margin:8px 0;
  font-size:16px;
}

button {
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:8px;
}

#wynik {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

.plan {
  background:#1e1e1e;
  padding:10px;
  border-radius:10px;
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:6px;
}

.palet {
  height:40px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  color:#fff;
  font-size:14px;
}

.w { background:#5fa8dc; }
.ep3 { background:#57b26b; grid-column:span 2; }
.ep2 { background:#e3a33f; }
.empty { background:#555; }

hr { margin:15px 0; }
</style>
</head>

<body>

<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W:</label>
<input id="w" type="number" value="0">

<label>Palety EP:</label>
<input id="ep" type="number" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<script>
function oblicz() {
  const DLUGOSC = 13.4;
  const dW = 0.95;
  const dEP3 = 1.2;
  const dEP2 = 0.8;

  let w = +document.getElementById("w").value;
  let ep = +document.getElementById("ep").value;

  let wynik = "";
  let plan = [];
  let zajete = 0;

  // ===== W =====
  let rzedowW = Math.ceil(w / 2);
  zajete += rzedowW * dW;

  for (let i=0;i<rzedowW*2;i++) {
    if (i < w) plan.push("w");
  }

  // ===== EP =====
  let rzedowEP3 = Math.floor(ep / 3);
  let resztaEP = ep % 3;

  zajete += rzedowEP3 * dEP3;
  if (resztaEP >= 2) zajete += dEP2;

  let roznica = +(DLUGOSC - zajete).toFixed(2);

  wynik += `<strong>Zajęta długość:</strong> ${zajete.toFixed(2)} m<br>`;
  wynik += `<strong>Wolne miejsce:</strong> ${Math.max(0,roznica).toFixed(2)} m<br>`;

  // ❌ ZA DUŻO PALET
  if (roznica < 0) {
    wynik += `<strong style="color:red">ZA DUŻO PALET – usuń ${Math.abs(roznica).toFixed(2)} m</strong>`;
    document.getElementById("wynik").innerHTML = wynik;
    return;
  }

  // ===== RYSUNEK =====
  wynik += `<hr><strong>Instrukcja załadunku:</strong><br>`;

  let krok = 1;
  if (rzedowW)
    wynik += `${krok++}. Załaduj ${rzedowW} rzędów W (2 palety)<br>`;
  if (rzedowEP3)
    wynik += `${krok++}. Załaduj ${rzedowEP3} rzędy EP po 3 palety (1,2 m)<br>`;
  if (resztaEP >= 2)
    wynik += `${krok++}. Załaduj 2 palety EP po szerokości (0,8 m)<br>`;

  // ===== RYSUNEK =====
  wynik += `<div class="plan">`;

  for (let i=0;i<rzedowW*2;i++)
    wynik += `<div class="palet w">W</div>`;

  for (let i=0;i<rzedowEP3;i++)
    wynik += `<div class="palet ep3">EP EP EP</div>`;

  if (resztaEP >= 2) {
    wynik += `<div class="palet ep2">EP</div>`;
    wynik += `<div class="palet ep2">EP</div>`;
  }

  let wolneRzedy = Math.round(roznica / dW);
  for (let i=0;i<wolneRzedy*2;i++)
    wynik += `<div class="palet empty"></div>`;

  wynik += `</div>`;

  document.getElementById("wynik").innerHTML = wynik;
}
</script>

</body>
</html>
