<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Grzyby – powrót do auta</title>

<style>

:root{

  --bg:#0b0f0c; --panel:rgba(10,14,11,.90); --text:#fff; --muted:#aeb7b0;

  --green:#31d158; --orange:#ff9f0a; --red:#ff453a; --blue:#0a84ff;

}

*{box-sizing:border-box}

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}

#scene{position:fixed;inset:0;background:

 radial-gradient(circle at center,rgba(255,255,255,.06) 0 1px,transparent 1.5px) 0 0/28px 28px,

 linear-gradient(#111813,#0b0f0c)}

canvas{position:absolute;inset:0;width:100%;height:100%}

#top{

  position:fixed;z-index:5;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;

  background:var(--panel);border-radius:18px;padding:12px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)

}

#status{font-size:13px;color:var(--muted);text-align:center}

#distance{font-size:32px;font-weight:800;text-align:center;margin-top:3px}

#hint{font-size:13px;color:var(--muted);text-align:center;margin-top:4px}

#bottom{

  position:fixed;z-index:5;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));

  background:var(--panel);border-radius:18px;padding:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)

}

.row{display:flex;gap:8px}

button{

  flex:1;border:0;border-radius:14px;padding:15px 8px;font-size:16px;font-weight:800

}

#park{background:var(--green);color:#001a07}

#back{background:var(--orange);color:#1d0d00}

#reset{background:var(--red);color:white}

#compassArrow{

  position:fixed;z-index:4;left:50%;top:50%;width:86px;height:86px;margin:-43px 0 0 -43px;

  display:none;align-items:center;justify-content:center;font-size:72px;line-height:1;

  transform-origin:50% 50%;filter:drop-shadow(0 3px 10px rgba(0,0,0,.7))

}

#north{

  position:fixed;z-index:4;left:50%;top:calc(50% - 122px);transform:translateX(-50%);

  font-size:12px;color:var(--muted);display:none

}

.badge{

  display:inline-block;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.08);margin-left:5px

}

</style>

</head>

<body>

<div id="scene"><canvas id="radar"></canvas></div>

<div id="top">

  <div id="status">Czekam na GPS…</div>

  <div id="distance">—</div>

  <div id="hint">Działa bez internetu po otwarciu strony. GPS i kompas nie wymagają sieci.</div>

</div>

<div id="north">PRZÓD TELEFONU</div>

<div id="compassArrow">↑</div>

<div id="bottom">

  <div class="row">

    <button id="park">🚗 ZAPARKOWAŁEM</button>

    <button id="back">↩️ WRÓĆ</button>

    <button id="reset">RESET</button>

  </div>

</div>

<script>

"use strict";

const $ = id => document.getElementById(id);

const canvas = $("radar");

const ctx = canvas.getContext("2d");

let current = null;

let car = JSON.parse(localStorage.getItem("carPosition") || "null");

let returnMode = false;

let phoneHeading = null;

let orientationStarted = false;

function resizeCanvas(){

  const dpr = Math.max(1, window.devicePixelRatio || 1);

  canvas.width = innerWidth * dpr;

  canvas.height = innerHeight * dpr;

  canvas.style.width = innerWidth + "px";

  canvas.style.height = innerHeight + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

  drawRadar();

}

addEventListener("resize", resizeCanvas);

resizeCanvas();

if(car) $("park").style.display = "none";

function distanceM(lat1, lon1, lat2, lon2){

  const R = 6371000;

  const p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;

  const dp = (lat2-lat1)*Math.PI/180, dl = (lon2-lon1)*Math.PI/180;

  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

}

function bearingDeg(lat1, lon1, lat2, lon2){

  const p1 = lat1*Math.PI/180, p2 = lat2*Math.PI/180;

  const dl = (lon2-lon1)*Math.PI/180;

  const y = Math.sin(dl)*Math.cos(p2);

  const x = Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);

  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;

}

function normalizeSigned(a){

  a = ((a + 180) % 360 + 360) % 360 - 180;

  return a;

}

function updateUI(){

  if(!current){

    $("status").textContent = "Czekam na GPS…";

    return;

  }

  $("status").innerHTML =

    `GPS ±${Math.round(current.accuracy)} m` +

    (phoneHeading!==null

      ? ` <span class="badge">kompas OK</span>`

      : ` <span class="badge">kompas —</span>`);

  if(car && returnMode){

    const d = distanceM(current.lat,current.lng,car.lat,car.lng);

    $("distance").textContent =

      d >= 1000

        ? `🚗 ${(d/1000).toFixed(2)} km`

        : `🚗 ${Math.round(d)} m`;

    $("hint").textContent =

      "Strzałka pokazuje auto względem kierunku telefonu.";

  } else if(car){

    $("distance").textContent = "🚗 AUTO ZAPISANE";

    $("hint").textContent =

      "Możesz wygasić ekran. Gdy wracasz, otwórz stronę i naciśnij WRÓĆ.";

  } else {

    $("distance").textContent = "—";

    $("hint").textContent =

      "Przy samochodzie naciśnij ZAPARKOWAŁEM.";

  }

  updateArrow();

  drawRadar();

}

function updateArrow(){

  if(!returnMode || !car || !current || phoneHeading===null){

    $("compassArrow").style.display =

      returnMode ? "flex" : "none";

    $("north").style.display =

      returnMode ? "block" : "none";

    if(returnMode && phoneHeading===null){

      $("compassArrow").style.transform =

        "rotate(0deg)";

      $("hint").textContent =

        "Czekam na kompas iPhone'a…";

    }

    return;

  }

  const target =

    bearingDeg(

      current.lat,

      current.lng,

      car.lat,

      car.lng

    );

  const relative =

    normalizeSigned(

      target - phoneHeading

    );

  $("compassArrow").style.display = "flex";

  $("north").style.display = "block";

  $("compassArrow").style.transform =

    `rotate(${relative}deg)`;

}

function drawRadar(){

  const w = innerWidth;

  const h = innerHeight;

  ctx.clearRect(0,0,w,h);

  const cx = w/2;

  const cy = h/2;

  const maxR = Math.min(w,h)*0.36;

  ctx.save();

  ctx.strokeStyle =

    "rgba(255,255,255,.14)";

  ctx.lineWidth = 1;

  [0.33,0.66,1].forEach(k=>{

    ctx.beginPath();

    ctx.arc(

      cx,

      cy,

      maxR*k,

      0,

      Math.PI*2

    );

    ctx.stroke();

  });

  ctx.beginPath();

  ctx.moveTo(cx-maxR,cy);

  ctx.lineTo(cx+maxR,cy);

  ctx.moveTo(cx,cy-maxR);

  ctx.lineTo(cx,cy+maxR);

  ctx.stroke();

  ctx.fillStyle = "#0a84ff";

  ctx.beginPath();

  ctx.arc(cx,cy,8,0,Math.PI*2);

  ctx.fill();

  ctx.strokeStyle = "#fff";

  ctx.lineWidth = 3;

  ctx.stroke();

  if(returnMode && current && car){

    const b =

      bearingDeg(

        current.lat,

        current.lng,

        car.lat,

        car.lng

      );

    const rel =

      phoneHeading===null

        ? b

        : normalizeSigned(

            b-phoneHeading

          );

    const ang =

      (rel-90) *

      Math.PI/180;

    const edgeR =

      maxR*0.88;

    const ex =

      cx +

      Math.cos(ang)*edgeR;

    const ey =

      cy +

      Math.sin(ang)*edgeR;

    ctx.strokeStyle = "#ff453a";

    ctx.lineWidth = 5;

    ctx.setLineDash([12,8]);

    ctx.beginPath();

    ctx.moveTo(cx,cy);

    ctx.lineTo(ex,ey);

    ctx.stroke();

    ctx.setLineDash([]);

    ctx.fillStyle = "#ff9f0a";

    ctx.beginPath();

    ctx.arc(ex,ey,12,0,Math.PI*2);

    ctx.fill();

    ctx.fillStyle = "#fff";

    ctx.font =

      "700 14px -apple-system";

    ctx.textAlign = "center";

    ctx.fillText(

      "AUTO",

      ex,

      ey-18

    );

  }

  ctx.restore();

}

function gpsUpdate(pos){

  current = {

    lat:pos.coords.latitude,

    lng:pos.coords.longitude,

    accuracy:pos.coords.accuracy

  };

  updateUI();

}

function gpsError(err){

  $("status").textContent =

    "Błąd GPS: " +

    err.message;

}

if("geolocation" in navigator){

  navigator.geolocation.watchPosition(

    gpsUpdate,

    gpsError,

    {

      enableHighAccuracy:true,

      maximumAge:0,

      timeout:15000

    }

  );

}else{

  $("status").textContent =

    "Brak obsługi GPS.";

}

function compassUpdate(e){

  let heading = null;

  if(

    typeof e.webkitCompassHeading

    === "number"

  ){

    heading =

      e.webkitCompassHeading;

  }else if(

    typeof e.alpha

    === "number"

  ){

    heading =

      360 - e.alpha;

  }

  if(heading===null)

    return;

  phoneHeading =

    (heading+360)%360;

  updateUI();

}

async function startCompass(){

  if(orientationStarted)

    return;

  orientationStarted = true;

  try{

    if(

      typeof DeviceOrientationEvent

      !== "undefined"

      &&

      typeof

      DeviceOrientationEvent.requestPermission

      === "function"

    ){

      const p =

        await

        DeviceOrientationEvent

        .requestPermission();

      if(p !== "granted"){

        orientationStarted = false;

        $("hint").textContent =

          "Brak zgody na kompas. Włącz dostęp do ruchu i orientacji.";

        return;

      }

    }

    window.addEventListener(

      "deviceorientation",

      compassUpdate,

      true

    );

  }catch(e){

    orientationStarted = false;

    $("hint").textContent =

      "Nie udało się uruchomić kompasu.";

  }

}

$("park").addEventListener(

  "click",

  ()=>{

    if(!current){

      alert(

        "Poczekaj, aż GPS złapie pozycję."

      );

      return;

    }

    car = {

      lat:current.lat,

      lng:current.lng

    };

    localStorage.setItem(

      "carPosition",

      JSON.stringify(car)

    );

    returnMode = false;

    $("park").style.display =

      "none";

    $("compassArrow").style.display =

      "none";

    $("north").style.display =

      "none";

    updateUI();

  }

);

$("back").addEventListener(

  "click",

  async ()=>{

    if(!car){

      alert(

        "Najpierw naciśnij ZAPARKOWAŁEM."

      );

      return;

    }

    if(!current){

      alert(

        "Czekam na GPS."

      );

      return;

    }

    await startCompass();

    returnMode = true;

    updateUI();

  }

);

$("reset").addEventListener(

  "click",

  ()=>{

    if(

      !confirm(

        "Usunąć zapisane miejsce auta?"

      )

    ){

      return;

    }

    localStorage.removeItem(

      "carPosition"

    );

    car = null;

    returnMode = false;

    $("park").style.display = "";

    $("compassArrow").style.display =

      "none";

    $("north").style.display =

      "none";

    updateUI();

  }

);

updateUI();

</script>

</body>

</html>
