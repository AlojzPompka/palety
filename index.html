<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator załadunku naczepy</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    text-align: center;
}

.container {
    width: 700px;
    margin: 50px auto;
    padding: 20px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    display: block;
    margin: 10px auto;
    padding: 8px;
    width: 50%;
}

button {
    padding: 10px 20px;
    background: #2c7be5;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #1a5fc1;
}

/* Wizualizacja naczepy */
#truck {
    position: relative;
    margin: 20px auto;
    width: 680px; /* 1360 cm / 2 */
    height: 125px; /* 250 cm / 2 */
    background: #ddd;
    border: 2px solid #999;
}

.pallet {
    position: absolute;
    border: 1px solid #444;
    box-sizing: border-box;
    text-align: center;
    font-size: 10px;
    color: white;
    line-height: 1;
}

.pallet.euro { background: #2c7be5; }
.pallet.w120 { background: #e52c2c; }
</style>
</head>
<body>
<div class="container">
    <h1>Kalkulator załadunku naczepy</h1>

    <label>Ilość palet EURO:</label>
    <input type="number" id="euro" placeholder="np. 19">

    <label>Ilość palet W 120x100:</label>
    <input type="number" id="w120" placeholder="np. 20">

    <button onclick="calculate()">Oblicz</button>

    <h2>Wynik:</h2>
    <div id="result"></div>

    <h2>Wizualizacja naczepy:</h2>
    <div id="truck"></div>
</div>

<script>
function calculate() {
    const euroCount = parseInt(document.getElementById("euro").value) || 0;
    const wCount = parseInt(document.getElementById("w120").value) || 0;

    const truckLength = 1360; // cm
    const truckWidth = 250;   // cm

    // --- EURO ---
    let euroRemaining = euroCount;
    let euroUnits = 0; // jedynki w osi
    let euroRows3 = 0;
    let euroRows2 = 0;

    // maks 17 jedynek
    let maxOnAxis = Math.min(17, euroRemaining);
    euroUnits = maxOnAxis;
    euroRemaining -= euroUnits;

    // dopasowanie rzędów od tyłu
    while (euroRemaining > 0) {
        if (euroRemaining >= 3) {
            euroRows3++;
            euroRemaining -=3;
            // jeśli rząd 3 nie mieści się w długości, zmniejszamy jedynki
            while ((euroUnits*80 + euroRows3*120) > truckLength) {
                euroUnits--;
            }
        } else if (euroRemaining == 2) {
            euroRows2++;
            euroRemaining -=2;
            while ((euroUnits*80 + euroRows2*80 + euroRows3*120) > truckLength) {
                euroUnits--;
            }
        } else {
            // zostanie 1 → zamieniamy jedynkę na rząd 2
            if (euroUnits>0) {
                euroUnits--;
                euroRows2++;
                euroRemaining = 0;
            }
        }
    }

    // --- W 120x100 ---
    let wRemaining = wCount;
    let wUnits = Math.min(13, wRemaining);
    wRemaining -= wUnits;
    let wPairs = 0;
    while (wRemaining >0) {
        wPairs++;
        wRemaining -=2;
        while ((wUnits*100 + wPairs*100) > truckLength) {
            wUnits--;
        }
    }

    // --- Wyświetlenie wyników ---
    document.getElementById("result").innerHTML =
        `EURO: ${euroUnits} jedynki, ${euroRows3} rzędy 3, ${euroRows2} rzędy 2<br>`+
        `W 120x100: ${wUnits} jedynki, ${wPairs} pary`;

    drawTruck(euroUnits, euroRows3, euroRows2, wUnits, wPairs);
}

// --- Wizualizacja ---
function drawTruck(euroUnits, euroRows3, euroRows2, wUnits, wPairs) {
    const truck = document.getElementById("truck");
    truck.innerHTML = ""; // czyszczenie

    const scale = 0.5; // cm -> px
    const truckLengthPx = 1360 * scale;
    const truckWidthPx = 250 * scale;

    let x = 0;

    // --- EURO jedynki w osi ---
    const euroY = (truckWidthPx - 80*scale)/2; // wyśrodkowane w osi
    for(let i=0;i<euroUnits;i++){
        const div = document.createElement("div");
        div.className="pallet euro";
        div.style.width = 120*scale + "px";
        div.style.height = 80*scale + "px";
        div.style.left = x*scale + "px";
        div.style.top = euroY + "px";
        div.innerText="E";
        truck.appendChild(div);
        x+=80;
    }

    // --- EURO rzędy 3 ---
    for(let i=0;i<euroRows3;i++){
        for(let j=0;j<3;j++){
            const div = document.createElement("div");
            div.className="pallet euro";
            div.style.width = 120*scale/3 + "px";
            div.style.height = 80*scale + "px";
            div.style.left = x*scale + j*120*scale/3 + "px";
            div.style.top = "10px";
            div.innerText="E";
            truck.appendChild(div);
        }
        x+=120;
    }

    // --- EURO rzędy 2 ---
    for(let i=0;i<euroRows2;i++){
        for(let j=0;j<2;j++){
            const div = document.createElement("div");
            div.className="pallet euro";
            div.style.width = 120*scale/2 + "px";
            div.style.height = 80*scale + "px";
            div.style.left = x*scale + j*120*scale/2 + "px";
            div.style.top = "10px";
            div.innerText="E";
            truck.appendChild(div);
        }
        x+=80;
    }

    // --- W 120x100 jedynki ---
    const wY = (truckWidthPx - 100*scale)/2 + 20; // przesunięcie w pionie
    for(let i=0;i<wUnits;i++){
        const div = document.createElement("div");
        div.className="pallet w120";
        div.style.width = 120*scale + "px";
        div.style.height = 100*scale + "px";
        div.style.left = x*scale + "px";
        div.style.top = wY + "px";
        div.innerText="W";
        truck.appendChild(div);
        x+=100;
    }

    // --- W pary ---
    for(let i=0;i<wPairs;i++){
        for(let j=0;j<2;j++){
            const div = document.createElement("div");
            div.className="pallet w120";
            div.style.width = 120*scale/2 + "px";
            div.style.height = 100*scale + "px";
            div.style.left = x*scale + j*120*scale/2 + "px";
            div.style.top = wY + "px";
            div.innerText="W";
            truck.appendChild(div);
        }
        x+=100;
    }
}
</script>
</body>
</html>
