<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kalkulator załadunku W + EP</title>
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}
.container {
  max-width: 420px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 12px;
}
h1 {
  text-align: center;
}
input {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  background: #007aff;
  color: #fff;
  border: none;
  border-radius: 10px;
}
.result {
  margin-top: 20px;
  background: #fafafa;
  padding: 15px;
  border-radius: 10px;
}
hr { margin: 12px 0; }
</style>
</head>

<body>
<div class="container">
<h1>Kalkulator załadunku<br>W + EP</h1>

<label>Palety W</label>
<input type="number" id="w" min="0" value="0">

<label>Palety EP</label>
<input type="number" id="ep" min="0" value="0">

<button onclick="licz()">Oblicz</button>

<div class="result" id="wynik"></div>
</div>

<script>
function licz() {
  const MAX = 13.4;
  let W = parseInt(document.getElementById("w").value) || 0;
  let EP = parseInt(document.getElementById("ep").value) || 0;

  let metry = 0;
  let opis = [];

  // --- W ---
  let rzedowW = Math.floor(W / 2);
  metry += rzedowW * 1.0;
  opis.push(`Rzędy W: ${rzedowW} × 1,0 m = ${(rzedowW*1).toFixed(2)} m`);
  W -= rzedowW * 2;

  // --- mieszany W + EP ---
  let rzedMix = 0;
  if (W === 1 && EP >= 1) {
    rzedMix = 1;
    metry += 1.0;
    W = 0;
    EP -= 1;
    opis.push(`Rząd W + EP: 1 × 1,0 m`);
  }

  // --- EP(3) ---
  let rzedowEP3 = Math.floor(EP / 3);
  metry += rzedowEP3 * 1.2;
  opis.push(`Rzędy EP(3): ${rzedowEP3} × 1,2 m = ${(rzedowEP3*1.2).toFixed(2)} m`);
  EP -= rzedowEP3 * 3;

  // --- EP(2) ---
  let rzedowEP2 = Math.floor(EP / 2);
  metry += rzedowEP2 * 0.8;
  opis.push(`Rzędy EP(2): ${rzedowEP2} × 0,8 m = ${(rzedowEP2*0.8).toFixed(2)} m`);
  EP -= rzedowEP2 * 2;

  let decyzjaEP = "";

  // --- została 1 EP ---
  if (EP === 1) {
    let opcjaDodaj = metry + 1.2 <= MAX;
    let opcjaUsun = true;

    if (opcjaDodaj) {
      decyzjaEP = "Została 1 EP → doważyć 2 EP (rząd EP(3), 1,2 m)";
      metry += 1.2;
      opis.push("Doważono EP: +1 rząd EP(3) = 1,2 m");
    } else {
      decyzjaEP = "Została 1 EP → usunięta (brak miejsca)";
      opis.push("Usunięto 1 EP");
    }
  }

  let wolne = MAX - metry;

  let moznaW = Math.floor(wolne / 1.0) * 2;
  let moznaEP3 = Math.floor(wolne / 1.2) * 3;
  let moznaEP2 = Math.floor(wolne / 0.8) * 2;

  document.getElementById("wynik").innerHTML = `
    <b>Zajęta długość:</b> ${metry.toFixed(2)} m<br>
    <b>Wolna długość:</b> ${wolne.toFixed(2)} m
    <hr>
    <b>Rozpiska:</b>
    <ul>${opis.map(o => `<li>${o}</li>`).join("")}</ul>
    ${decyzjaEP ? "<hr><b>" + decyzjaEP + "</b>" : ""}
    <hr>
    <b>Można jeszcze dołożyć:</b><br>
    • ${moznaW} palet W<br>
    • ${moznaEP3} palet EP (rząd 3)<br>
    • ${moznaEP2} palet EP (rząd 2)
  `;
}
</script>
</body>
</html>
