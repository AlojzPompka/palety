<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f2f2f2;
  padding: 20px;
}
.container {
  max-width: 420px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 14px;
}
h1 {
  text-align: center;
}
label {
  font-weight: 600;
}
input {
  width: 100%;
  padding: 12px;
  margin: 8px 0 16px;
  font-size: 18px;
}
button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #007aff;
  color: #fff;
  border: none;
  border-radius: 12px;
}
.result {
  margin-top: 20px;
  background: #f9f9f9;
  padding: 15px;
  border-radius: 12px;
}
hr {
  margin: 15px 0;
}
</style>
</head>

<body>
<div class="container">
  <h1>Kalkulator załadunku<br>W + EP</h1>

  <label>Palety W</label>
  <input id="w" type="number" min="0" value="0">

  <label>Palety EP</label>
  <input id="ep" type="number" min="0" value="0">

  <button onclick="oblicz()">Oblicz</button>

  <div id="wynik" class="result"></div>
</div>

<script>
function oblicz() {
  const DLUGOSC = 13.4;

  let W = Number(document.getElementById("w").value);
  let EP = Number(document.getElementById("ep").value);

  /* ===== W ===== */
  const rzedowW = Math.floor(W / 2);
  const metryW = rzedowW * 1.0;

  /* ===== EP ===== */
  let epTmp = EP;

  const rzedowEP3 = Math.floor(epTmp / 3);
  epTmp %= 3;

  const rzedowEP2 = Math.floor(epTmp / 2);

  const metryEP =
    rzedowEP3 * 1.2 +
    rzedowEP2 * 0.8;

  const zajete = metryW + metryEP;
  const wolne = DLUGOSC - zajete;

  /* ===== CO MOŻNA DOŁOŻYĆ (OSOBNO) ===== */
  const moznaW = Math.floor(wolne / 1.0) * 2;
  const moznaEP3 = Math.floor(wolne / 1.2) * 3;
  const moznaEP2 = Math.floor(wolne / 0.8) * 2;

  document.getElementById("wynik").innerHTML = `
    <b>Zajęta długość:</b> ${zajete.toFixed(2)} m<br>
    <b>Wolna długość:</b> ${wolne.toFixed(2)} m
    <hr>
    <b>Rozpiska:</b>
    <ul>
      <li>Rzędy W: ${rzedowW} × 1,0 m = ${(metryW).toFixed(2)} m</li>
      <li>Rzędy EP (3): ${rzedowEP3} × 1,2 m = ${(rzedowEP3 * 1.2).toFixed(2)} m</li>
      <li>Rzędy EP (2): ${rzedowEP2} × 0,8 m = ${(rzedowEP2 * 0.8).toFixed(2)} m</li>
    </ul>
    <hr>
    <b>Można jeszcze dołożyć:</b>
    <ul>
      <li>${moznaW} palet W</li>
      <li>${moznaEP3} palet EP (w trójkach)</li>
      <li>${moznaEP2} palet EP (w dwójkach)</li>
    </ul>
  `;
}
</script>
</body>
</html>
