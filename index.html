<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator palet</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #f5f5f5;
}
h1 { margin-bottom: 20px; }
input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  margin-bottom: 15px;
}
button {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #0a74ff;
  color: white;
  border: none;
  border-radius: 6px;
}
#wynik {
  background: white;
  padding: 15px;
  margin-top: 20px;
  border-radius: 8px;
}
ol { margin-top: 10px; }
</style>
</head>

<body>

<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W:</label>
<input id="w" type="number" value="0">

<label>Palety EP:</label>
<input id="ep" type="number" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<script>
function oblicz() {

  const DLUGOSC = 13.4;
  const dlW = 0.95;
  const dlEP3 = 1.2;
  const dlEP2 = 0.8;

  let w = +document.getElementById("w").value;
  let ep = +document.getElementById("ep").value;

  let zajete = 0;
  let instrukcja = [];

  // --- PALETY W ---
  const pelneW = Math.floor(w / 2);
  const resztaW = w % 2;

  if (pelneW > 0) {
    instrukcja.push(`Załaduj ${pelneW} rzędy palet W (2 palety w rzędzie)`);
    zajete += pelneW * dlW;
  }

  // --- DOPYCHANIE EP DO W ---
  if (resztaW === 1 && ep > 0) {
    instrukcja.push(`Dopychaj 1 paletę EP do rzędu W`);
    zajete += dlW;
    ep--;
  }

  // --- EP PO 3 ---
  let rzedowEP3 = Math.floor(ep / 3);
  let resztaEP = ep % 3;

  if (rzedowEP3 > 0) {
    instrukcja.push(`Załaduj ${rzedowEP3} rzędy EP po 3 palety (1,2 m)`);
    zajete += rzedowEP3 * dlEP3;
  }

  // --- EP PO 2 ---
  if (resztaEP > 0) {
    instrukcja.push(`Załaduj 2 palety EP po szerokości (0,8 m)`);
    zajete += dlEP2;
  }

  // --- PODSUMOWANIE ---
  const wolne = +(DLUGOSC - zajete).toFixed(2);

  let moznaEP = wolne > 0 ? Math.floor(wolne / dlEP3) * 3 : 0;
  let moznaW = wolne > 0 ? Math.floor(wolne / dlW) * 2 : 0;

  let html = `
    <b>Zajęta długość:</b> ${zajete.toFixed(2)} m<br>
    <b>Wolne miejsce:</b> ${wolne > 0 ? wolne : 0} m<br><br>
  `;

  if (wolne > 0) {
    html += `<b>Można jeszcze załadować:</b><ul>`;
    if (moznaEP > 0) html += `<li>${moznaEP} palet EP (trójkami)</li>`;
    if (moznaW > 0) html += `<li>${moznaW} palet W (dwójkami)</li>`;
    html += `</ul>`;
  } else {
    html += `<b>❌ Za dużo palet – usuń część ładunku</b>`;
  }

  html += `<hr><b>Instrukcja załadunku:</b><ol>`;
  instrukcja.forEach(i => html += `<li>${i}</li>`);
  html += `</ol>`;

  document.getElementById("wynik").innerHTML = html;
}
</script>

</body>
</html>
