<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:20px;
}

h1 {
  text-align:center;
}

label {
  font-weight:bold;
}

input {
  width:100%;
  padding:12px;
  margin:6px 0 16px;
  font-size:16px;
}

button {
  width:100%;
  padding:14px;
  font-size:18px;
  background:#1976f2;
  color:#fff;
  border:none;
  border-radius:8px;
}

#wynik {
  margin-top:20px;
  background:#fff;
  padding:15px;
  border-radius:10px;
}

.naczepa {
  margin-top:20px;
  background:#222;
  padding:10px;
  border-radius:12px;
}

.rzad {
  display:flex;
  gap:6px;
  margin-bottom:6px;
}

.paleta {
  height:34px;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  color:#fff;
  border-radius:6px;
}

.W { background:#4aa3df; }
.EP { background:#4caf50; }
.empty { background:#555; color:#aaa; }
</style>
</head>

<body>

<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W:</label>
<input id="w" type="number" min="0" value="0">

<label>Palety EP:</label>
<input id="ep" type="number" min="0" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>
<div id="rysunek"></div>

<script>
function oblicz() {

  const DLUGOSC = 13.4;
  const dW = 0.95;
  const dEP3 = 1.2;
  const dEP2 = 0.8;

  let w = Number(document.getElementById("w").value);
  let ep = Number(document.getElementById("ep").value);

  let zajete = 0;
  let rys = [];

  // ===== W =====
  let rzedowW = Math.ceil(w / 2);
  zajete += rzedowW * dW;

  for (let i = 0; i < Math.floor(w / 2); i++) {
    rys.push(["W","W"]);
  }
  if (w % 2 === 1) {
    rys.push(["W","W"]); // NIE rysujemy połówek
  }

  // ===== EP =====
  let rzedowEP3 = Math.floor(ep / 3);
  let resztaEP = ep % 3;

  zajete += rzedowEP3 * dEP3;

  for (let i = 0; i < rzedowEP3; i++) {
    rys.push(["EP","EP","EP"]);
  }

  let ep2 = 0;
  if (resztaEP >= 2) {
    zajete += dEP2;
    ep2 = 1;
    rys.push(["EP","EP"]);
  }

  let wolne = +(DLUGOSC - zajete).toFixed(2);

  // ===== WYNIK =====
  let html = `
  <b>Zajęta długość:</b> ${zajete.toFixed(2)} m<br>
  <b>Wolne miejsce:</b> ${wolne >= 0 ? wolne : 0} m<br>
  `;

  if (wolne < 0) {
    html += `<b style="color:red">ZA DUŻO PALET – usuń ${Math.abs(wolne).toFixed(2)} m</b>`;
  }

  document.getElementById("wynik").innerHTML = html;

  // ===== RYSUNEK =====
  let draw = `<div class="naczepa">`;

  rys.forEach(r => {
    draw += `<div class="rzad">`;
    r.forEach(p => {
      draw += `<div class="paleta ${p}">${p}</div>`;
    });
    draw += `</div>`;
  });

  // wolne miejsce
  if (wolne > 0) {
    let emptyRows = Math.floor(wolne / 0.95);
    for (let i = 0; i < emptyRows; i++) {
      draw += `
      <div class="rzad">
        <div class="paleta empty"></div>
        <div class="paleta empty"></div>
      </div>`;
    }
  }

  draw += `</div>`;
  document.getElementById("rysunek").innerHTML = draw;
}
</script>

</body>
</html>
