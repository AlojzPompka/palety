<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Palet – Naczepa 13,6 m</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 20px; background: #f8f9fa; }
        h1 { color: #c82333; text-align: center; }
        .opis { background: #fff3cd; padding: 16px; border-radius: 8px; margin-bottom: 25px; line-height: 1.6; }
        form { background: white; padding: 28px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); }
        label { font-weight: bold; display: block; margin: 18px 0 8px; font-size: 1.05em; }
        input { width: 100%; padding: 13px; font-size: 17px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; font-size: 18px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 22px; }
        button:hover { background: #218838; }
        #wynik { margin-top: 35px; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,0.08); line-height: 1.65; }
        .stat { margin: 8px 0; padding: 10px 14px; background: #f1f3f5; border-radius: 6px; border-left: 4px solid #007bff; }
        .alert { color: #dc3545; font-weight: bold; margin: 12px 0; }
        #schemat { border: 1px solid #adb5bd; background: #f8f9fa; margin-top: 25px; display: block; width: 100%; height: 800px; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Kalkulator Palet – Naczepa 13,6 m</h1>

    <div class="opis">
        <strong>Wpisz np.:</strong> 20s 3w<br>
        Program szuka układu, w którym wchodzą WSZYSTKIE palety (lub max ile się da).<br>
        Jedynki S tylko tyle, ile trzeba – żeby reszta była ładnie rozłożona (jak w Twoim przykładzie: 10 jedynek + W + mieszana + 3 trójki).
    </div>

    <form id="form">
        <label>Ilość palet (np. 20s 3w):</label>
        <input type="text" id="ilosc" placeholder="20s 3w" required autofocus>

        <button type="submit">Oblicz układ</button>
    </form>

    <div id="wynik"></div>

    <script>
        document.getElementById('form').addEventListener('submit', e => {
            e.preventDefault();

            const input = document.getElementById('ilosc').value.toLowerCase().replace(/i/g, '').replace(/\s+/g, ' ');
            const sMatch = input.match(/(\d+)\s*s/);
            const wMatch = input.match(/(\d+)\s*w/);
            let wantS = sMatch ? parseInt(sMatch[1]) : 0;
            let wantW = wMatch ? parseInt(wMatch[1]) : 0;

            const L = 13.6;
            const LEN_W_PAIR   = 1.0;
            const LEN_S_TRIO   = 1.2;
            const LEN_S_DUO    = 0.8;
            const LEN_S_SINGLE = 0.8;
            const LEN_MIX      = 0.8;

            let best = {
                totalLoaded: 0,
                occupied: 0,
                rows: [],
                stats: {single:0, wPair:0, mixed:0, duoS:0, trioS:0},
                leftoverS: wantS,
                leftoverW: wantW
            };

            // Szukamy kombinacji, w której wchodzą wszystkie palety (lub max)
            for (let singles = 0; singles <= 12; singles++) {  // do 12 jedynek – więcej to już bez sensu
                let occ = singles * LEN_S_SINGLE;
                let remL = L - occ;
                if (remL < 0) continue;

                let remS = wantS - singles;
                if (remS < 0) continue;

                let maxPairs = Math.floor(wantW / 2);
                let pairs = Math.min(maxPairs, Math.floor(remL / LEN_W_PAIR));
                occ += pairs * LEN_W_PAIR;
                remL = L - occ;

                let remW = wantW - pairs * 2;

                let mix = 0;
                if (remW === 1 && remS >= 1 && remL >= LEN_MIX) {
                    mix = 1;
                    occ += LEN_MIX;
                    remL = L - occ;
                    remS -= 1;
                    remW = 0;
                }

                let trio = Math.floor(remS / 3);
                let duo = Math.floor((remS - trio * 3) / 2);
                let lenS = trio * LEN_S_TRIO + duo * LEN_S_DUO;
                if (lenS > remL) {
                    // Jeśli nie wejdzie – zmniejszamy trójki/dwójki, aż wejdzie
                    for (let t = trio; t >= 0; t--) {
                        let r = remS - t * 3;
                        let d = Math.floor(r / 2);
                        let l = t * LEN_S_TRIO + d * LEN_S_DUO;
                        if (l <= remL) {
                            lenS = l;
                            trio = t;
                            duo = d;
                            break;
                        }
                    }
                }

                occ += lenS;

                let loaded = singles + pairs * 2 + mix * 2 + trio * 3 + duo * 2;
                if (loaded > best.totalLoaded) {
                    best = {
                        totalLoaded: loaded,
                        occupied: occ,
                        rows: [],
                        stats: {single: singles, wPair: pairs, mixed: mix, duoS: duo, trioS: trio},
                        leftoverS: wantS - (singles + mix + trio*3 + duo*2),
                        leftoverW: remW
                    };

                    if (singles > 0) best.rows.push({type: 'S-single', length: LEN_S_SINGLE, count: singles});
                    if (pairs > 0) best.rows.push({type: 'W-pair', length: LEN_W_PAIR, count: pairs});
                    if (mix > 0) best.rows.push({type: 'mixed', length: LEN_MIX, count: 1});
                    if (duo > 0) best.rows.push({type: 'S-duo', length: LEN_S_DUO, count: duo});
                    if (trio > 0) best.rows.push({type: 'S-trio', length: LEN_S_TRIO, count: trio});
                }
            }

            let fillPercent = Math.round((best.occupied / L) * 100);

            let html = `<h3>Załadowano: ${best.totalLoaded} palet (${best.stats.single + best.stats.mixed + best.stats.duoS*2 + best.stats.trioS*3} S + ${best.stats.wPair*2 + best.stats.mixed} W)</h3>`;
            html += `<p><strong>Zajęte:</strong> ${best.occupied.toFixed(2)} m &nbsp; <strong>Wolne:</strong> ${(L - best.occupied).toFixed(2)} m</p>`;
            html += `<p><strong>Zapełnienie:</strong> ${fillPercent}%</p>`;

            html += '<p><strong>Liczba układów (od przodu):</strong></p>';
            html += `<div class="stat">Jedynki S: ${best.stats.single}</div>`;
            html += `<div class="stat">Pary W: ${best.stats.wPair}</div>`;
            html += `<div class="stat">Mieszane dwójki: ${best.stats.mixed}</div>`;
            html += `<div class="stat">Dwójki S: ${best.stats.duoS}</div>`;
            html += `<div class="stat">Trójki S: ${best.stats.trioS}</div>`;

            html += '<p><strong>Układ od przodu do tyłu:</strong></p>';
            best.rows.forEach(r => {
                let txt = '';
                if (r.type === 'S-single') txt = `${r.count} × jedynka S`;
                else if (r.type === 'W-pair') txt = `${r.count} × para W`;
                else if (r.type === 'mixed') txt = `1 × mieszana (W+S)`;
                else if (r.type === 'S-duo') txt = `${r.count} × dwójka S`;
                else if (r.type === 'S-trio') txt = `${r.count} × trójka S`;
                html += `<div class="section">${txt} (${r.length} m / rząd)</div>`;
            });

            if (best.leftoverS > 0 || best.leftoverW > 0) {
                html += `<p class="alert">Nie załadowano: ${best.leftoverS} S + ${best.leftoverW} W</p>`;
            }

            html += '<h4>Schemat naczepy – każda paleta osobno</h4>';
            html += '<canvas id="schemat" width="400" height="800"></canvas>';
            html += '<p class="info">Niebieski = W • Pomarańcz = S jedynka • Żółty = S dwójka • Zielony = S trójka • Fiolet/turkus = mieszana • Szary = wolne</p>';

            document.getElementById('wynik').innerHTML = html;

            // Rysowanie
            const canvas = document.getElementById('schemat');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const scaleY = (canvas.height - 80) / L;
            const left = 80;
            const fullW = canvas.width - 160;
            let y = 40;

            ctx.fillStyle = '#e9ecef';
            ctx.fillRect(left, 40, fullW, canvas.height - 80);

            ctx.strokeStyle = '#dee2e6';
            ctx.lineWidth = 1;
            for (let m = 1; m < L; m++) {
                let yy = 40 + m * scaleY;
                ctx.beginPath();
                ctx.moveTo(left, yy);
                ctx.lineTo(left + fullW, yy);
                ctx.stroke();
            }

            best.rows.forEach(row => {
                const rowH = row.length * scaleY;

                if (row.type === 'S-single') {
                    const palW = fullW;
                    for (let i = 0; i < row.count; i++) {
                        drawPaleta(ctx, left, y + i * rowH, palW, rowH, '#fd7e14', 'S');
                    }
                    y += row.count * rowH;
                }
                else if (row.type === 'W-pair' || row.type === 'S-duo') {
                    const palW = fullW / 2;
                    const color = row.type === 'W-pair' ? '#007bff' : '#ffc107';
                    const lbl = row.type === 'W-pair' ? 'W' : 'S';
                    for (let i = 0; i < row.count; i++) {
                        drawPaleta(ctx, left,           y + i * rowH, palW, rowH, color, lbl);
                        drawPaleta(ctx, left + palW,    y + i * rowH, palW, rowH, color, lbl);
                    }
                    y += row.count * rowH;
                }
                else if (row.type === 'S-trio') {
                    const palW = fullW / 3;
                    for (let i = 0; i < row.count; i++) {
                        drawPaleta(ctx, left,             y + i * rowH, palW, rowH, '#28a745', 'S');
                        drawPaleta(ctx, left + palW,      y + i * rowH, palW, rowH, '#28a745', 'S');
                        drawPaleta(ctx, left + 2*palW,    y + i * rowH, palW, rowH, '#28a745', 'S');
                    }
                    y += row.count * rowH;
                }
                else if (row.type === 'mixed') {
                    const palW = fullW / 2;
                    drawPaleta(ctx, left,         y, palW, rowH, '#6f42c1', 'W');
                    drawPaleta(ctx, left + palW,  y, palW, rowH, '#20c997', 'S');
                    y += rowH;
                }
            });

            if (y < canvas.height - 40) {
                ctx.fillStyle = '#ced4da';
                ctx.fillRect(left, y, fullW, canvas.height - 40 - y);
                ctx.fillStyle = '#6c757d';
                ctx.font = '15px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('WOLNE MIEJSCE', canvas.width / 2, y + (canvas.height - 40 - y) / 2);
            }

            ctx.fillStyle = '#212529';
            ctx.font = 'bold 17px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('PRZÓD naczepy', canvas.width / 2, 25);
            ctx.fillText('TYŁ naczepy', canvas.width / 2, canvas.height - 15);
        });

        function drawPaleta(ctx, x, y, w, h, color, label) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#343a40';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);
            ctx.fillStyle = (color === '#007bff' || color === '#28a745' || color === '#6f42c1') ? '#ffffff' : '#212529';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + w / 2, y + h / 2);
        }
    </script>
</body>
</html>
