<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background:#f2f2f2;
  padding:20px;
}
.container {
  max-width: 750px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
}
input, button {
  width:100%;
  padding:12px;
  font-size:16px;
  margin-bottom:10px;
}
button {
  background:#007aff;
  color:white;
  border:none;
  border-radius:10px;
}
canvas {
  margin-top:20px;
  border:2px solid #333;
  background:#eee;
}
.legend span {
  display:inline-block;
  margin-right:15px;
}
.box {
  display:inline-block;
  width:16px;
  height:16px;
  margin-right:5px;
}
</style>
</head>

<body>
<div class="container">
<h2>Kalkulator załadunku W + EP</h2>

<label>Palety W</label>
<input id="w" type="number" min="0" value="0">

<label>Palety EP</label>
<input id="ep" type="number" min="0" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<canvas id="naczepa" width="700" height="120"></canvas>

<div class="legend">
  <span><span class="box" style="background:#4a90e2"></span>W</span>
  <span><span class="box" style="background:#f5a623"></span>EP (w W+EP)</span>
  <span><span class="box" style="background:#7ed321"></span>EP(3)</span>
  <span><span class="box" style="background:#417505"></span>EP(2)</span>
  <span><span class="box" style="background:#ccc"></span>Wolne</span>
</div>
</div>

<script>
function oblicz() {
  const DL = 13.4;
  const PX = 50;

  let W = +document.getElementById("w").value || 0;
  let EP = +document.getElementById("ep").value || 0;

  let rzedy = [];
  let zajete = 0;

  // W
  let rW = Math.floor(W / 2);
  for (let i = 0; i < rW; i++) {
    rzedy.push({ m: 1.0, typ: "W" });
    zajete += 1.0;
  }
  W -= rW * 2;

  // W + EP
  if (W === 1 && EP > 0) {
    rzedy.push({ m: 1.0, typ: "WEP" });
    zajete += 1.0;
    W = 0;
    EP -= 1;
  }

  // EP(3)
  let rEP3 = Math.floor(EP / 3);
  for (let i = 0; i < rEP3; i++) {
    rzedy.push({ m: 1.2, typ: "EP3" });
    zajete += 1.2;
  }
  EP -= rEP3 * 3;

  // EP(2)
  let rEP2 = Math.floor(EP / 2);
  for (let i = 0; i < rEP2; i++) {
    rzedy.push({ m: 0.8, typ: "EP2" });
    zajete += 0.8;
  }
  EP -= rEP2 * 2;

  // reszta EP
  let wolne = DL - zajete;
  if (EP === 1) {
    if (wolne >= 1.2) {
      rzedy.push({ m: 1.2, typ: "EP3" });
      zajete += 1.2;
    } else if (wolne >= 0.8) {
      rzedy.push({ m: 0.8, typ: "EP2" });
      zajete += 0.8;
    }
  }

  rysuj(rzedy, DL - zajete, PX);

  document.getElementById("wynik").innerHTML =
    `<b>Zajęte:</b> ${zajete.toFixed(2)} m<br>
     <b>Wolne:</b> ${(DL - zajete).toFixed(2)} m`;
}

function rysuj(rzedy, wolne, PX) {
  const c = document.getElementById("naczepa");
  const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);

  let x = 0;

  rzedy.forEach(r => {
    let w = r.m * PX;

    if (r.typ === "W") {
      drawRow(ctx, x, w, ["#4a90e2", "#4a90e2"]);
    }
    if (r.typ === "WEP") {
      drawRow(ctx, x, w, ["#4a90e2", "#f5a623"]);
    }
    if (r.typ === "EP3") {
      drawRow(ctx, x, w, ["#7ed321", "#7ed321", "#7ed321"]);
    }
    if (r.typ === "EP2") {
      drawRow(ctx, x, w, ["#417505", "#417505"]);
    }

    x += w;
  });

  if (wolne > 0) {
    ctx.fillStyle = "#ccc";
    ctx.fillRect(x, 20, wolne * PX, 80);
  }
}

function drawRow(ctx, x, width, colors) {
  const part = width / colors.length;
  colors.forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(x + i * part, 20, part - 2, 80);
  });
}
</script>
</body>
</html>
