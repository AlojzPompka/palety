<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f2f2f2;
  padding:20px;
}
.box {
  background:#fff;
  padding:20px;
  border-radius:14px;
  max-width:420px;
  margin:auto;
}
h1 { font-size:22px; margin-bottom:15px; }
label { font-weight:600; }
input {
  width:100%;
  padding:10px;
  margin:8px 0 15px;
  font-size:16px;
}
button {
  width:100%;
  padding:14px;
  font-size:18px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:10px;
}
.result {
  margin-top:20px;
  background:#fafafa;
  padding:15px;
  border-radius:10px;
}
hr { margin:15px 0; }
ul { padding-left:20px; }
</style>
</head>

<body>
<div class="box">
<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W</label>
<input type="number" id="w" value="0">

<label>Palety EP</label>
<input type="number" id="ep" value="0">

<button onclick="oblicz()">Oblicz</button>

<div class="result" id="wynik"></div>
</div>

<script>
function oblicz() {

  const NACZEPA = 13.4;      // ← ZMIANA TUTAJ
  const W_LEN = 1.0;
  const EP_LEN = 0.8;

  let w = Number(document.getElementById("w").value);
  let ep = Number(document.getElementById("ep").value);

  let instrukcja = [];
  let zajete = 0;

  // ===== JEDYNKI NA POCZĄTKU =====
  let jedynkiW = 0;
  let jedynkiEP = 0;

  if (w % 2 === 1) {
    jedynkiW = 1;
    w--;
    zajete += 2 * W_LEN;
    instrukcja.push("Jedynka W na środku (liczona jak 2W)");
  }

  if (ep % 3 === 1) {
    jedynkiEP = 1;
    ep--;
    zajete += EP_LEN;
    instrukcja.push("Jedynka EP na środku");
  }

  // ===== PEŁNE RZĘDY W =====
  let rzedowW = Math.floor(w / 2);
  if (rzedowW > 0) {
    zajete += rzedowW * W_LEN;
    instrukcja.push(`Załaduj ${rzedowW} rzędów W (po 2 palety)`);
  }

  // ===== PEŁNE RZĘDY EP =====
  let rzedowEP = Math.floor(ep / 3);
  if (rzedowEP > 0) {
    zajete += rzedowEP * EP_LEN;
    instrukcja.push(`Załaduj ${rzedowEP} rzędów EP (po 3 palety)`);
  }

  // ===== RESZTKI =====
  let resztaW = w % 2;
  let resztaEP = ep % 3;

  if (resztaW && resztaEP >= 1) {
    zajete += W_LEN;
    instrukcja.push("Mieszany rząd: 1W + 1EP");
    resztaW--;
    resztaEP--;
  }

  let wolne = +(NACZEPA - zajete).toFixed(2);

  let komunikat = `
    <b>Zajęta długość:</b> ${zajete.toFixed(2)} m<br>
    <b>Wolne miejsce:</b> ${wolne > 0 ? wolne : 0} m
  `;

  if (wolne < 0) {
    komunikat += `<br><b>ZA DUŻO PALET – usuń ${Math.abs(wolne).toFixed(2)} m</b>`;
  } else {
    let dodW = Math.floor(wolne / W_LEN);
    let dodEP = Math.floor(wolne / EP_LEN);
    komunikat += `<br><b>Można jeszcze doładować:</b> ${dodW} W lub ${dodEP} EP`;
  }

  komunikat += `<hr><b>Instrukcja ładowania:</b><ul>`;
  instrukcja.forEach(i => komunikat += `<li>${i}</li>`);
  komunikat += `</ul>`;

  document.getElementById("wynik").innerHTML = komunikat;
}
</script>
</body>
</html>
