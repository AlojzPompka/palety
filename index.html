<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator załadunku W + EP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,.1);
}
h1 {
  text-align: center;
}
label {
  font-weight: 600;
}
input[type="number"] {
  width: 100%;
  padding: 12px;
  margin: 6px 0 14px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #0a84ff;
  color: #fff;
  font-size: 18px;
  font-weight: bold;
}
.result {
  margin-top: 20px;
  padding: 16px;
  background: #fafafa;
  border-radius: 12px;
}
hr {
  margin: 14px 0;
}
.small {
  color: #555;
  font-size: 14px;
}
.checkbox {
  margin-bottom: 14px;
}
</style>
</head>

<body>
<div class="container">
<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W</label>
<input type="number" id="w" min="0" value="0">

<label>Palety EP</label>
<input type="number" id="ep" min="0" value="0">

<div class="checkbox">
  <label>
    <input type="checkbox" id="allowSingles">
    Zezwól na jedynki (rozciąganie ładunku)
  </label>
</div>

<button onclick="oblicz()">Oblicz</button>

<div class="result" id="wynik"></div>
</div>

<script>
function oblicz() {

  const DLUGOSC = 13.4;

  let W = +document.getElementById("w").value;
  let EP = +document.getElementById("ep").value;
  let allowSingles = document.getElementById("allowSingles").checked;

  let instrukcja = [];

  // --- W ---
  let rzedyW = Math.floor(W / 2);
  let resztaW = W % 2;
  let jedynkiW = 0;

  if (resztaW === 1 && allowSingles) {
    jedynkiW = 1;
    rzedyW++;
    instrukcja.push("Jedynka W na środku (liczona jako 1 rząd)");
  }

  // --- EP ---
  let rzedyEP3 = Math.floor(EP / 3);
  let resztaEP = EP % 3;
  let rzedyEP2 = 0;
  let jedynkiEP = 0;

  if (resztaEP === 2) {
    rzedyEP2 = 1;
  }

  if (resztaEP === 1) {
    if (allowSingles) {
      jedynkiEP = 1;
    } else if (rzedyEP3 > 0) {
      rzedyEP3--;
      rzedyEP2 += 2;
    }
  }

  let metryW = rzedyW * 1.0;
  let metryEP = (rzedyEP3 + rzedyEP2) * 0.8 + (jedynkiEP ? 0.8 : 0);

  let zajete = +(metryW + metryEP).toFixed(2);
  let wolne = +(DLUGOSC - zajete).toFixed(2);

  // --- ile można dołożyć ---
  let moznaW = Math.floor(wolne / 1.0) * 2;
  let moznaEP = Math.floor(wolne / 0.8) * 3;

  // --- instrukcja ---
  instrukcja.push(`Rzędy W: ${rzedyW} × 1,0 m`);
  instrukcja.push(`Rzędy EP (3): ${rzedyEP3} × 0,8 m`);
  instrukcja.push(`Rzędy EP (2): ${rzedyEP2} × 0,8 m`);
  if (jedynkiEP) instrukcja.push("Jedynka EP na środku");

  document.getElementById("wynik").innerHTML = `
    <strong>Zajęta długość:</strong> ${zajete} m<br>
    <strong>Wolna długość:</strong> ${wolne < 0 ? 0 : wolne} m
    <hr>
    <strong>Rozpiska:</strong>
    <ul>${instrukcja.map(i => `<li>${i}</li>`).join("")}</ul>
    <hr>
    <strong>Można jeszcze dołożyć:</strong><br>
    ${wolne > 0 ? `${moznaW} W lub ${moznaEP} EP` : "Brak miejsca"}
    <div class="small">
      Jedynki używane tylko jeśli zaznaczysz opcję
    </div>
  `;
}
</script>
</body>
</html>
