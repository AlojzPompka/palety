<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Grzyby – powrót do auta</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body,#map {

    height:100%;

    width:100%;

    margin:0;

}

body {

    font-family:-apple-system,BlinkMacSystemFont,sans-serif;

    background:#111;

}

#map {

    position:absolute;

    inset:0;

}

#panel {

    position:fixed;

    z-index:9999;

    left:10px;

    right:10px;

    bottom:20px;

    background:rgba(0,0,0,.85);

    color:white;

    padding:12px;

    border-radius:16px;

    backdrop-filter:blur(10px);

}

#status {

    text-align:center;

    font-size:16px;

    margin-bottom:8px;

}

#distance {

    text-align:center;

    font-size:28px;

    font-weight:bold;

    margin-bottom:10px;

}

.buttons {

    display:flex;

    gap:8px;

}

button {

    flex:1;

    border:0;

    border-radius:12px;

    padding:15px 5px;

    font-size:16px;

    font-weight:bold;

}

#park {

    background:#2ecc71;

}

#back {

    background:#ff9500;

}

#stop {

    background:#e74c3c;

    color:white;

}

</style>

</head>

<body>

<div id="map"></div>

<div id="panel">

    <div id="status">

        Czekam na GPS…

    </div>

    <div id="distance">

        —

    </div>

    <div class="buttons">

        <button id="park">

            🚗 ZAPARKOWAŁEM

        </button>

        <button id="back">

            ↩️ WRÓĆ

        </button>

        <button id="stop">

            ✕ RESET

        </button>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([52.0,19.0],6);

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:19,

        attribution:"© OpenStreetMap"

    }

).addTo(map);

let current = null;

let userMarker = null;

let carMarker = null;

let returnLine = null;

let returnMode = false;

/*

================================================

WCZYTANIE ZAPISANEGO AUTA

================================================

*/

let car = JSON.parse(

    localStorage.getItem("carPosition") || "null"

);

if(car){

    carMarker = L.marker([

        car.lat,

        car.lng

    ]).addTo(map);

    carMarker.bindPopup("🚗 TWOJE AUTO");

}

/*

================================================

ODLEGŁOŚĆ GPS

================================================

*/

function distance(lat1,lon1,lat2,lon2){

    const R = 6371000;

    const p1 = lat1 * Math.PI/180;

    const p2 = lat2 * Math.PI/180;

    const dp =

        (lat2-lat1) * Math.PI/180;

    const dl =

        (lon2-lon1) * Math.PI/180;

    const a =

        Math.sin(dp/2) *

        Math.sin(dp/2) +

        Math.cos(p1) *

        Math.cos(p2) *

        Math.sin(dl/2) *

        Math.sin(dl/2);

    return R * 2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );

}

/*

================================================

AKTUALIZACJA LINII POWROTU

================================================

*/

function updateReturn(){

    if(!returnMode) return;

    if(!current) return;

    if(!car) return;

    const points = [

        [

            current.lat,

            current.lng

        ],

        [

            car.lat,

            car.lng

        ]

    ];

    if(!returnLine){

        returnLine =

            L.polyline(

                points,

                {

                    color:"red",

                    weight:6,

                    dashArray:"10,8"

                }

            ).addTo(map);

    } else {

        returnLine.setLatLngs(points);

    }

    const d = distance(

        current.lat,

        current.lng,

        car.lat,

        car.lng

    );

    if(d >= 1000){

        document.getElementById(

            "distance"

        ).innerText =

            "🚗 " +

            (d/1000).toFixed(2) +

            " km";

    } else {

        document.getElementById(

            "distance"

        ).innerText =

            "🚗 " +

            Math.round(d) +

            " m";

    }

}

/*

================================================

GPS

================================================

*/

function gpsUpdate(pos){

    const lat =

        pos.coords.latitude;

    const lng =

        pos.coords.longitude;

    const accuracy =

        pos.coords.accuracy;

    current = {

        lat,

        lng,

        accuracy

    };

    document.getElementById(

        "status"

    ).innerText =

        "GPS ±" +

        Math.round(accuracy) +

        " m";

    if(!userMarker){

        userMarker =

            L.circleMarker(

                [lat,lng],

                {

                    radius:9,

                    color:"white",

                    weight:3,

                    fillColor:"#007aff",

                    fillOpacity:1

                }

            ).addTo(map);

        map.setView(

            [lat,lng],

            17

        );

    } else {

        userMarker.setLatLng(

            [lat,lng]

        );

    }

    updateReturn();

}

/*

================================================

BŁĄD GPS

================================================

*/

function gpsError(err){

    document.getElementById(

        "status"

    ).innerText =

        "Błąd GPS: " +

        err.message;

}

/*

================================================

URUCHOM GPS

================================================

*/

navigator.geolocation.watchPosition(

    gpsUpdate,

    gpsError,

    {

        enableHighAccuracy:true,

        maximumAge:0,

        timeout:15000

    }

);

/*

================================================

ZAPARKOWAŁEM

================================================

*/

document.getElementById(

    "park"

).onclick = function(){

    if(!current){

        alert(

            "Poczekaj chwilę na pozycję GPS."

        );

        return;

    }

    car = {

        lat:current.lat,

        lng:current.lng

    };

    /*

    ZAPISUJEMY AUTO W PAMIĘCI IPHONE'A

    Dzięki temu możesz:

    - wygasić ekran

    - zamknąć stronę

    - chodzić po lesie

    - wrócić później

    */

    localStorage.setItem(

        "carPosition",

        JSON.stringify(car)

    );

    if(carMarker){

        map.removeLayer(

            carMarker

        );

    }

    carMarker =

        L.marker(

            [

                car.lat,

                car.lng

            ]

        ).addTo(map);

    carMarker

        .bindPopup(

            "🚗 AUTO ZAPISANE"

        )

        .openPopup();

    returnMode = false;

    if(returnLine){

        map.removeLayer(

            returnLine

        );

        returnLine = null;

    }

    document.getElementById(

        "distance"

    ).innerText =

        "🚗 AUTO ZAPISANE";

};

/*

================================================

WRÓĆ DO AUTA

================================================

*/

document.getElementById(

    "back"

).onclick = function(){

    if(!car){

        alert(

            "Najpierw kliknij ZAPARKOWAŁEM."

        );

        return;

    }

    if(!current){

        alert(

            "Czekam na GPS."

        );

        return;

    }

    returnMode = true;

    updateReturn();

    /*

    POKAŻ CAŁĄ TRASĘ:

    TY -> AUTO

    */

    map.fitBounds(

        [

            [

                current.lat,

                current.lng

            ],

            [

                car.lat,

                car.lng

            ]

        ],

        {

            padding:[

                50,

                180

            ]

        }

    );

};

/*

================================================

RESET

================================================

*/

document.getElementById(

    "stop"

).onclick = function(){

    if(

        !confirm(

            "Usunąć zapisane miejsce auta?"

        )

    ){

        return;

    }

    localStorage.removeItem(

        "carPosition"

    );

    car = null;

    returnMode = false;

    if(carMarker){

        map.removeLayer(

            carMarker

        );

        carMarker = null;

    }

    if(returnLine){

        map.removeLayer(

            returnLine

        );

        returnLine = null;

    }

    document.getElementById(

        "distance"

    ).innerText = "—";

};

</script>

</body>

</html>
