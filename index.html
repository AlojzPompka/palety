<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}
.container {
  max-width:700px;
  margin:auto;
}
h1 { margin-bottom:20px; }
label { font-weight:600; }

input {
  width:100%;
  padding:12px;
  font-size:18px;
  margin:8px 0 16px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:14px;
  font-size:20px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:10px;
}

.box {
  background:#fff;
  padding:16px;
  border-radius:12px;
  margin-top:20px;
}

.red { color:red; font-weight:700; }

hr { margin:20px 0; }

/* ===== RYSUNEK ===== */

#naczepa {
  border:2px solid #333;
  padding:8px;
  background:#fafafa;
  max-width:600px;
}

.rzad {
  display:flex;
  margin-bottom:6px;
}

.paleta {
  height:30px;
  border-radius:4px;
  margin-right:4px;
}

/* KLUCZ: 3 EP = 2 W */
.paleta.w {
  width:300px;   /* 600 / 2 */
  background:#4a90e2;
}

.paleta.ep {
  width:200px;   /* 600 / 3 */
  background:#7ed321;
}

.paleta.dopych {
  width:300px;
  background:#f5a623;
}

.paleta:last-child { margin-right:0; }

</style>
</head>

<body>
<div class="container">

<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W:</label>
<input id="w" type="number" value="0">

<label>Palety EP:</label>
<input id="ep" type="number" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<div id="rysunekBox" class="box" style="display:none">
  <strong>Schemat załadunku:</strong>
  <div id="naczepa"></div>
</div>

</div>

<script>
function oblicz() {

  const DLUGOSC = 13.4;
  const dW = 0.95;
  const dEP3 = 1.2;
  const dEP2 = 0.8;

  let w = Number(document.getElementById("w").value);
  let ep = Number(document.getElementById("ep").value);

  let zajete = 0;
  let instrukcja = [];
  let krok = 1;

  const naczepa = document.getElementById("naczepa");
  naczepa.innerHTML = "";
  document.getElementById("rysunekBox").style.display = "none";

  /* ===== W ===== */
  const pelneW = Math.floor(w / 2);
  const resztaW = w % 2;
  const rzedyW = pelneW + (resztaW ? 1 : 0);
  zajete += rzedyW * dW;

  if (rzedyW > 0) {
    instrukcja.push(`${krok++}. Załaduj ${rzedyW} rzędów palet W (2 palety w rzędzie)`);
  }

  /* ===== DOPYCHANIE EP ===== */
  let epDopych = false;
  if (resztaW && ep > 0) {
    ep--;
    epDopych = true;
    instrukcja.push(`${krok++}. Dopychaj 1 paletę EP do rzędu W`);
  }

  /* ===== EP ===== */
  let rzedyEP3 = Math.floor(ep / 3);
  let resztaEP = ep % 3;
  let ep2 = 0;

  if (resztaEP === 1 && rzedyEP3 > 0) {
    rzedyEP3--;
    ep2 = 2;
  } else if (resztaEP >= 2) {
    ep2 = 2;
  }

  zajete += rzedyEP3 * dEP3;
  if (rzedyEP3 > 0) {
    instrukcja.push(`${krok++}. Załaduj ${rzedyEP3} rzędów EP po 3 palety (1,2 m)`);
  }

  if (ep2 > 0) {
    zajete += dEP2;
    instrukcja.push(`${krok++}. Załaduj 2 palety EP w rzędzie po szerokości (0,8 m)`);
  }

  /* ===== PODSUMOWANIE ===== */
  let wolne = +(DLUGOSC - zajete).toFixed(2);

  let html = `<div class="box">
    <strong>Zajęta długość:</strong> ${zajete.toFixed(2)} m<br>
    <strong>Wolne miejsce:</strong> ${wolne >= 0 ? wolne : 0} m<br>`;

  /* ===== ZA DUŻO PALET ===== */
  if (wolne < 0) {
    html += `<br><span class="red">
      Za dużo palet! Usuń około ${Math.ceil(Math.abs(wolne) / dEP2)} palet EP
    </span></div>`;

    document.getElementById("wynik").innerHTML = html;
    return;
  }

  /* ===== MOŻNA DOŁOŻYĆ ===== */
  let mozna3 = Math.floor(wolne / dEP3);
  let reszta = wolne - mozna3 * dEP3;

  html += `<br><strong>Można jeszcze załadować:</strong><br>`;
  if (mozna3 > 0) html += `• ${mozna3 * 3} palet EP (${mozna3} trójki)<br>`;
  if (reszta >= dEP2) html += `• 2 palety EP (dwójka)<br>`;

  /* ===== INSTRUKCJA ===== */
  html += `<hr><strong>Instrukcja załadunku (krok po kroku):</strong><ol>`;
  instrukcja.forEach(i => html += `<li>${i}</li>`);
  html += `</ol></div>`;

  document.getElementById("wynik").innerHTML = html;

  /* ===== RYSUNEK ===== */
  document.getElementById("rysunekBox").style.display = "block";

  for (let i = 0; i < pelneW; i++) rysujRzadW(naczepa);
  if (resztaW && epDopych) rysujDopych(naczepa);
  else if (resztaW) rysujRzadW(naczepa);

  for (let i = 0; i < rzedyEP3; i++) rysujRzadEP3(naczepa);
  if (ep2) rysujRzadEP2(naczepa);
}

/* ===== FUNKCJE RYSUJĄCE ===== */

function rysujRzadW(n) {
  n.innerHTML += `
  <div class="rzad">
    <div class="paleta w"></div>
    <div class="paleta w"></div>
  </div>`;
}

function rysujRzadEP3(n) {
  n.innerHTML += `
  <div class="rzad">
    <div class="paleta ep"></div>
    <div class="paleta ep"></div>
    <div class="paleta ep"></div>
  </div>`;
}

function rysujRzadEP2(n) {
  n.innerHTML += `
  <div class="rzad">
    <div class="paleta ep"></div>
    <div class="paleta ep"></div>
  </div>`;
}

function rysujDopych(n) {
  n.innerHTML += `
  <div class="rzad">
    <div class="paleta w"></div>
    <div class="paleta dopych"></div>
  </div>`;
}
</script>

</body>
</html>
