<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Palet</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Palety">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
      background: #f7f7f7;
    }
    h2 { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-top: 5px;
    }
    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      font-size: 18px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 6px;
    }
    #wynik {
      margin-top: 20px;
      background: white;
      padding: 15px;
      border-radius: 6px;
      font-size: 17px;
    }
    hr { margin: 15px 0; }
    ul, ol { margin-left: 20px; }
  </style>
</head>
<body>

<h2>Kalkulator załadunku W + EP</h2>

<label>Palety W:
  <input type="number" id="w" value="0" min="0">
</label>

<label>Palety EP:
  <input type="number" id="ep" value="0" min="0">
</label>

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<script>
function oblicz() {
  const DLUGOSC = 13.4;
  const d1W = 0.95;
  const d1EP3 = 1.2;
  const d1EP2 = 0.8;

  const w = Number(document.getElementById("w").value || 0);
  let ep = Number(document.getElementById("ep").value || 0);

  let zajete = 0;

  // Rzędy W (2 palety w rzędzie)
  const pelneW = Math.floor(w / 2);
  const resztaW = w % 2;
  const rzedyW = pelneW + (resztaW ? 1 : 0);
  zajete += rzedyW * d1W;

  // Dopychanie EP do niepełnego W
  let epDopych = 0;
  if (resztaW && ep > 0) {
    ep--;
    epDopych = 1;
  }

  // EP po 3
  let rzedyEP3 = Math.floor(ep / 3);
  let resztaEP = ep % 3;
  let ep2 = 0;

  if (resztaEP === 1 && rzedyEP3 > 0) {
    rzedyEP3--;
    ep2 = 2;
  } else if (resztaEP >= 2) {
    ep2 = 2;
  }

  zajete += rzedyEP3 * d1EP3;
  if (ep2) zajete += d1EP2;

  const wolne = DLUGOSC - zajete;

  let wynik = `
    <strong>Zajęta długość:</strong> ${zajete.toFixed(2)} m<br>
  `;

  if (wolne >= 0) {
    wynik += `<strong>Wolne miejsce:</strong> ${wolne.toFixed(2)} m`;
  } else {
    wynik += `<strong style="color:red">Za dużo palet!</strong><br>
              Brakuje ${Math.abs(wolne).toFixed(2)} m`;
  }

  document.getElementById("wynik").innerHTML = wynik;
}
</script>
