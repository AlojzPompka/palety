<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f0c">

<link rel="manifest" href="./manifest.webmanifest">

<title>Powrót do hulajnogi</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #0b0f0c;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

#scene {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.05) 0 1px,
            transparent 1.5px
        )
        0 0 / 28px 28px,

        linear-gradient(
            #111813,
            #0b0f0c
        );
}

#radar {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
}

#top {
    position: fixed;
    z-index: 20;

    top: max(
        12px,
        env(safe-area-inset-top)
    );

    left: 12px;
    right: 12px;

    padding: 12px;

    border-radius: 18px;

    background:
        rgba(8,12,9,.92);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

#status {
    text-align: center;

    font-size: 13px;

    color: #adb5ae;
}

#distance {
    text-align: center;

    font-size: 34px;
    font-weight: 850;

    margin-top: 3px;
}

#headingDisplay {
    text-align: center;

    font-size: 13px;

    color: #adb5ae;

    margin-top: 3px;
}

#hint {
    text-align: center;

    font-size: 13px;

    color: #adb5ae;

    margin-top: 4px;
}

#frontLabel {
    position: fixed;

    z-index: 14;

    left: 50%;

    top: calc(50% - 115px);

    transform: translateX(-50%);

    display: none;

    font-size: 12px;
    font-weight: 800;

    color: #aeb7b0;

    pointer-events: none;
}

#directionArea {
    position: fixed;

    z-index: 15;

    left: 50%;
    top: 50%;

    width: 150px;
    height: 150px;

    margin-left: -75px;
    margin-top: -75px;

    display: none;

    align-items: center;
    justify-content: center;

    pointer-events: none;
}

#arrow {
    font-size: 100px;
    line-height: 1;

    transform: rotate(0deg);

    transform-origin: 50% 50%;

    will-change: transform;

    transition:
        transform 0.06s linear;

    filter:
        drop-shadow(
            0 4px 8px
            rgba(0,0,0,.9)
        );
}

#bottom {
    position: fixed;
    z-index: 20;

    left: 12px;
    right: 12px;

    bottom: max(
        12px,
        env(safe-area-inset-bottom)
    );

    padding: 10px;

    border-radius: 18px;

    background:
        rgba(8,12,9,.92);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.buttons {
    display: flex;

    gap: 8px;
}

button {
    flex: 1;

    border: 0;

    border-radius: 14px;

    min-height: 52px;

    padding: 10px 7px;

    font-size: 15px;
    font-weight: 800;
}

#park {
    background: #31d158;
    color: #001a07;
}

#back {
    background: #ff9f0a;
    color: #1d0d00;
}

#reset {
    background: #ff453a;
    color: white;
}

.badge {
    display: inline-block;

    padding: 2px 7px;

    margin-left: 5px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div id="scene">
    <canvas id="radar"></canvas>
</div>

<div id="top">

    <div id="status">
        Czekam na GPS…
    </div>

    <div id="distance">
        —
    </div>

    <div id="headingDisplay">
        Kompas: —
    </div>

    <div id="hint">
        Przy hulajnodze naciśnij ZAPARKOWAŁEM.
    </div>

</div>

<div id="frontLabel">
    PRZÓD TELEFONU
</div>

<div id="directionArea">
    <div id="arrow">↑</div>
</div>

<div id="bottom">

    <div class="buttons">

        <button id="park">
            🛴 ZAPARKOWAŁEM
        </button>

        <button id="back">
            ↩️ WRÓĆ
        </button>

        <button id="reset">
            RESET
        </button>

    </div>

</div>

<script>

"use strict";


/* ==================================================
   ELEMENTY
================================================== */

const $ =
    id =>
    document.getElementById(id);


const canvas =
    $("radar");


const ctx =
    canvas.getContext("2d");


/* ==================================================
   STAN
================================================== */

let current =
    null;


let scooter =
    null;


let returnMode =
    false;


let phoneHeading =
    null;


let compassStarted =
    false;


let lastCompassUpdate =
    0;


let lastWebkitCompassUpdate =
    0;


/* ==================================================
   WCZYTANIE HULAJNOGI
================================================== */

try {

    const stored =
        localStorage.getItem(
            "scooterPosition"
        )

        ||

        localStorage.getItem(
            "carPosition"
        );


    if(stored) {

        const parsed =
            JSON.parse(
                stored
            );


        const lat =
            Number(
                parsed.lat
            );


        const lng =
            Number(
                parsed.lng
            );


        if(
            Number.isFinite(lat)
            &&
            Number.isFinite(lng)
        ) {

            scooter = {
                lat: lat,
                lng: lng
            };
        }
    }

}
catch(error) {

    scooter =
        null;
}


if(scooter) {

    $("park")
        .style
        .display =
        "none";
}


/* ==================================================
   CANVAS
================================================== */

function resizeCanvas() {

    const dpr =
        Math.max(
            1,
            window.devicePixelRatio || 1
        );


    canvas.width =
        innerWidth *
        dpr;


    canvas.height =
        innerHeight *
        dpr;


    canvas.style.width =
        innerWidth +
        "px";


    canvas.style.height =
        innerHeight +
        "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    drawRadar();
}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/* ==================================================
   ODLEGŁOŚĆ
================================================== */

function distanceM(
    lat1,
    lon1,
    lat2,
    lon2
) {

    lat1 =
        Number(lat1);

    lon1 =
        Number(lon1);

    lat2 =
        Number(lat2);

    lon2 =
        Number(lon2);


    if(
        !Number.isFinite(lat1)
        ||
        !Number.isFinite(lon1)
        ||
        !Number.isFinite(lat2)
        ||
        !Number.isFinite(lon2)
    ) {

        return 0;
    }


    const R =
        6371000;


    const p1 =
        lat1 *
        Math.PI /
        180;


    const p2 =
        lat2 *
        Math.PI /
        180;


    const dp =
        (lat2-lat1) *
        Math.PI /
        180;


    const dl =
        (lon2-lon1) *
        Math.PI /
        180;


    const a =
        Math.sin(dp/2) ** 2

        +

        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dl/2) ** 2;


    return R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1-a)
        );
}


/* ==================================================
   KIERUNEK GPS DO HULAJNOGI
================================================== */

function bearingDeg(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const p1 =
        Number(lat1) *
        Math.PI /
        180;


    const p2 =
        Number(lat2) *
        Math.PI /
        180;


    const dLon =
        (
            Number(lon2)
            -
            Number(lon1)
        )

        *

        Math.PI /
        180;


    const y =
        Math.sin(dLon) *
        Math.cos(p2);


    const x =
        Math.cos(p1) *
        Math.sin(p2)

        -

        Math.sin(p1) *
        Math.cos(p2) *
        Math.cos(dLon);


    return (
        Math.atan2(y,x) *
        180 /
        Math.PI
        +
        360
    ) % 360;
}


/* ==================================================
   KĄTY
================================================== */

function normalize360(angle) {

    return (
        (
            angle % 360
        )
        +
        360
    ) % 360;
}


function normalize180(angle) {

    return (
        (
            (
                angle + 180
            )
            % 360
            +
            360
        )
        % 360
    ) - 180;
}


/* ==================================================
   SKALA LINII
================================================== */

function distanceToRadius(
    distance,
    maxRadius
) {

    distance =
        Number(distance);


    if(
        !Number.isFinite(distance)
        ||
        distance <= 0
    ) {

        return 4;
    }


    const referenceDistance =
        2000;


    let ratio =

        Math.log(
            1 +
            distance / 10
        )

        /

        Math.log(
            1 +
            referenceDistance / 10
        );


    ratio =
        Math.max(
            0,
            Math.min(
                1,
                ratio
            )
        );


    return (
        8 +
        ratio *
        (
            maxRadius - 8
        )
    );
}


/* ==================================================
   KIERUNEK STRZAŁKI

   TU NIE MA JUŻ OSOBNEJ ANIMACJI.
   Obrót wykonuje się bezpośrednio
   przy KAŻDYM odczycie kompasu.
================================================== */

function updateArrowNow() {

    if(
        !returnMode
        ||
        !current
        ||
        !scooter
        ||
        phoneHeading === null
    ) {

        return;
    }


    const targetBearing =
        bearingDeg(

            current.lat,
            current.lng,

            scooter.lat,
            scooter.lng

        );


    /*
    Przykład:

    hulajnoga północ = 0°

    telefon północ = 0°
    -> 0° = strzałka ↑

    telefon wschód = 90°
    -> -90° = strzałka ←

    telefon południe = 180°
    -> 180° = strzałka ↓

    telefon zachód = 270°
    -> 90° = strzałka →
    */


    const relative =
        normalize180(

            targetBearing

            -

            phoneHeading

        );


    $("arrow")
        .style
        .transform =

        `rotate(${relative}deg)`;


    drawRadar();
}


/* ==================================================
   UI
================================================== */

function updateUI() {

    if(!current) {

        $("status")
            .textContent =
            "Czekam na GPS…";

        return;
    }


    const compassFresh =
        phoneHeading !== null

        &&

        (
            Date.now()
            -
            lastCompassUpdate
        )

        < 1500;


    $("status")
        .innerHTML =

        `GPS ±${Math.round(
            current.accuracy
        )} m`

        +

        (

            compassFresh

            ?

            ` <span class="badge">
                kompas LIVE
            </span>`

            :

            ` <span class="badge">
                kompas —
            </span>`

        );


    if(
        phoneHeading !== null
    ) {

        $("headingDisplay")
            .textContent =

            "Kompas: "

            +

            Math.round(
                phoneHeading
            )

            +

            "°";
    }

    else {

        $("headingDisplay")
            .textContent =

            "Kompas: —";
    }


    if(
        scooter
        &&
        returnMode
    ) {

        const d =
            distanceM(

                current.lat,
                current.lng,

                scooter.lat,
                scooter.lng

            );


        if(d >= 1000) {

            $("distance")
                .textContent =

                "🛴 "

                +

                (d/1000)
                    .toFixed(2)

                +

                " km";
        }

        else {

            $("distance")
                .textContent =

                "🛴 "

                +

                Math.round(d)

                +

                " m";
        }


        if(compassFresh) {

            $("hint")
                .textContent =

                "Obróć telefon — stopnie i strzałka powinny zmieniać się natychmiast.";
        }

        else {

            $("hint")
                .textContent =

                "Czekam na ciągłe dane z kompasu…";
        }
    }

    else if(scooter) {

        $("distance")
            .textContent =

            "🛴 HULAJNOGA ZAPISANA";


        $("hint")
            .textContent =

            "Gdy chcesz wracać, naciśnij WRÓĆ.";
    }

    else {

        $("distance")
            .textContent =
            "—";


        $("hint")
            .textContent =

            "Przy hulajnodze naciśnij ZAPARKOWAŁEM.";
    }


    updateVisibility();
}


/* ==================================================
   WIDOCZNOŚĆ
================================================== */

function updateVisibility() {

    if(
        returnMode
        &&
        scooter
    ) {

        $("directionArea")
            .style
            .display =
            "flex";


        $("frontLabel")
            .style
            .display =
            "block";
    }

    else {

        $("directionArea")
            .style
            .display =
            "none";


        $("frontLabel")
            .style
            .display =
            "none";
    }
}


/* ==================================================
   RADAR
================================================== */

function drawRadar() {

    const w =
        innerWidth;


    const h =
        innerHeight;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    const cx =
        w / 2;


    const cy =
        h / 2;


    const maxRadius =
        Math.min(
            w,
            h
        )
        *
        0.37;


    ctx.save();


    ctx.strokeStyle =
        "rgba(255,255,255,.13)";


    ctx.lineWidth =
        1;


    [
        0.25,
        0.5,
        0.75,
        1
    ]
    .forEach(
        ring => {

            ctx.beginPath();


            ctx.arc(
                cx,
                cy,

                maxRadius *
                ring,

                0,
                Math.PI*2
            );


            ctx.stroke();
        }
    );


    /* KRZYŻ */

    ctx.beginPath();


    ctx.moveTo(
        cx-maxRadius,
        cy
    );


    ctx.lineTo(
        cx+maxRadius,
        cy
    );


    ctx.moveTo(
        cx,
        cy-maxRadius
    );


    ctx.lineTo(
        cx,
        cy+maxRadius
    );


    ctx.stroke();


    /* TY */

    ctx.fillStyle =
        "#0a84ff";


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        9,
        0,
        Math.PI*2
    );


    ctx.fill();


    ctx.strokeStyle =
        "white";


    ctx.lineWidth =
        3;


    ctx.stroke();


    if(
        returnMode
        &&
        current
        &&
        scooter
    ) {

        const d =
            distanceM(

                current.lat,
                current.lng,

                scooter.lat,
                scooter.lng

            );


        const targetBearing =
            bearingDeg(

                current.lat,
                current.lng,

                scooter.lat,
                scooter.lng

            );


        /*
        Radar również obraca się
        względem telefonu.
        */

        let relative =
            targetBearing;


        if(
            phoneHeading !== null
        ) {

            relative =
                normalize180(

                    targetBearing

                    -

                    phoneHeading

                );
        }


        const angle =
            (
                relative -
                90
            )

            *

            Math.PI /
            180;


        const lineLength =
            distanceToRadius(

                d,

                maxRadius *
                0.94

            );


        const endX =
            cx

            +

            Math.cos(angle)

            *

            lineLength;


        const endY =
            cy

            +

            Math.sin(angle)

            *

            lineLength;


        /*
        CIĄGŁA CZERWONA LINIA.
        */

        ctx.strokeStyle =
            "#ff453a";


        ctx.lineWidth =
            7;


        ctx.lineCap =
            "round";


        ctx.setLineDash([]);


        ctx.beginPath();


        ctx.moveTo(
            cx,
            cy
        );


        ctx.lineTo(
            endX,
            endY
        );


        ctx.stroke();


        /*
        HULAJNOGA.
        */

        ctx.fillStyle =
            "#ff9f0a";


        ctx.beginPath();


        ctx.arc(
            endX,
            endY,
            13,
            0,
            Math.PI*2
        );


        ctx.fill();


        ctx.strokeStyle =
            "white";


        ctx.lineWidth =
            2;


        ctx.stroke();


        ctx.font =
            "700 17px -apple-system";


        ctx.fillStyle =
            "white";


        ctx.textAlign =
            "center";


        ctx.fillText(
            "🛴",
            endX,
            endY - 21
        );
    }


    ctx.restore();
}


/* ==================================================
   GPS
================================================== */

function gpsUpdate(pos) {

    const lat =
        Number(
            pos.coords.latitude
        );


    const lng =
        Number(
            pos.coords.longitude
        );


    const accuracy =
        Number(
            pos.coords.accuracy
        );


    if(
        !Number.isFinite(lat)
        ||
        !Number.isFinite(lng)
    ) {

        return;
    }


    current = {

        lat: lat,

        lng: lng,

        accuracy:
            Number.isFinite(
                accuracy
            )
            ?
            accuracy
            :
            0
    };


    updateUI();

    updateArrowNow();

    drawRadar();
}


function gpsError(error) {

    $("status")
        .textContent =

        "Błąd GPS: "

        +

        error.message;
}


navigator.geolocation.watchPosition(

    gpsUpdate,

    gpsError,

    {
        enableHighAccuracy:
            true,

        maximumAge:
            0,

        timeout:
            15000
    }

);


/* ==================================================
   KOMPAS IPHONE

   Najważniejsze:
   jeśli Safari daje webkitCompassHeading,
   używamy WYŁĄCZNIE jego.

   Nie mieszamy równocześnie
   alpha i webkitCompassHeading.
================================================== */

function compassEvent(event) {

    let heading =
        null;


    const now =
        Date.now();


    /*
    PREFEROWANA METODA IPHONE.
    */

    if(
        typeof
        event.webkitCompassHeading

        ===

        "number"

        &&

        event.webkitCompassHeading >= 0
    ) {

        heading =
            event.webkitCompassHeading;


        lastWebkitCompassUpdate =
            now;
    }


    /*
    FALLBACK.

    Używamy alpha tylko,
    jeżeli przez chwilę NIE było
    webkitCompassHeading.
    */

    else if(

        typeof event.alpha
        ===
        "number"

        &&

        (
            now
            -
            lastWebkitCompassUpdate
        )
        >
        2000

    ) {

        heading =
            360 -
            event.alpha;


        let screenAngle =
            0;


        if(
            screen.orientation

            &&

            typeof
            screen.orientation.angle

            ===

            "number"
        ) {

            screenAngle =
                screen.orientation.angle;
        }


        heading =
            heading +
            screenAngle;
    }


    if(
        heading === null
        ||
        !Number.isFinite(
            heading
        )
    ) {

        return;
    }


    phoneHeading =
        normalize360(
            heading
        );


    lastCompassUpdate =
        now;


    /*
    TO JEST KLUCZOWE:

    KAŻDY odczyt kompasu
    OD RAZU obraca strzałkę.
    */

    updateArrowNow();

    updateUI();

    drawRadar();
}


/* ==================================================
   START KOMPASU
================================================== */

async function startCompass() {

    if(compassStarted) {

        return true;
    }


    try {

        if(

            typeof
            DeviceOrientationEvent

            !==

            "undefined"

            &&

            typeof
            DeviceOrientationEvent
                .requestPermission

            ===

            "function"

        ) {

            const permission =

                await

                DeviceOrientationEvent
                    .requestPermission();


            if(
                permission
                !==
                "granted"
            ) {

                $("hint")
                    .textContent =

                    "Brak zgody na ruch i orientację.";

                return false;
            }
        }


        /*
        Safari iOS.
        */

        window.addEventListener(

            "deviceorientation",

            compassEvent,

            true

        );


        /*
        Dodatkowy fallback.
        */

        window.addEventListener(

            "deviceorientationabsolute",

            compassEvent,

            true

        );


        compassStarted =
            true;


        return true;
    }

    catch(error) {

        $("hint")
            .textContent =

            "Nie udało się uruchomić kompasu.";


        return false;
    }
}


/* ==================================================
   ZAPARKOWAŁEM
================================================== */

$("park")
.addEventListener(

    "click",

    () => {

        if(!current) {

            alert(
                "Poczekaj na GPS."
            );

            return;
        }


        scooter = {

            lat:
                current.lat,

            lng:
                current.lng
        };


        localStorage.setItem(

            "scooterPosition",

            JSON.stringify(
                scooter
            )
        );


        localStorage.removeItem(
            "carPosition"
        );


        returnMode =
            false;


        $("park")
            .style
            .display =
            "none";


        updateUI();
    }
);


/* ==================================================
   WRÓĆ
================================================== */

$("back")
.addEventListener(

    "click",

    async () => {

        if(!scooter) {

            alert(
                "Najpierw zapisz hulajnogę."
            );

            return;
        }


        if(!current) {

            alert(
                "Czekam na GPS."
            );

            return;
        }


        returnMode =
            true;


        updateVisibility();


        await startCompass();


        updateArrowNow();

        updateUI();

        drawRadar();
    }
);


/* ==================================================
   RESET
================================================== */

$("reset")
.addEventListener(

    "click",

    () => {

        if(
            !confirm(
                "Usunąć zapisane miejsce hulajnogi?"
            )
        ) {

            return;
        }


        localStorage.removeItem(
            "scooterPosition"
        );


        localStorage.removeItem(
            "carPosition"
        );


        scooter =
            null;


        returnMode =
            false;


        $("park")
            .style
            .display =
            "";


        updateVisibility();

        updateUI();

        drawRadar();
    }
);


/* ==================================================
   SPRAWDZANIE, CZY KOMPAS NADAL NADAJE
================================================== */

setInterval(
    () => {

        if(returnMode) {

            updateUI();
        }

    },
    500
);

updateUI();

if(
    "serviceWorker"
    in navigator
) {

    window.addEventListener(

        "load",

        () => {

            navigator
                .serviceWorker
                .register(
                    "./sw.js"
                )
                .catch(
                    () => {}
                );
        }
    );
}
