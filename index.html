<!doctype html>

<html lang="pl">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />

  <meta name="theme-color" content="#07100b" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Hulajnoga – powrót</title>

  <style>

    :root{

      --bg:#07100b;

      --panel:#0d1410;

      --text:#f4f4f4;

      --muted:#b8b8b8;

      --grid:#2b332e;

      --green:#75d99b;

      --orange:#ffab32;

      --red:#ff5249;

      --blue:#3d7cff;

    }

    *{

      box-sizing:border-box;

      -webkit-tap-highlight-color:transparent;

    }

    html,body{

      margin:0;

      min-height:100%;

      background:var(--bg);

      color:var(--text);

      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

    }

    body{

      min-height:100dvh;

      overflow:hidden;

      background:

        radial-gradient(circle at 50% 44%, rgba(40,55,46,.18), transparent 37%),

        var(--bg);

    }

    #app{

      height:100dvh;

      display:flex;

      flex-direction:column;

      padding:

        max(18px, env(safe-area-inset-top))

        22px

        max(18px, env(safe-area-inset-bottom));

      gap:16px;

    }

    .top{

      width:100%;

      border-radius:24px;

      background:rgba(9,15,11,.94);

      padding:18px 18px 16px;

      text-align:center;

      box-shadow:0 12px 36px rgba(0,0,0,.18);

    }

    .status{

      display:flex;

      align-items:center;

      justify-content:center;

      gap:12px;

      min-height:27px;

      color:var(--muted);

      font-size:18px;

      margin-bottom:6px;

    }

    .pill{

      padding:3px 11px;

      border-radius:999px;

      background:#30332f;

      color:#d4d4d4;

      white-space:nowrap;

    }

    .pill.bad{

      background:#4a2727;

      color:#ffd4d4;

    }

    .pill.good{

      background:#26382b;

      color:#d9ffe4;

    }

    .distance{

      font-size:clamp(38px,8vw,58px);

      line-height:1.05;

      font-weight:800;

      letter-spacing:-1.5px;

      white-space:nowrap;

    }

    .subtitle{

      color:var(--muted);

      font-size:18px;

      margin-top:13px;

    }

    #radarWrap{

      flex:1;

      min-height:0;

      display:flex;

      align-items:center;

      justify-content:center;

      position:relative;

      overflow:hidden;

      border-radius:26px;

      background-image:

        radial-gradient(

          rgba(95,111,101,.18) 1.5px,

          transparent 1.5px

        );

      background-size:31px 31px;

    }

    #radar{

      width:min(82vw,610px);

      aspect-ratio:1/1;

      position:relative;

      border:2px solid var(--grid);

      border-radius:50%;

    }

    .ring,

    .axisV,

    .axisH{

      position:absolute;

      pointer-events:none;

    }

    .ring{

      border:2px solid var(--grid);

      border-radius:50%;

      left:50%;

      top:50%;

      transform:translate(-50%,-50%);

    }

    .r2{

      width:66%;

      height:66%;

    }

    .r3{

      width:33%;

      height:33%;

    }

    .axisV{

      width:2px;

      height:100%;

      left:50%;

      top:0;

      transform:translateX(-50%);

      background:var(--grid);

    }

    .axisH{

      height:2px;

      width:100%;

      top:50%;

      left:0;

      transform:translateY(-50%);

      background:var(--grid);

    }

    .front{

      position:absolute;

      top:7.5%;

      left:50%;

      transform:translateX(-50%);

      color:#c4c4c4;

      font-size:18px;

      z-index:3;

      white-space:nowrap;

      text-shadow:0 2px 8px #000;

    }

    .me{

      width:30px;

      height:30px;

      border-radius:50%;

      position:absolute;

      left:50%;

      top:50%;

      transform:translate(-50%,-50%);

      background:var(--blue);

      border:5px solid #d8d8d8;

      z-index:6;

      box-shadow:0 2px 8px rgba(0,0,0,.4);

    }

    #directionLayer{

      position:absolute;

      left:50%;

      top:50%;

      width:0;

      height:0;

      transform-origin:0 0;

      z-index:5;

      will-change:transform;

    }

    #arrow{

      position:absolute;

      left:-31px;

      top:-62px;

      width:62px;

      height:62px;

      filter:drop-shadow(0 3px 2px rgba(0,0,0,.35));

    }

    #arrow::before,

    #arrow::after{

      content:"";

      position:absolute;

      background:#fff;

      border-radius:10px;

    }

    #arrow::before{

      width:11px;

      height:58px;

      left:25px;

      top:2px;

    }

    #arrow::after{

      width:38px;

      height:38px;

      left:12px;

      top:3px;

      background:transparent;

      border-left:11px solid #fff;

      border-top:11px solid #fff;

      transform:rotate(45deg);

      border-radius:8px 0 0 0;

    }

    #line{

      position:absolute;

      left:-3px;

      top:25px;

      width:6px;

      height:clamp(100px,20vw,170px);

      background:

        repeating-linear-gradient(

          to bottom,

          var(--red) 0 19px,

          transparent 19px 34px

        );

      transform-origin:top center;

      z-index:2;

    }

    #scooter{

      position:absolute;

      left:50%;

      top:50%;

      transform:translate(-50%,-50%);

      text-align:center;

      z-index:4;

      pointer-events:none;

    }

    #scooterLabel{

      font-size:18px;

      font-weight:800;

      margin-bottom:5px;

      white-space:nowrap;

      text-shadow:0 2px 8px #000;

    }

    #scooterDot{

      width:52px;

      height:52px;

      border-radius:50%;

      background:var(--orange);

      margin:auto;

      box-shadow:0 2px 8px rgba(0,0,0,.35);

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:26px;

    }

    .controls{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:14px;

      width:100%;

      flex:0 0 auto;

    }

    button{

      appearance:none;

      border:0;

      border-radius:24px;

      min-height:78px;

      padding:16px;

      font-size:22px;

      font-weight:800;

      color:#101010;

      cursor:pointer;

    }

    #parkBtn{

      grid-column:1/-1;

      background:var(--green);

    }

    #returnBtn{

      background:var(--orange);

    }

    #resetBtn{

      background:var(--red);

      color:#fff;

    }

    button:active{

      transform:scale(.985);

    }

    button[hidden]{

      display:none!important;

    }

    #message{

      position:fixed;

      left:50%;

      bottom:calc(118px + env(safe-area-inset-bottom));

      transform:translateX(-50%);

      width:min(90vw,560px);

      padding:12px 16px;

      border-radius:16px;

      background:rgba(20,25,21,.96);

      color:#fff;

      text-align:center;

      font-size:16px;

      opacity:0;

      pointer-events:none;

      transition:opacity .2s ease;

      z-index:20;

      box-shadow:0 10px 30px rgba(0,0,0,.3);

    }

    #message.show{

      opacity:1;

    }

    @media (max-height:720px){

      .top{

        padding:11px 15px;

      }

      .subtitle{

        margin-top:7px;

        font-size:15px;

      }

      .status{

        font-size:15px;

      }

      button{

        min-height:60px;

        font-size:19px;

      }

      #radar{

        width:min(70vh,78vw);

      }

    }

  </style>

</head>

<body>

<div id="app">

  <section class="top">

    <div class="status">

      <span id="gpsText">

        GPS —

      </span>

      <span

        id="compassText"

        class="pill"

      >

        kompas —

      </span>

    </div>

    <div

      id="distanceText"

      class="distance"

    >

      🛴 — m

    </div>

    <div

      id="subtitle"

      class="subtitle"

    >

      Zapisz miejsce hulajnogi.

    </div>

  </section>

  <main id="radarWrap">

    <div id="radar">

      <div class="ring r2"></div>

      <div class="ring r3"></div>

      <div class="axisV"></div>

      <div class="axisH"></div>

      <div class="front">

        PRZÓD TELEFONU

      </div>

      <div class="me"></div>

      <div id="directionLayer">

        <div id="arrow"></div>

        <div id="line"></div>

      </div>

      <div id="scooter">

        <div id="scooterLabel">

          HULAJNOGA

        </div>

        <div id="scooterDot">

          🛴

        </div>

      </div>

    </div>

  </main>

  <div class="controls">

    <button id="parkBtn">

      🛴 ZAPARKOWAŁEM

    </button>

    <button

      id="returnBtn"

      hidden

    >

      ↩️ WRÓĆ

    </button>

    <button

      id="resetBtn"

      hidden

    >

      RESET

    </button>

  </div>

</div>

<div id="message"></div>

<script>

(() => {

  "use strict";

  const STORAGE_KEY = "scooterPosition";

  const LEGACY_KEY = "carPosition";

  const gpsText =

    document.getElementById("gpsText");

  const compassText =

    document.getElementById("compassText");

  const distanceText =

    document.getElementById("distanceText");

  const subtitle =

    document.getElementById("subtitle");

  const directionLayer =

    document.getElementById("directionLayer");

  const scooter =

    document.getElementById("scooter");

  const parkBtn =

    document.getElementById("parkBtn");

  const returnBtn =

    document.getElementById("returnBtn");

  const resetBtn =

    document.getElementById("resetBtn");

  const message =

    document.getElementById("message");

  let currentPos = null;

  let scooterPos = null;

  let heading = null;

  let bearingToScooter = null;

  let returning = false;

  let watchId = null;

  let lastArrowAngle = null;

  let messageTimer = null;

  let wakeLock = null;

  function finiteNumber(v){

    const n =

      typeof v === "number"

        ? v

        : Number(v);

    return Number.isFinite(n)

      ? n

      : null;

  }

  function validCoords(obj){

    if(!obj){

      return null;

    }

    const lat = finiteNumber(

      obj.lat ??

      obj.latitude ??

      obj.coords?.latitude

    );

    const lon = finiteNumber(

      obj.lon ??

      obj.lng ??

      obj.longitude ??

      obj.coords?.longitude

    );

    if(lat === null || lon === null){

      return null;

    }

    if(

      lat < -90 ||

      lat > 90 ||

      lon < -180 ||

      lon > 180

    ){

      return null;

    }

    return {

      lat,

      lon,

      accuracy: finiteNumber(

        obj.accuracy ??

        obj.coords?.accuracy

      ),

      savedAt:

        finiteNumber(obj.savedAt) ??

        Date.now()

    };

  }

  function normalize360(deg){

    return (

      (deg % 360) +

      360

    ) % 360;

  }

  function shortestAngleDelta(from,to){

    return (

      (to - from + 540) % 360

    ) - 180;

  }

  function showMessage(

    text,

    ms = 2600

  ){

    clearTimeout(messageTimer);

    message.textContent = text;

    message.classList.add("show");

    messageTimer =

      setTimeout(() => {

        message.classList.remove("show");

      },ms);

  }

  function setCompassState(

    text,

    state = ""

  ){

    compassText.textContent = text;

    compassText.className =

      "pill" +

      (state ? " " + state : "");

  }

  function loadScooter(){

    let parsed = null;

    try{

      const raw =

        localStorage.getItem(

          STORAGE_KEY

        );

      if(raw){

        parsed = JSON.parse(raw);

      }

    }catch{}

    /*

      Jeżeli poprzednia wersja

      zapisała pozycję jako auto,

      próbujemy ją odzyskać.

    */

    if(!validCoords(parsed)){

      try{

        const oldRaw =

          localStorage.getItem(

            LEGACY_KEY

          );

        if(oldRaw){

          const old =

            validCoords(

              JSON.parse(oldRaw)

            );

          if(old){

            parsed = old;

            localStorage.setItem(

              STORAGE_KEY,

              JSON.stringify(old)

            );

            localStorage.removeItem(

              LEGACY_KEY

            );

          }

        }

      }catch{}

    }

    scooterPos =

      validCoords(parsed);

    if(scooterPos){

      parkBtn.hidden = true;

      returnBtn.hidden = false;

      resetBtn.hidden = false;

      subtitle.textContent =

        "Pozycja hulajnogi zapisana. Naciśnij WRÓĆ.";

    }else{

      localStorage.removeItem(

        STORAGE_KEY

      );

      parkBtn.hidden = false;

      returnBtn.hidden = true;

      resetBtn.hidden = true;

      subtitle.textContent =

        "Zapisz miejsce hulajnogi.";

      distanceText.textContent =

        "🛴 — m";

    }

  }

  function saveScooter(pos){

    const safe =

      validCoords(pos);

    if(!safe){

      return false;

    }

    scooterPos = {

      lat:safe.lat,

      lon:safe.lon,

      accuracy:safe.accuracy,

      savedAt:Date.now()

    };

    localStorage.setItem(

      STORAGE_KEY,

      JSON.stringify(scooterPos)

    );

    return true;

  }

  function distanceMeters(a,b){

    a = validCoords(a);

    b = validCoords(b);

    if(!a || !b){

      return null;

    }

    const R = 6371000;

    const φ1 =

      a.lat *

      Math.PI / 180;

    const φ2 =

      b.lat *

      Math.PI / 180;

    const dφ =

      (b.lat - a.lat) *

      Math.PI / 180;

    const dλ =

      (b.lon - a.lon) *

      Math.PI / 180;

    const h =

      Math.sin(dφ / 2) ** 2 +

      Math.cos(φ1) *

      Math.cos(φ2) *

      Math.sin(dλ / 2) ** 2;

    const clamped =

      Math.min(

        1,

        Math.max(

          0,

          h

        )

      );

    const d =

      2 *

      R *

      Math.asin(

        Math.sqrt(clamped)

      );

    return Number.isFinite(d)

      ? d

      : null;

  }

  function bearingDegrees(a,b){

    a = validCoords(a);

    b = validCoords(b);

    if(!a || !b){

      return null;

    }

    const φ1 =

      a.lat *

      Math.PI / 180;

    const φ2 =

      b.lat *

      Math.PI / 180;

    const λ1 =

      a.lon *

      Math.PI / 180;

    const λ2 =

      b.lon *

      Math.PI / 180;

    const y =

      Math.sin(

        λ2 - λ1

      ) *

      Math.cos(φ2);

    const x =

      Math.cos(φ1) *

      Math.sin(φ2)

      -

      Math.sin(φ1) *

      Math.cos(φ2) *

      Math.cos(

        λ2 - λ1

      );

    const deg =

      Math.atan2(

        y,

        x

      )

      *

      180 / Math.PI;

    return Number.isFinite(deg)

      ? normalize360(deg)

      : null;

  }

  function updateDistanceAndBearing(){

    if(

      !scooterPos ||

      !currentPos

    ){

      distanceText.textContent =

        "🛴 — m";

      bearingToScooter = null;

      return;

    }

    const d =

      distanceMeters(

        currentPos,

        scooterPos

      );

    const b =

      bearingDegrees(

        currentPos,

        scooterPos

      );

    bearingToScooter = b;

    if(d === null){

      distanceText.textContent =

        "🛴 — m";

    }

    else if(d < 10){

      distanceText.textContent =

        "🛴 " +

        d

          .toFixed(1)

          .replace(".",",")

        +

        " m";

    }

    else if(d < 1000){

      distanceText.textContent =

        "🛴 " +

        Math.round(d)

        +

        " m";

    }

    else{

      distanceText.textContent =

        "🛴 " +

        (d / 1000)

          .toFixed(2)

          .replace(".",",")

        +

        " km";

    }

    updateArrow();

  }

  function updateArrow(){

    if(

      !returning ||

      bearingToScooter === null

    ){

      return;

    }

    let targetAngle;

    /*

      Kluczowa rzecz:

      kierunek do hulajnogi

      minus

      kierunek, w który patrzy telefon.

      Przykład:

      hulajnoga za Tobą

      = strzałka 180°

      obracasz się do hulajnogi

      = strzałka 0°

    */

    if(

      heading !== null &&

      Number.isFinite(heading)

    ){

      targetAngle =

        normalize360(

          bearingToScooter -

          heading

        );

    }else{

      targetAngle =

        normalize360(

          bearingToScooter

        );

    }

    /*

      Wygładzanie ruchu.

      Dzięki temu przy przejściu

      np. z 359° na 0°

      strzałka nie robi pełnego obrotu.

    */

    if(lastArrowAngle === null){

      lastArrowAngle =

        targetAngle;

    }else{

      lastArrowAngle +=

        shortestAngleDelta(

          lastArrowAngle,

          targetAngle

        )

        *

        0.28;

    }

    directionLayer.style.transform =

      `rotate(${lastArrowAngle}deg)`;

    /*

      Hulajnoga przesuwa się

      po okręgu razem z kierunkiem,

      ale napis i ikona pozostają pionowo.

    */

    scooter.style.transform =

      `translate(-50%,-50%)

       rotate(${lastArrowAngle}deg)

       translateY(min(22vw,185px))

       rotate(${-lastArrowAngle}deg)`;

  }

  function onPosition(pos){

    const safe =

      validCoords(pos);

    if(!safe){

      return;

    }

    currentPos = safe;

    if(safe.accuracy !== null){

      gpsText.textContent =

        "GPS ±" +

        Math.round(

          safe.accuracy

        )

        +

        " m";

    }else{

      gpsText.textContent =

        "GPS OK";

    }

    updateDistanceAndBearing();

  }

  function onGeoError(err){

    const messages = {

      1:

        "Brak zgody na lokalizację.",

      2:

        "GPS chwilowo nie może ustalić pozycji.",

      3:

        "GPS: przekroczono czas oczekiwania."

    };

    gpsText.textContent =

      "GPS błąd";

    showMessage(

      messages[err?.code] ||

      "Błąd GPS."

    );

  }

  function startGPS(){

    if(

      !("geolocation" in navigator)

    ){

      gpsText.textContent =

        "GPS niedostępny";

      return;

    }

    if(watchId !== null){

      navigator.geolocation

        .clearWatch(

          watchId

        );

    }

    navigator.geolocation

      .getCurrentPosition(

        onPosition,

        onGeoError,

        {

          enableHighAccuracy:true,

          timeout:12000,

          maximumAge:0

        }

      );

    watchId =

      navigator.geolocation

        .watchPosition(

          onPosition,

          onGeoError,

          {

            enableHighAccuracy:true,

            timeout:20000,

            maximumAge:1000

          }

        );

  }

  function screenAngle(){

    let a = 0;

    if(

      screen.orientation &&

      Number.isFinite(

        screen.orientation.angle

      )

    ){

      a =

        screen.orientation.angle;

    }

    else if(

      typeof window.orientation ===

      "number"

    ){

      a =

        window.orientation;

    }

    return a;

  }

  function onOrientation(e){

    let h = null;

    /*

      iPhone / Safari.

    */

    if(

      typeof e.webkitCompassHeading ===

      "number"

      &&

      Number.isFinite(

        e.webkitCompassHeading

      )

    ){

      h =

        e.webkitCompassHeading;

    }

    /*

      Android / inne przeglądarki.

    */

    else if(

      e.absolute === true

      &&

      typeof e.alpha ===

      "number"

      &&

      Number.isFinite(

        e.alpha

      )

    ){

      h =

        normalize360(

          360 -

          e.alpha +

          screenAngle()

        );

    }

    if(h === null){

      return;

    }

    /*

      Lekkie wygładzanie kompasu.

    */

    if(heading === null){

      heading =

        normalize360(h);

    }

    else{

      heading =

        normalize360(

          heading +

          shortestAngleDelta(

            heading,

            h

          )

          *

          0.22

        );

    }

    setCompassState(

      "kompas OK",

      "good"

    );

    updateArrow();

  }

  async function startCompass(){

    if(

      !window.DeviceOrientationEvent

    ){

      setCompassState(

        "brak kompasu",

        "bad"

      );

      return;

    }

    try{

      /*

        iPhone wymaga zgody

        wywołanej po kliknięciu.

      */

      if(

        typeof

        DeviceOrientationEvent

          .requestPermission

        ===

        "function"

      ){

        const result =

          await

          DeviceOrientationEvent

            .requestPermission();

        if(

          result !==

          "granted"

        ){

          setCompassState(

            "kompas: brak zgody",

            "bad"

          );

          return;

        }

      }

      window.removeEventListener(

        "deviceorientation",

        onOrientation,

        true

      );

      window.addEventListener(

        "deviceorientation",

        onOrientation,

        true

      );

      window.removeEventListener(

        "deviceorientationabsolute",

        onOrientation,

        true

      );

      window.addEventListener(

        "deviceorientationabsolute",

        onOrientation,

        true

      );

      setCompassState(

        "kompas…"

      );

    }catch{

      setCompassState(

        "kompas: błąd",

        "bad"

      );

    }

  }

  async function requestWakeLock(){

    try{

      if(

        "wakeLock" in navigator &&

        returning

      ){

        wakeLock =

          await

          navigator

            .wakeLock

            .request(

              "screen"

            );

      }

    }catch{}

  }

  document.addEventListener(

    "visibilitychange",

    () => {

      if(

        document.visibilityState ===

        "visible"

      ){

        startGPS();

        if(returning){

          requestWakeLock();

          navigator.geolocation

            ?.getCurrentPosition(

              onPosition,

              () => {},

              {

                enableHighAccuracy:true,

                timeout:12000,

                maximumAge:0

              }

            );

        }

      }

    }

  );

  parkBtn.addEventListener(

    "click",

    async () => {

      await startCompass();

      if(!currentPos){

        showMessage(

          "Czekam na aktualną pozycję GPS…"

        );

        navigator.geolocation

          ?.getCurrentPosition(

            pos => {

              onPosition(pos);

              if(

                saveScooter(

                  currentPos

                )

              ){

                loadScooter();

                showMessage(

                  "Pozycja hulajnogi zapisana."

                );

              }

            },

            onGeoError,

            {

              enableHighAccuracy:true,

              timeout:15000,

              maximumAge:0

            }

          );

        return;

      }

      if(

        saveScooter(

          currentPos

        )

      ){

        loadScooter();

        showMessage(

          "Pozycja hulajnogi zapisana."

        );

      }

    }

  );

  returnBtn.addEventListener(

    "click",

    async () => {

      if(!scooterPos){

        showMessage(

          "Najpierw zapisz pozycję hulajnogi."

        );

        return;

      }

      returning = true;

      lastArrowAngle = null;

      subtitle.textContent =

        "Strzałka pokazuje kierunek do hulajnogi.";

      await startCompass();

      startGPS();

      requestWakeLock();

      updateDistanceAndBearing();

      returnBtn.textContent =

        "↩️ WRÓĆ";

    }

  );

  resetBtn.addEventListener(

    "click",

    async () => {

      localStorage.removeItem(

        STORAGE_KEY

      );

      localStorage.removeItem(

        LEGACY_KEY

      );

      scooterPos = null;

      bearingToScooter = null;

      returning = false;

      lastArrowAngle = null;

      distanceText.textContent =

        "🛴 — m";

      directionLayer.style.transform =

        "rotate(0deg)";

      try{

        if(wakeLock){

          await

          wakeLock.release();

        }

      }catch{}

      wakeLock = null;

      loadScooter();

      showMessage(

        "Pozycja hulajnogi usunięta."

      );

    }

  );

  loadScooter();

  startGPS();

})();

</script>

</body>

</html>
