<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Kalkulator załadunku W + EP</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}
.card {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  max-width: 600px;
  margin: auto;
}
input {
  width: 100%;
  padding: 10px;
  font-size: 18px;
  margin-bottom: 10px;
}
button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  background: #007bff;
  color: #fff;
  border: none;
  border-radius: 8px;
}
.result {
  margin-top: 15px;
  font-size: 16px;
}
.trailer {
  margin-top: 20px;
  background: #222;
  padding: 10px;
  border-radius: 8px;
}
.row {
  display: flex;
  margin-bottom: 4px;
}
.cell {
  flex: 1;
  height: 28px;
  margin: 2px;
  border-radius: 4px;
}
.w { background: #4a90e2; }
.epw { background: orange; }
.ep3 { background: #4caf50; }
.ep2 { background: #2e7d32; }
.free { background: #aaa; }

.legend {
  display: flex;
  flex-wrap: wrap;
  margin-top: 10px;
}
.legend div {
  display: flex;
  align-items: center;
  margin-right: 10px;
  font-size: 14px;
}
.legend span {
  width: 16px;
  height: 16px;
  display: inline-block;
  margin-right: 5px;
}
</style>
</head>

<body>
<div class="card">
  <h2>Kalkulator załadunku W + EP</h2>

  <label>Palety W</label>
  <input type="number" id="w" value="13">

  <label>Palety EP</label>
  <input type="number" id="ep" value="11">

  <button onclick="calculate()">Oblicz</button>

  <div class="result" id="text"></div>
  <div class="trailer" id="trailer"></div>

  <div class="legend">
    <div><span class="w"></span>W</div>
    <div><span class="epw"></span>EP (W+EP)</div>
    <div><span class="ep3"></span>EP(3)</div>
    <div><span class="ep2"></span>EP(2)</div>
    <div><span class="free"></span>Wolne</div>
  </div>
</div>

<script>
const TRAILER = 13.4;

function calculate() {
  let W = +document.getElementById('w').value;
  let EP = +document.getElementById('ep').value;

  let rows = [];
  let used = 0;

  // Rzędy W (2 W = 1 m)
  let wRows = Math.floor(W / 2);
  for (let i = 0; i < wRows; i++) {
    rows.push({ type: 'W' });
    used += 1;
  }
  W %= 2;

  // Rząd W + EP
  if (W === 1 && EP >= 1) {
    rows.push({ type: 'WEP' });
    used += 1;
    EP -= 1;
  }

  // EP(3)
  let ep3 = Math.floor(EP / 3);
  for (let i = 0; i < ep3; i++) {
    rows.push({ type: 'EP3' });
    used += 1.2;
  }
  EP %= 3;

  // EP(2)
  if (EP === 1 && TRAILER - used >= 0.8) {
    rows.push({ type: 'EP2' });
    used += 0.8;
    EP = 0;
  }

  let free = Math.max(0, (TRAILER - used).toFixed(2));

  document.getElementById('text').innerHTML = `
    <b>Zajęte:</b> ${used.toFixed(2)} m<br>
    <b>Wolne:</b> ${free} m
  `;

  draw(rows, free);
}

function draw(rows, free) {
  const trailer = document.getElementById('trailer');
  trailer.innerHTML = '';

  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'row';

    if (r.type === 'W') {
      row.innerHTML = `<div class="cell w"></div><div class="cell w"></div>`;
    }
    if (r.type === 'WEP') {
      row.innerHTML = `<div class="cell w"></div><div class="cell epw"></div>`;
    }
    if (r.type === 'EP3') {
      row.innerHTML = `<div class="cell ep3"></div><div class="cell ep3"></div><div class="cell ep3"></div>`;
    }
    if (r.type === 'EP2') {
      row.innerHTML = `<div class="cell ep2"></div><div class="cell ep2"></div>`;
    }

    trailer.appendChild(row);
  });

  if (free > 0) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="cell free"></div>`;
    trailer.appendChild(row);
  }
}

calculate();
</script>
</body>
</html>
