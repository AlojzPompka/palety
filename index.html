<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kalkulator załadunku W + EP</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f2f2;
    padding:20px;
}
.box{
    max-width:420px;
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin:auto;
}
input{
    width:100%;
    padding:10px;
    margin-bottom:12px;
    font-size:16px;
}
button{
    width:100%;
    padding:12px;
    background:#0a73ff;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
}
.result{
    margin-top:15px;
}
.trailer{
    margin-top:15px;
    background:#222;
    padding:8px;
    border-radius:8px;
}
.row{
    display:flex;
    margin-bottom:3px;
}
.cell{
    flex:1;
    height:16px;
    margin:1px;
    border-radius:3px;
}
.w{background:#5aa0e6;}
.wep{background:#f5a623;}
.ep3{background:#6bcf63;}
.ep2{background:#3f8f3f;}
.free{background:#bbb;}
.legend{
    font-size:12px;
    margin-top:6px;
}
</style>
</head>
<body>

<div class="box">
<h2>Kalkulator załadunku W + EP</h2>

<label>Palety W</label>
<input id="w" type="number" min="0" value="0">

<label>Palety EP</label>
<input id="ep" type="number" min="0" value="0">

<button onclick="licz()">Oblicz</button>

<div id="out" class="result"></div>
<div id="draw" class="trailer"></div>
</div>

<script>
const NACZEPA = 13.4;

function licz(){
    let w = +document.getElementById("w").value;
    let ep = +document.getElementById("ep").value;

    let rows = [];
    let used = 0;

    // Rzędy W
    let wRows = Math.floor(w / 2);
    w -= wRows * 2;
    used += wRows * 1.0;
    for(let i=0;i<wRows;i++) rows.push("W");

    // Rząd W+EP
    if(w >= 1 && ep >= 1){
        rows.push("WEP");
        w--; ep--;
        used += 1.0;
    }

    // EP(3)
    let ep3 = Math.floor(ep / 3);
    ep -= ep3 * 3;
    used += ep3 * 1.2;
    for(let i=0;i<ep3;i++) rows.push("EP3");

    // EP(2)
    let ep2 = Math.floor(ep / 2);
    ep -= ep2 * 2;
    used += ep2 * 0.8;
    for(let i=0;i<ep2;i++) rows.push("EP2");

    let free = +(NACZEPA - used).toFixed(2);

    // Co można dołożyć
    let addW = Math.floor(free / 1.0) * 2;
    let addEP3 = Math.floor(free / 1.2) * 3;
    let addEP2 = Math.floor(free / 0.8) * 2;

    document.getElementById("out").innerHTML = `
        <b>Zajęte:</b> ${used.toFixed(2)} m<br>
        <b>Wolne:</b> ${free} m
        <hr>
        <b>Można jeszcze doładować:</b><br>
        • ${addW} palet W<br>
        • ${addEP3} palet EP (rząd 3)<br>
        • ${addEP2} palet EP (rząd 2)
    `;

    rysuj(rows, free);
}

function rysuj(rows, free){
    let d = document.getElementById("draw");
    d.innerHTML = "";

    rows.forEach(r=>{
        let row = document.createElement("div");
        row.className="row";

        if(r==="W"){
            row.innerHTML = `<div class="cell w"></div><div class="cell w"></div>`;
        }
        if(r==="WEP"){
            row.innerHTML = `<div class="cell w"></div><div class="cell wep"></div>`;
        }
        if(r==="EP3"){
            row.innerHTML = `<div class="cell ep3"></div><div class="cell ep3"></div><div class="cell ep3"></div>`;
        }
        if(r==="EP2"){
            row.innerHTML = `<div class="cell ep2"></div><div class="cell ep2"></div>`;
        }
        d.appendChild(row);
    });

    let freeRows = Math.round(free / 0.2);
    for(let i=0;i<freeRows;i++){
        let r = document.createElement("div");
        r.className="row";
        r.innerHTML=`<div class="cell free"></div><div class="cell free"></div>`;
        d.appendChild(r);
    }

    d.innerHTML += `
    <div class="legend">
    Niebieski=W | Pomarańcz=W+EP | Jasno zielony=EP(3) | Ciemny=EP(2) | Szary=wolne
    </div>`;
}
</script>

</body>
</html>
