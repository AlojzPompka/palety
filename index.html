<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator załadunku W + EP</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f2f2f2;
  padding:20px;
}
h1{text-align:center}
label{font-weight:bold}
input{
  width:100%;
  padding:10px;
  font-size:16px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:14px;
  font-size:18px;
  background:#007aff;
  color:#fff;
  border:none;
  border-radius:8px;
}
#wynik{
  background:#fff;
  margin-top:20px;
  padding:15px;
  border-radius:8px;
}
hr{margin:15px 0}

/* ===== RYSUNEK ===== */
.naczepa{
  width:600px;        /* 13.4 m */
  max-width:100%;
  background:#222;
  padding:10px;
  border-radius:10px;
  margin:20px auto;
}
.rzad{
  display:flex;
  margin-bottom:4px;
}
.paleta{
  height:40px;
  border-radius:4px;
  margin-right:4px;
  color:#fff;
  font-size:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.w{background:#3498db; width:90px;}      /* 0.95 m */
.ep{background:#27ae60; width:60px;}     /* 1.2 m / 3 = 0.4 → wizual */
.ep2{background:#f39c12; width:80px;}    /* 0.8 m */
.wolne{
  background:#ccc;
  border:2px dashed #999;
}
</style>
</head>

<body>

<h1>Kalkulator załadunku W + EP</h1>

<label>Palety W:</label>
<input id="w" type="number" min="0" value="0">

<label>Palety EP:</label>
<input id="ep" type="number" min="0" value="0">

<button onclick="oblicz()">Oblicz</button>

<div id="wynik"></div>

<script>
function oblicz(){
  const DL = 13.4;
  const dW = 0.95;
  const dEP3 = 1.2;
  const dEP2 = 0.8;

  let w = +document.getElementById("w").value;
  let ep = +document.getElementById("ep").value;

  let zajete = 0;
  let instrukcja = [];
  let naczepaHTML = '<div class="naczepa">';

  /* ==== W ==== */
  let rzedyW = Math.ceil(w / 2);
  zajete += rzedyW * dW;

  for(let i=0;i<rzedyW;i++){
    naczepaHTML += `<div class="rzad"><div class="paleta w">W</div><div class="paleta w">W</div></div>`;
  }
  if(w>0) instrukcja.push(`${rzedyW} rzędów W (2 palety)`);

  /* ==== DOPYCH EP DO W ==== */
  let resztaW = w % 2;
  let epDopych = 0;
  if(resztaW && ep>0){
    ep--;
    epDopych = 1;
    naczepaHTML += `<div class="rzad"><div class="paleta ep2">EP</div></div>`;
    instrukcja.push("1 EP dopychany do W");
  }

  /* ==== EP 3 ==== */
  let rzedyEP3 = Math.floor(ep / 3);
  zajete += rzedyEP3 * dEP3;

  for(let i=0;i<rzedyEP3;i++){
    naczepaHTML += `
    <div class="rzad">
      <div class="paleta ep">EP</div>
      <div class="paleta ep">EP</div>
      <div class="paleta ep">EP</div>
    </div>`;
  }
  if(rzedyEP3>0) instrukcja.push(`${rzedyEP3} rzędy EP po 3`);

  /* ==== EP 2 ==== */
  let resztaEP = ep % 3;
  let ep2 = 0;
  if(resztaEP >= 2){
    ep2 = 1;
    zajete += dEP2;
    naczepaHTML += `
    <div class="rzad">
      <div class="paleta ep2">EP</div>
      <div class="paleta ep2">EP</div>
    </div>`;
    instrukcja.push("1 rząd EP po 2");
  }

  let wolne = +(DL - zajete).toFixed(2);

  /* ==== WOLNE MIEJSCE NA RYSUNKU ==== */
  if(wolne > 0){
    let px = Math.round((wolne / DL) * 600);
    naczepaHTML += `<div class="rzad"><div class="paleta wolne" style="width:${px}px"></div></div>`;
  }

  naczepaHTML += "</div>";

  /* ==== WYNIK ==== */
  let html = `
  <b>Zajęta długość:</b> ${zajete.toFixed(2)} m<br>
  <b>Wolne miejsce:</b> ${wolne>0 ? wolne+" m" : "0 m"}<br>
  ${wolne<0 ? "<b>ZA DUŻO PALET – usuń "+Math.abs(wolne).toFixed(2)+" m</b>" : ""}
  <hr>`;

  if(wolne>=0){
    html += "<b>Instrukcja załadunku:</b><ol>";
    instrukcja.forEach(i=>html+=`<li>${i}</li>`);
    html += "</ol>";
  } else {
    html += "<b>Nie można załadować – za dużo palet</b>";
  }

  document.getElementById("wynik").innerHTML = html + naczepaHTML;
}
</script>

</body>
</html>
