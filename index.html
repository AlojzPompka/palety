<!DOCTYPE html>

<html lang="pl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Grzyby – Auto</title>

<link rel="stylesheet"

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body, #map {

    height:100%;

    width:100%;

    margin:0;

}

body {

    font-family:-apple-system,BlinkMacSystemFont,sans-serif;

    background:#111;

    overflow:hidden;

}

#map {

    position:absolute;

    inset:0;

}

/* PANEL */

#panel {

    position:fixed;

    z-index:9999;

    left:10px;

    right:10px;

    bottom:20px;

    background:rgba(0,0,0,.86);

    color:white;

    padding:12px;

    border-radius:18px;

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

}

#status {

    text-align:center;

    font-size:14px;

    margin-bottom:3px;

}

#distance {

    text-align:center;

    font-size:29px;

    font-weight:800;

}

/* STRZAŁKA */

#arrowBox {

    display:none;

    text-align:center;

    height:100px;

    position:relative;

}

#arrow {

    position:absolute;

    left:50%;

    top:50%;

    width:70px;

    height:70px;

    margin-left:-35px;

    margin-top:-35px;

    font-size:68px;

    line-height:70px;

    transform-origin:50% 50%;

    transition:

        transform .08s linear;

    will-change:transform;

}

#directionText {

    font-size:13px;

    opacity:.8;

}

/* PRZYCISKI */

.buttons {

    display:flex;

    gap:8px;

    margin-top:8px;

}

button {

    flex:1;

    border:0;

    border-radius:13px;

    padding:15px 5px;

    font-size:16px;

    font-weight:800;

}

#park {

    background:#2ecc71;

    color:#000;

}

#back {

    background:#ff9500;

    color:#000;

}

#reset {

    background:#e74c3c;

    color:#fff;

}

</style>

</head>

<body>

<div id="map"></div>

<div id="panel">

    <div id="status">

        Czekam na GPS…

    </div>

    <div id="distance">

        —

    </div>

    <div id="arrowBox">

        <div id="arrow">

            ↑

        </div>

    </div>

    <div id="directionText"

         style="display:none;text-align:center">

        Kierunek do auta

    </div>

    <div class="buttons">

        <button id="park">

            🚗 ZAPARKOWAŁEM

        </button>

        <button id="back">

            ↩️ WRÓĆ

        </button>

        <button id="reset">

            RESET

        </button>

    </div>

</div>

<script

src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

</script>

<script>

/* =========================================

   MAPA

========================================= */

const map = L.map(

    "map",

    {

        zoomControl:false

    }

).setView([52,19],6);

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom:19,

        attribution:"© OpenStreetMap"

    }

).addTo(map);

/* =========================================

   ZMIENNE

========================================= */

let current = null;

let car =

    JSON.parse(

        localStorage.getItem("carPosition")

        || "null"

    );

let userMarker = null;

let carMarker = null;

let returnLine = null;

let returnMode = false;

/*

Kierunek, w którym skierowany

jest telefon.

0   = północ

90  = wschód

180 = południe

270 = zachód

*/

let phoneHeading = null;

/* =========================================

   WCZYTANIE AUTA

========================================= */

if(car){

    carMarker =

        L.marker(

            [car.lat,car.lng]

        ).addTo(map);

    carMarker.bindPopup(

        "🚗 TWOJE AUTO"

    );

    /*

    Jeżeli auto jest już zapisane,

    nie można przypadkiem

    zapisać go drugi raz.

    */

    document.getElementById(

        "park"

    ).style.display =

        "none";

}

/* =========================================

   ODLEGŁOŚĆ

========================================= */

function getDistance(

    lat1,

    lon1,

    lat2,

    lon2

){

    const R = 6371000;

    const p1 =

        lat1 * Math.PI / 180;

    const p2 =

        lat2 * Math.PI / 180;

    const dp =

        (lat2-lat1) *

        Math.PI / 180;

    const dl =

        (lon2-lon1) *

        Math.PI / 180;

    const a =

        Math.sin(dp/2) *

        Math.sin(dp/2)

        +

        Math.cos(p1) *

        Math.cos(p2) *

        Math.sin(dl/2) *

        Math.sin(dl/2);

    return R * 2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1-a)

        );

}

/* =========================================

   KIERUNEK GPS DO AUTA

   Wynik:

   0   północ

   90  wschód

   180 południe

========================================= */

function bearingToCar(){

    if(!current || !car)

        return null;

    const lat1 =

        current.lat *

        Math.PI/180;

    const lat2 =

        car.lat *

        Math.PI/180;

    const dLon =

        (car.lng-current.lng) *

        Math.PI/180;

    const y =

        Math.sin(dLon) *

        Math.cos(lat2);

    const x =

        Math.cos(lat1) *

        Math.sin(lat2)

        -

        Math.sin(lat1) *

        Math.cos(lat2) *

        Math.cos(dLon);

    let bearing =

        Math.atan2(y,x) *

        180/Math.PI;

    return (

        bearing + 360

    ) % 360;

}

/* =========================================

   STRZAŁKA

   TO JEST NAJWAŻNIEJSZA CZĘŚĆ.

   kierunek auta

   MINUS

   kierunek telefonu

   daje kierunek auta

   względem CIEBIE.

========================================= */

function updateArrow(){

    if(!returnMode)

        return;

    if(!current || !car)

        return;

    if(phoneHeading === null){

        document.getElementById(

            "directionText"

        ).innerText =

            "Czekam na kompas…";

        return;

    }

    const targetBearing =

        bearingToCar();

    /*

    Przykład:

    Auto = północ = 0°

    Patrzysz na północ = 0°

    0 - 0 = 0

    STRZAŁKA ↑

    Patrzysz na południe = 180°

    0 - 180 = -180

    STRZAŁKA ↓

    */

    let relative =

        targetBearing -

        phoneHeading;

    /*

    Normalizacja kąta

    */

    relative =

        (

            relative +

            360

        ) % 360;

    document.getElementById(

        "arrow"

    ).style.transform =

        "rotate(" +

        relative +

        "deg)";

    document.getElementById(

        "directionText"

    ).innerText =

        "Kierunek do auta";

}

/* =========================================

   LINIA PROSTA DO AUTA

========================================= */

function updateReturn(){

    if(!returnMode)

        return;

    if(!current || !car)

        return;

    const points = [

        [

            current.lat,

            current.lng

        ],

        [

            car.lat,

            car.lng

        ]

    ];

    if(!returnLine){

        returnLine =

            L.polyline(

                points,

                {

                    color:"red",

                    weight:6,

                    opacity:.9,

                    dashArray:"12,8"

                }

            ).addTo(map);

    }else{

        returnLine.setLatLngs(

            points

        );

    }

    /* ODLEGŁOŚĆ */

    const d =

        getDistance(

            current.lat,

            current.lng,

            car.lat,

            car.lng

        );

    if(d >= 1000){

        document.getElementById(

            "distance"

        ).innerText =

            "🚗 " +

            (d/1000).toFixed(2) +

            " km";

    }else{

        document.getElementById(

            "distance"

        ).innerText =

            "🚗 " +

            Math.round(d) +

            " m";

    }

    updateArrow();

}

/* =========================================

   GPS

========================================= */

function gpsUpdate(pos){

    const lat =

        pos.coords.latitude;

    const lng =

        pos.coords.longitude;

    const accuracy =

        pos.coords.accuracy;

    current = {

        lat:lat,

        lng:lng,

        accuracy:accuracy

    };

    document.getElementById(

        "status"

    ).innerText =

        "GPS ±" +

        Math.round(accuracy) +

        " m";

    if(!userMarker){

        userMarker =

            L.circleMarker(

                [lat,lng],

                {

                    radius:9,

                    color:"white",

                    weight:3,

                    fillColor:"#007aff",

                    fillOpacity:1

                }

            ).addTo(map);

        map.setView(

            [lat,lng],

            17

        );

    }else{

        userMarker.setLatLng(

            [lat,lng]

        );

    }

    /*

    Każda nowa pozycja GPS

    aktualizuje:

    - linię

    - dystans

    - kierunek

    */

    updateReturn();

}

function gpsError(error){

    document.getElementById(

        "status"

    ).innerText =

        "Błąd GPS: " +

        error.message;

}

navigator.geolocation.watchPosition(

    gpsUpdate,

    gpsError,

    {

        enableHighAccuracy:true,

        maximumAge:0,

        timeout:15000

    }

);

/* =========================================

   KOMPAS IPHONE

========================================= */

function compassUpdate(event){

    let heading = null;

    /*

    iPhone / Safari

    webkitCompassHeading daje

    bezpośrednio kierunek kompasu.

    */

    if(

        typeof

        event.webkitCompassHeading

        === "number"

    ){

        heading =

            event.webkitCompassHeading;

    }

    /*

    Awaryjnie inne urządzenia

    */

    else if(

        typeof event.alpha

        === "number"

    ){

        heading =

            360 -

            event.alpha;

    }

    if(heading === null)

        return;

    phoneHeading =

        (

            heading +

            360

        ) % 360;

    /*

    TO POWODUJE CIĄGŁĄ

    AKTUALIZACJĘ STRZAŁKI

    PODCZAS OBRACANIA TELEFONU.

    */

    updateArrow();

}

/* =========================================

   URUCHOMIENIE KOMPASU

========================================= */

async function startCompass(){

    /*

    iPhone wymaga, żeby pytanie

    o zgodę pojawiło się po

    naciśnięciu przycisku.

    */

    if(

        typeof DeviceOrientationEvent

        !== "undefined"

        &&

        typeof

        DeviceOrientationEvent.requestPermission

        === "function"

    ){

        try{

            const permission =

                await

                DeviceOrientationEvent

                .requestPermission();

            if(

                permission ===

                "granted"

            ){

                window.addEventListener(

                    "deviceorientation",

                    compassUpdate,

                    true

                );

            }else{

                document.getElementById(

                    "directionText"

                ).innerText =

                    "Brak dostępu do kompasu";

            }

        }catch(e){

            document.getElementById(

                "directionText"

            ).innerText =

                "Nie udało się uruchomić kompasu";

        }

    }else{

        window.addEventListener(

            "deviceorientation",

            compassUpdate,

            true

        );

    }

}

/* =========================================

   ZAPARKOWAŁEM

========================================= */

document.getElementById(

    "park"

).onclick =

function(){

    if(!current){

        alert(

            "Poczekaj na GPS."

        );

        return;

    }

    car = {

        lat:current.lat,

        lng:current.lng

    };

    /*

    Trwały zapis punktu auta.

    */

    localStorage.setItem(

        "carPosition",

        JSON.stringify(car)

    );

    if(carMarker){

        map.removeLayer(

            carMarker

        );

    }

    carMarker =

        L.marker(

            [

                car.lat,

                car.lng

            ]

        ).addTo(map);

    carMarker

        .bindPopup(

            "🚗 AUTO ZAPISANE"

        )

        .openPopup();

    /*

    PO ZAPISANIU

    PRZYCISK ZNIKA.

    */

    document.getElementById(

        "park"

    ).style.display =

        "none";

    document.getElementById(

        "distance"

    ).innerText =

        "🚗 AUTO ZAPISANE";

};

/* =========================================

   WRÓĆ

========================================= */

document.getElementById(

    "back"

).onclick =

async function(){

    if(!car){

        alert(

            "Najpierw zapisz auto."

        );

        return;

    }

    if(!current){

        alert(

            "Czekam na GPS."

        );

        return;

    }

    /*

    Najpierw kompas.

    */

    await startCompass();

    returnMode = true;

    document.getElementById(

        "arrowBox"

    ).style.display =

        "block";

    document.getElementById(

        "directionText"

    ).style.display =

        "block";

    updateReturn();

    /*

    Pokazujemy na mapie

    użytkownika i auto.

    */

    map.fitBounds(

        [

            [

                current.lat,

                current.lng

            ],

            [

                car.lat,

                car.lng

            ]

        ],

        {

            paddingTopLeft:

                [50,50],

            paddingBottomRight:

                [50,250]

        }

    );

};

/* =========================================

   RESET

========================================= */

document.getElementById(

    "reset"

).onclick =

function(){

    if(

        !confirm(

            "Usunąć zapisane miejsce auta?"

        )

    ){

        return;

    }

    localStorage.removeItem(

        "carPosition"

    );

    car = null;

    returnMode = false;

    if(carMarker){

        map.removeLayer(

            carMarker

        );

        carMarker = null;

    }

    if(returnLine){

        map.removeLayer(

            returnLine

        );

        returnLine = null;

    }

    document.getElementById(

        "arrowBox"

    ).style.display =

        "none";

    document.getElementById(

        "directionText"

    ).style.display =

        "none";

    document.getElementById(

        "distance"

    ).innerText =

        "—";

    /*

    Dopiero po RESET

    można zapisać nowe auto.

    */

    document.getElementById(

        "park"

    ).style.display =

        "block";

};

</script>

</body>

</html>
